<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>モヨモヨ - Moyomoyo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  /* Soft candy bokeh dots tiled across the full viewport, so on wide
     screens (e.g. iPad landscape) the margins beside the portrait game
     read as intentional decoration instead of empty dead space. */
  background:
    radial-gradient(circle, rgba(255,180,220,0.09) 0 5px, transparent 6px) 20px 30px / 220px 220px repeat,
    radial-gradient(circle, rgba(255,180,220,0.07) 0 7px, transparent 8px) 140px 160px / 320px 320px repeat,
    radial-gradient(circle, rgba(200,160,255,0.08) 0 4px, transparent 5px) 60px 220px / 260px 260px repeat,
    radial-gradient(circle, rgba(255,210,230,0.06) 0 6px, transparent 7px) 200px 60px / 380px 380px repeat,
    linear-gradient(160deg, #2A1840 0%, #4A2560 55%, #331A48 100%);
  font-family: 'Helvetica Neue', Arial, sans-serif;
  user-select: none;
  overflow: hidden;
  touch-action: none;
}
/* Left/right control columns sit outside the canvas so they can be big
   and work the same way in portrait or landscape — the canvas no longer
   reserves its own bottom strip for buttons. */
#game-layout {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 2vw, 18px);
  width: 100vw;
  height: 100vh;
  height: 100dvh;
}
.side-col {
  display: flex;
  flex-direction: column;
  gap: clamp(8px, 2vw, 18px);
  flex: 0 0 auto;
  visibility: hidden;
}
.ctrl-btn {
  width: clamp(64px, 15vw, 116px);
  height: clamp(64px, 15vw, 116px);
  border-radius: clamp(16px, 4vw, 26px);
  background: rgba(255,111,168,0.85);
  border: none;
  color: white;
  font-size: clamp(26px, 7vw, 46px);
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255,111,168,0.4);
  touch-action: manipulation;
}
.ctrl-btn:active { background: #FF8FBC; }
#wrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1 1 auto;
  min-width: 0;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  /* No explicit height: the wrapper shrink-wraps to the canvas below it
     so the HUD (absolutely positioned against this box) sits flush
     against the grid instead of floating in leftover vertical space. */
}
/* Canvas keeps its 426:588 aspect ratio and fills up to the available
   height (100dvh, mobile-Safari-toolbar-safe), shrinking by width
   instead whenever the side button columns leave less room than that. */
canvas {
  display: block;
  cursor: pointer;
  aspect-ratio: 426 / 700;
  height: 100vh;
  height: 100dvh;
  max-height: min(950px, calc(100vh - 16px));
  max-height: min(950px, calc(100dvh - 16px));
  max-width: 100%;
  width: auto;
}
#hud {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 12px 14px;
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none;
}
#score-display {
  background: linear-gradient(135deg, rgba(255,111,168,0.30), rgba(79,157,255,0.25));
  color: #FFE066;
  font-size: 27px; font-weight: 900;
  padding: 8px 20px; border-radius: 16px;
  letter-spacing: 0.5px;
  text-shadow: 0 0 14px rgba(255,224,102,0.75), 0 2px 4px rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,224,102,0.35);
}
#best-display {
  background: rgba(40,15,55,0.4);
  color: rgba(255,255,255,0.75);
  font-size: 13px;
  padding: 5px 12px; border-radius: 20px;
  margin-top: 8px;
}
#time-display {
  background: rgba(40,15,55,0.4);
  color: rgba(255,255,255,0.75);
  font-size: 13px;
  padding: 5px 12px; border-radius: 20px;
  margin-top: 6px;
}
#pause-btn {
  pointer-events: all;
  background: rgba(40,15,55,0.55);
  color: white;
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 50%;
  width: 44px; height: 44px;
  font-size: 18px;
  cursor: pointer;
}
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(20,5,30,0.6);
  backdrop-filter: blur(4px);
  pointer-events: all;
}
#overlay.hidden { display: none; }
#overlay h1 { color: #fff; font-size: 30px; margin-bottom: 8px; text-shadow: 0 2px 12px rgba(0,0,0,0.5); text-align: center; }
#overlay p { color: #FFE066; font-size: 16px; margin-bottom: 24px; text-align: center; white-space: pre-line; }
#overlay button {
  background: #FF6FA8; color: #fff;
  border: none; border-radius: 30px;
  padding: 12px 32px; font-size: 18px; font-weight: 700;
  cursor: pointer; transition: transform 0.15s, background 0.15s;
  box-shadow: 0 4px 16px rgba(255,111,168,0.4);
}
#overlay button:hover { background: #FF8FBC; transform: scale(1.05); }
#rotate-hint {
  display: none;
  position: fixed; inset: 0; z-index: 999;
  background: #241238;
  flex-direction: column; align-items: center; justify-content: center;
  color: white; font-size: 18px; gap: 16px;
}
#rotate-hint span { font-size: 56px; animation: rotate-hint-spin 1.5s ease-in-out infinite alternate; }
@keyframes rotate-hint-spin { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }
@media (max-width: 600px) and (orientation: portrait) {
  #rotate-hint { display: flex; }
  #game-layout { display: none; }
}
</style>
</head>
<body>
<div id="game-layout">
  <div class="side-col" id="left-col">
    <button class="ctrl-btn" data-action="left" aria-label="左へ">◀</button>
    <button class="ctrl-btn" data-action="down" aria-label="下へ">▼</button>
  </div>
  <div id="wrapper">
    <canvas id="c"></canvas>
    <div id="hud" style="visibility:hidden">
      <div>
        <div id="score-display">Lv.1  スコア: 0</div>
        <div id="best-display">ベスト: 0</div>
        <div id="time-display">⏱ 0:00</div>
      </div>
      <button id="pause-btn" title="一時停止">⏸</button>
    </div>
    <div id="overlay" class="hidden">
      <h1 id="ov-title"></h1>
      <p id="ov-sub"></p>
      <button id="ov-btn">もう一度！</button>
    </div>
  </div>
  <div class="side-col" id="right-col">
    <button class="ctrl-btn" data-action="right" aria-label="右へ">▶</button>
    <button class="ctrl-btn" data-action="rotate" aria-label="回転">🔄</button>
  </div>
</div>
<div id="rotate-hint">
  <span>📱</span>
  <p>横向きにしてプレイ！</p>
</div>

<script>
// ─── CANVAS ───────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 426, H = 700;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

// ─── CONFIG ───────────────────────────────────────────────────
const CELL       = 42;
const GRID_COLS  = 9;   // 150% of the original 6 columns — wider use of the screen
const GRID_ROWS  = 12;
const GRID_W     = CELL * GRID_COLS;
const GRID_H     = CELL * GRID_ROWS;
const GRID_X0    = (W - GRID_W) / 2;
const GRID_Y0    = 176; // tall enough to clear the 3-line HTML HUD overlay
const SPAWN_COL  = 4;
const MATCH_MIN  = 4;
const LEVEL_STEP = 200; // score needed per level
const MAGIC_CHANCE = 0.025; // ~2.5% of spawned pieces are マジックモヨモヨ

const PAUSE_RESUME_Y = H * 0.48;
const PAUSE_QUIT_Y   = PAUSE_RESUME_Y + 66;

// Colors are spread across distinct hues (not a same-family gradient) so
// each stage reads at a glance during fast match play — size/name still
// carry the growth story, color is purely the "which type is this" cue.
// Chain shortened to 4 stages: モクモク (pink) is now the final tier — a
// 4+ group of it clears outright instead of "evolving" past the character's
// own normal form into another color.
const STAGES = [
  { name: 'たまごモク', r: 17, color: '#CFF2C2', face: '#8A6A40', pts: 1 }, // mint
  { name: 'ひよこモク', r: 25, color: '#FFE14D', face: '#8A6A10', pts: 2 }, // yellow
  { name: 'ひなモク',   r: 33, color: '#FF9540', face: '#6A4010', pts: 4 }, // orange
  { name: 'モクモク',   r: 42, color: '#FF5C7A', face: '#4A2800', pts: 8, legendary: true }, // pink, final tier
];
const SPAWN_POOL = [0,1,2]; // even 1:1:1 spread — orange was underrepresented before

// Satellite offset (dCol,dRow) relative to the axis cell, per rotation state
const ROT_OFFSETS = [[0,-1],[1,0],[0,1],[-1,0]]; // up, right, down, left

// ─── STATE ────────────────────────────────────────────────────
let state = 'TITLE'; // TITLE | PLAYING | PAUSED | GAMEOVER
let phase = 'FALL';  // FALL | LOCK_PAUSE | RESOLVING | SPAWN_PAUSE
let pauseTimer = 0;
let fallTimer = 0;
let chainCount = 0;
let score = 0;
let bestScore = parseInt(localStorage.getItem('moyomoyo-best') || '0', 10);
let grid = [];        // grid[col][row] = stage number | null
let magicGrid = [];   // magicGrid[col][row] = true if that cell is マジックモヨモヨ
let piece = null;     // { col, row, rot, s1, s2 (stages), m1, m2 (magic flags) }
let nextPair = null;  // { s1, s2, m1, m2 } pre-rolled preview
let particles = [];
let comboText = '';
let comboTimer = 0;
let legendText = '';
let legendTimer = 0;
let celebrateText = '';
let celebrateTimer = 0;
let popTimer = 0;
let popStage = 0;
let level = 1;
let pendingLevelPreset = false;
let titleFrame = 0;
let shakeX = 0, shakeY = 0;
let flashAlpha = 0;
let playFrames = 0;

function rollStage() { return SPAWN_POOL[Math.floor(Math.random() * SPAWN_POOL.length)]; }
function rollPair() {
  return { s1: rollStage(), s2: rollStage(), m1: Math.random() < MAGIC_CHANCE, m2: Math.random() < MAGIC_CHANCE };
}
function newGrid() { return Array.from({ length: GRID_COLS }, () => new Array(GRID_ROWS).fill(null)); }
function newMagicGrid() { return Array.from({ length: GRID_COLS }, () => new Array(GRID_ROWS).fill(false)); }

// ─── PARTICLES ────────────────────────────────────────────────

class Particle {
  constructor(x, y, vx, vy, col, sz, life) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.col = col; this.sz = sz;
    this.alpha = 1;
    this.life = life || 30;
    this.age = 0;
  }
  update() {
    this.vy += 0.15;
    this.x += this.vx; this.y += this.vy;
    this.age++;
    this.alpha = 1 - this.age / this.life;
    this.sz *= 0.94;
  }
  get alive() { return this.age < this.life; }
}

function addParticles(x, y, col, count, sz) {
  for (let i = 0; i < count; i++) {
    const a = Math.PI * 2 * i / count + Math.random() * 0.5;
    const sp = 1.5 + Math.random() * 4;
    particles.push(new Particle(x, y, Math.cos(a)*sp, Math.sin(a)*sp - 1.5, col, sz || 4));
  }
}

function addShake(intensity) {
  shakeX = (Math.random() - 0.5) * intensity * 2;
  shakeY = (Math.random() - 0.5) * intensity * 2;
}

// ─── GRID HELPERS ─────────────────────────────────────────────

function rotOffset(col, row, rot) {
  const d = ROT_OFFSETS[rot];
  return { col: col + d[0], row: row + d[1] };
}

function canPlace(col, row, rot) {
  if (col < 0 || col >= GRID_COLS || row < 0 || row >= GRID_ROWS) return false;
  if (grid[col][row] !== null) return false;
  const sat = rotOffset(col, row, rot);
  if (sat.col < 0 || sat.col >= GRID_COLS || sat.row < 0 || sat.row >= GRID_ROWS) return false;
  if (grid[sat.col][sat.row] !== null) return false;
  return true;
}

function moveLeft()  { if (piece && canPlace(piece.col - 1, piece.row, piece.rot)) piece.col--; }
function moveRight() { if (piece && canPlace(piece.col + 1, piece.row, piece.rot)) piece.col++; }
function rotatePiece() {
  if (!piece) return;
  const newRot = (piece.rot + 3) % 4; // counter-clockwise
  if (canPlace(piece.col, piece.row, newRot)) { piece.rot = newRot; return; }
  if (canPlace(piece.col - 1, piece.row, newRot)) { piece.col--; piece.rot = newRot; return; }
  if (canPlace(piece.col + 1, piece.row, newRot)) { piece.col++; piece.rot = newRot; return; }
}
function softDrop() {
  if (!piece) return;
  if (canPlace(piece.col, piece.row + 1, piece.rot)) { piece.row++; score += 1; updateHUD(); }
}

function lockPiece() {
  const sat = rotOffset(piece.col, piece.row, piece.rot);
  grid[piece.col][piece.row] = piece.s1;
  magicGrid[piece.col][piece.row] = !!piece.m1;
  grid[sat.col][sat.row] = piece.s2;
  magicGrid[sat.col][sat.row] = !!piece.m2;
  piece = null;
  phase = 'LOCK_PAUSE';
  pauseTimer = 10;
}

function trySpawnPiece() {
  if (grid[SPAWN_COL][1] !== null || grid[SPAWN_COL][0] !== null) { gameOver(); return; }
  piece = { col: SPAWN_COL, row: 1, rot: 0, s1: nextPair.s1, s2: nextPair.s2, m1: nextPair.m1, m2: nextPair.m2 };
  nextPair = rollPair();
  fallTimer = 0;
}

function findGroups() {
  const visited = Array.from({ length: GRID_COLS }, () => new Array(GRID_ROWS).fill(false));
  const groups = [];
  for (let c = 0; c < GRID_COLS; c++) {
    for (let r = 0; r < GRID_ROWS; r++) {
      if (grid[c][r] === null || visited[c][r]) continue;
      const stage = grid[c][r];
      const stack = [[c, r]];
      visited[c][r] = true;
      const cells = [];
      while (stack.length) {
        const [cc, rr] = stack.pop();
        cells.push([cc, rr]);
        [[cc+1,rr],[cc-1,rr],[cc,rr+1],[cc,rr-1]].forEach(([nc, nr]) => {
          if (nc < 0 || nc >= GRID_COLS || nr < 0 || nr >= GRID_ROWS) return;
          if (visited[nc][nr] || grid[nc][nr] !== stage) return;
          visited[nc][nr] = true;
          stack.push([nc, nr]);
        });
      }
      if (cells.length >= MATCH_MIN) groups.push({ stage, cells });
    }
  }
  return groups;
}

function applyGravity() {
  // Moves magicGrid flags in lockstep with grid so a マジックモヨモヨ never
  // desyncs from its own cell when the column compacts.
  for (let c = 0; c < GRID_COLS; c++) {
    const stages = [], magics = [];
    for (let r = 0; r < GRID_ROWS; r++) {
      if (grid[c][r] !== null) { stages.push(grid[c][r]); magics.push(magicGrid[c][r]); }
    }
    for (let r = 0; r < GRID_ROWS; r++) { grid[c][r] = null; magicGrid[c][r] = false; }
    const startRow = GRID_ROWS - stages.length;
    stages.forEach((stage, i) => { grid[c][startRow + i] = stage; magicGrid[c][startRow + i] = magics[i]; });
  }
}

function cellCenter(col, row) {
  return { x: GRID_X0 + col*CELL + CELL/2, y: GRID_Y0 + row*CELL + CELL/2 };
}

function resolveStep() {
  const groups = findGroups();
  if (groups.length === 0) return false;
  chainCount++;
  const mult = 1 + (chainCount - 1) * 0.5;
  let topStageThisStep = 0;
  let magicFired = false;

  groups.forEach(g => {
    let anchor = g.cells[0];
    g.cells.forEach(cell => {
      if (cell[1] > anchor[1] || (cell[1] === anchor[1] && cell[0] < anchor[0])) anchor = cell;
    });
    // Capture which cells in this group were マジックモヨモヨ before clearing them.
    const magicCells = g.cells.filter(([c, r]) => magicGrid[c][r]);
    g.cells.forEach(([c, r]) => { grid[c][r] = null; magicGrid[c][r] = false; });
    const { x: mx, y: my } = cellCenter(anchor[0], anchor[1]);
    if (g.stage < STAGES.length - 1) {
      const newStage = g.stage + 1;
      grid[anchor[0]][anchor[1]] = newStage;
      score += Math.round(STAGES[newStage].pts * mult);
      topStageThisStep = Math.max(topStageThisStep, newStage);
      if (STAGES[newStage].legendary) {
        score += 100;
        legendText = '🎉 モクモク進化！ +100';
        legendTimer = 130;
        addParticles(mx, my, '#FF5C7A', 26, 6);
      }
    } else {
      score += Math.round(150 * mult);
      topStageThisStep = Math.max(topStageThisStep, g.stage);
      legendText = '🎉 モクモク大連鎖！ +150';
      legendTimer = 130;
      addParticles(mx, my, '#FF5C7A', 30, 7);
    }
    addParticles(mx, my, STAGES[g.stage].color, 10 + g.cells.length * 2, 4);

    // マジックモヨモヨ: wipe out everything directly touching each magic
    // cell in the cleared group, regardless of its own stage.
    magicCells.forEach(([mc, mr]) => {
      magicFired = true;
      [[mc+1,mr],[mc-1,mr],[mc,mr+1],[mc,mr-1]].forEach(([nc, nr]) => {
        if (nc < 0 || nc >= GRID_COLS || nr < 0 || nr >= GRID_ROWS) return;
        if (grid[nc][nr] === null) return;
        const wipedStage = grid[nc][nr];
        const { x: wx, y: wy } = cellCenter(nc, nr);
        score += Math.round(STAGES[wipedStage].pts * 2);
        addParticles(wx, wy, STAGES[wipedStage].color, 12, 5);
        grid[nc][nr] = null;
        magicGrid[nc][nr] = false;
      });
    });
  });

  if (magicFired) {
    legendText = '✨ マジックモヨモヨ炸裂！';
    legendTimer = 130;
    addShake(14);
  }

  addShake(4 + chainCount * 2);
  if (chainCount > 1) {
    comboText = `${chainCount}れんさ！ ×${mult.toFixed(1)}`;
    comboTimer = 90;
  }
  if (chainCount >= 2) {
    popStage = topStageThisStep;
    popTimer = 50;
  }
  if (chainCount >= 3) {
    const isBig = chainCount >= 5;
    celebrateText = isBig ? '🎉🎉 大連鎖！！ 🎉🎉' : '🎉 3連鎖ボーナス！';
    celebrateTimer = 110;
    flashAlpha = isBig ? 0.7 : 0.5;
    const burstCols = ['#FFD700', '#FF6FA8', '#4F9DFF', '#FFE14D', '#CFF2C2', '#FF9540'];
    const burstCount = isBig ? 10 : 6;
    for (let i = 0; i < burstCount; i++) {
      const bx = GRID_X0 + Math.random() * GRID_W;
      const by = GRID_Y0 + Math.random() * GRID_H * 0.7;
      addParticles(bx, by, burstCols[Math.floor(Math.random() * burstCols.length)], 24, 6);
    }
    addShake(16 + chainCount * 2);
  }
  checkLevelUp();
  updateHUD();
  applyGravity();
  return true;
}

function checkLevelUp() {
  const newLevel = 1 + Math.floor(score / LEVEL_STEP);
  if (newLevel <= level) return;
  level = newLevel;
  pendingLevelPreset = true;
  celebrateText = `⬆️ Lv.${level} UP！盤面リセット！`;
  celebrateTimer = 100;
  flashAlpha = 0.5;
  addShake(10);
}

function applyLevelPreset() {
  // Instead of adding garbage onto the existing board, the level-up wipes
  // the board and seeds it with a fresh preset — bottom rows fill in as
  // the level climbs, mirroring how falling-block games raise the floor.
  grid = newGrid();
  magicGrid = newMagicGrid();
  const presetRows = Math.min(level - 1, 5);
  for (let i = 0; i < presetRows; i++) {
    const r = GRID_ROWS - 1 - i;
    for (let c = 0; c < GRID_COLS; c++) {
      if (Math.random() < 0.78) grid[c][r] = rollStage();
    }
  }
}

function updateHUD() {
  document.getElementById('score-display').textContent = `Lv.${level}  スコア: ${score}`;
  document.getElementById('best-display').textContent = `ベスト: ${Math.max(score, bestScore)}`;
}

function updateTimeDisplay() {
  const secs = Math.floor(playFrames / 60);
  const mm = Math.floor(secs / 60);
  const ss = secs % 60;
  document.getElementById('time-display').textContent = `⏱ ${mm}:${String(ss).padStart(2, '0')}`;
}

// ─── DRAW ─────────────────────────────────────────────────────

function drawGummyShape(x, y, r, color, face, angle, scale, legendary, magic) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);

  if (magic) {
    const hue = (Date.now() * 0.25) % 360;
    ctx.save();
    ctx.strokeStyle = `hsl(${hue},90%,68%)`;
    ctx.lineWidth = r * 0.16;
    ctx.shadowColor = `hsl(${hue},90%,68%)`; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.roundRect(-r*1.0, -r*1.0, r*2.0, r*2.0, r*0.55); ctx.stroke();
    ctx.restore();
  }

  if (legendary) { ctx.shadowColor = '#FFE080'; ctx.shadowBlur = 18; }

  const s = r * 1.62;
  const rad = r * 0.42;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(-s/2, -s/2, s, s, rad);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.beginPath();
  ctx.roundRect(-s/2 + s*0.12, -s/2 + s*0.1, s*0.4, s*0.22, rad*0.6);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(232,213,176,0.92)';
  ctx.beginPath(); ctx.ellipse(0, r*0.05, r*0.56, r*0.6, 0, 0, Math.PI*2); ctx.fill();

  const eyeR = r * 0.13;
  ctx.fillStyle = '#181818';
  ctx.beginPath(); ctx.ellipse(-r*0.27, -r*0.04, eyeR*0.8, eyeR, -0.08, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.27, -r*0.04, eyeR*0.8, eyeR, 0.08, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(-r*0.22, -r*0.09, eyeR*0.28, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.31, -r*0.09, eyeR*0.28, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = '#4A1800'; ctx.lineWidth = r * 0.075; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r*0.42, -r*0.27); ctx.lineTo(-r*0.12, -r*0.15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r*0.12, -r*0.15); ctx.lineTo(r*0.42, -r*0.27); ctx.stroke();

  ctx.fillStyle = '#D97818';
  ctx.beginPath(); ctx.ellipse(0, r*0.17, r*0.1, r*0.12, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#3DA890';
  ctx.beginPath(); ctx.ellipse(-r*0.18, r*0.44, r*0.16, r*0.085, -0.35, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.18, r*0.44, r*0.16, r*0.085, 0.35, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2A7868';
  ctx.beginPath(); ctx.arc(0, r*0.44, r*0.05, 0, Math.PI*2); ctx.fill();

  if (magic) {
    ctx.save();
    ctx.font = `${Math.round(r*0.55)}px Arial`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('✨', r*0.62, -r*0.62);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  ctx.restore();
}

function drawGridPanel() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#3A2050'); bg.addColorStop(1, '#241238');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.roundRect(GRID_X0 - 6, GRID_Y0 - 6, GRID_W + 12, GRID_H + 12, 10); ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
  for (let c = 1; c < GRID_COLS; c++) {
    const x = GRID_X0 + c * CELL;
    ctx.beginPath(); ctx.moveTo(x, GRID_Y0); ctx.lineTo(x, GRID_Y0 + GRID_H); ctx.stroke();
  }
  for (let r = 1; r < GRID_ROWS; r++) {
    const y = GRID_Y0 + r * CELL;
    ctx.beginPath(); ctx.moveTo(GRID_X0, y); ctx.lineTo(GRID_X0 + GRID_W, y); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,143,196,0.35)'; ctx.lineWidth = 2;
  ctx.strokeRect(GRID_X0, GRID_Y0, GRID_W, GRID_H);
}

function drawGridCells() {
  for (let c = 0; c < GRID_COLS; c++) {
    for (let r = 0; r < GRID_ROWS; r++) {
      const stage = grid[c][r];
      if (stage === null) continue;
      const { x, y } = cellCenter(c, r);
      const st = STAGES[stage];
      drawGummyShape(x, y, CELL * 0.42, st.color, st.face, 0, 1, st.legendary, magicGrid[c][r]);
    }
  }
}

function drawPiece() {
  if (!piece) return;
  const sat = rotOffset(piece.col, piece.row, piece.rot);
  const a = cellCenter(piece.col, piece.row);
  const b = cellCenter(sat.col, sat.row);
  const pulse = 1 + 0.04 * Math.sin(Date.now() * 0.012);
  drawGummyShape(a.x, a.y, CELL * 0.42 * pulse, STAGES[piece.s1].color, STAGES[piece.s1].face, 0, 1, STAGES[piece.s1].legendary, piece.m1);
  drawGummyShape(b.x, b.y, CELL * 0.42 * pulse, STAGES[piece.s2].color, STAGES[piece.s2].face, 0, 1, STAGES[piece.s2].legendary, piece.m2);
}

function drawNextPreview() {
  // Top-right of the grid — clear of both the HTML score/best/time text
  // (top-left) and the pause button (above the canvas entirely).
  const bx = GRID_X0 + GRID_W - 70;
  const by = GRID_Y0 + 10;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.roundRect(bx, by, 60, 80, 12); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '10px Arial'; ctx.textAlign = 'center';
  ctx.fillText('つぎ', bx + 30, by + 14);
  ctx.restore();
  if (nextPair) {
    const r = 13;
    drawGummyShape(bx + 30, by + 34, r, STAGES[nextPair.s1].color, STAGES[nextPair.s1].face, 0, 1, false, nextPair.m1);
    drawGummyShape(bx + 30, by + 64, r, STAGES[nextPair.s2].color, STAGES[nextPair.s2].face, 0, 1, false, nextPair.m2);
  }
}

function drawChainPop() {
  if (popTimer <= 0) return;
  popTimer--;
  const t = popTimer / 50; // 1 -> 0
  const stage = STAGES[popStage] || STAGES[STAGES.length - 1];
  const cx = GRID_X0 + GRID_W / 2;
  const cy = GRID_Y0 + GRID_H / 2;
  const pop = 1 - Math.pow(1 - Math.min(1, (1 - t) * 3), 2); // fast ease-out over first third
  const scale = 0.3 + pop * 1.3;
  const alpha = t < 0.3 ? t / 0.3 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  drawGummyShape(cx, cy, 70, stage.color, stage.face, 0, scale, stage.legendary, false);
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawComboAnnouncement() {
  if (comboTimer > 0 && comboText) {
    comboTimer--;
    const alpha = comboTimer > 60 ? 1 : comboTimer / 60;
    const scale = comboTimer > 75 ? 1 + (90 - comboTimer) * 0.02 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W / 2, GRID_Y0 + GRID_H * 0.35);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px Arial';
    ctx.shadowColor = '#FF6600'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#FFD700';
    ctx.fillText(comboText, 0, 0);
    ctx.restore();
  }
  if (legendTimer > 0 && legendText) {
    legendTimer--;
    const alpha = legendTimer > 90 ? 1 : legendTimer / 90;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.font = 'bold 16px Arial';
    ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 20;
    ctx.fillStyle = '#FFF3C0';
    ctx.fillText(legendText, W / 2, GRID_Y0 + GRID_H * 0.22);
    ctx.restore();
  }
  if (celebrateTimer > 0 && celebrateText) {
    celebrateTimer--;
    const alpha = celebrateTimer > 75 ? 1 : celebrateTimer / 75;
    const scale = celebrateTimer > 100 ? 1 + (110 - celebrateTimer) * 0.05
                : 1 + Math.sin(celebrateTimer * 0.35) * 0.05;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W / 2, GRID_Y0 + GRID_H * 0.46);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';
    ctx.font = 'bold 34px Arial';
    ctx.shadowColor = '#FF6FA8'; ctx.shadowBlur = 34;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(celebrateText, 0, 0);
    ctx.restore();
  }
}

function drawTitleScreen() {
  titleFrame++;
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#5A2E78'); bg.addColorStop(0.55, '#3E1E58'); bg.addColorStop(1, '#241238');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  const dots = [[35,90,9],[260,140,12],[50,430,11],[255,480,8],[150,60,7],[220,330,6],[75,260,9]];
  dots.forEach(([dx,dy,dr],i) => {
    const a = 0.15 + 0.1 * Math.sin(titleFrame * 0.02 + i);
    ctx.fillStyle = `rgba(255,180,220,${a})`;
    ctx.beginPath(); ctx.arc(dx, dy, dr, 0, Math.PI*2); ctx.fill();
  });

  ctx.save();
  ctx.textAlign = 'center';
  ctx.shadowColor = '#FF7FC0'; ctx.shadowBlur = 22;
  ctx.fillStyle = '#FFE9F5';
  ctx.font = 'bold 46px Arial';
  ctx.fillText('モヨモヨ', W/2, 140);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#FFB0DC';
  ctx.font = '13px Arial';
  ctx.fillText('M O K U M O K U   C H A I N', W/2, 165);
  ctx.restore();

  const bob = Math.sin(titleFrame * 0.05) * 7;
  const tilt = Math.sin(titleFrame * 0.03) * 0.1;
  const lastStage = STAGES[STAGES.length - 1];
  drawGummyShape(W/2, 240 + bob, 50, lastStage.color, lastStage.face, tilt, 1, true);

  const chainY = 335;
  const startX = W/2 - 108;
  STAGES.forEach((st, i) => {
    const x = startX + i * 44;
    drawGummyShape(x, chainY, Math.min(st.r, 15), st.color, st.face, 0, 1, false);
    if (i < STAGES.length - 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '11px Arial'; ctx.textAlign = 'center';
      ctx.fillText('▶', x + 22, chainY + 4);
    }
  });

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '12px Arial';
  ctx.fillText('同じ段階を4つ以上つなげて進化させよう', W/2, 375);
  ctx.fillText('◀▶で移動・🔄で回転・▼で下に落とす', W/2, 393);
  ctx.restore();

  const btnY = 445;
  const pulse = 0.6 + 0.4 * Math.sin(titleFrame * 0.06);
  ctx.save();
  ctx.shadowColor = '#FF6FA8'; ctx.shadowBlur = 14 + pulse * 8;
  ctx.fillStyle = '#FF6FA8';
  ctx.beginPath(); ctx.roundRect(W/2 - 85, btnY - 24, 170, 48, 24); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'white';
  ctx.font = 'bold 19px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('▶ スタート', W/2, btnY);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();

  if (bestScore > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '13px Arial'; ctx.textAlign = 'center';
    ctx.fillText(`ベストスコア: ${bestScore}`, W/2, btnY + 44);
  }

  ctx.save();
  ctx.textAlign = 'center';
  const linkPulse = 0.7 + 0.3 * Math.sin(titleFrame * 0.05);
  ctx.globalAlpha = linkPulse;
  ctx.fillStyle = '#B0D8FF';
  ctx.font = '13px Arial';
  ctx.fillText('🦉 アングリーモクモクへ ▶', W/2, H - 18);
  ctx.restore();
}

function drawPausedOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(20,5,30,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFE9F5';
  ctx.font = 'bold 30px Arial';
  ctx.shadowColor = '#FF7FC0'; ctx.shadowBlur = 20;
  ctx.fillText('⏸ 一時停止中', W/2, H * 0.36);
  ctx.shadowBlur = 0;
  ctx.restore();

  ctx.save();
  ctx.fillStyle = '#FF6FA8';
  ctx.beginPath(); ctx.roundRect(W/2 - 90, PAUSE_RESUME_Y - 24, 180, 48, 24); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = 'bold 19px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('▶ 再開', W/2, PAUSE_RESUME_Y);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();

  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.roundRect(W/2 - 90, PAUSE_QUIT_Y - 22, 180, 44, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(W/2 - 90, PAUSE_QUIT_Y - 22, 180, 44, 22); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '16px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🏠 タイトルへ', W/2, PAUSE_QUIT_Y);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'TITLE') { drawTitleScreen(); return; }

  ctx.save();
  ctx.translate(shakeX, shakeY);
  shakeX *= 0.7; shakeY *= 0.7;
  if (Math.abs(shakeX) < 0.1) shakeX = 0;
  if (Math.abs(shakeY) < 0.1) shakeY = 0;

  drawGridPanel();
  drawGridCells();
  if (phase === 'FALL') drawPiece();
  drawParticles();
  drawNextPreview();
  drawChainPop();
  drawComboAnnouncement();

  ctx.restore();

  if (flashAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle = '#FFE9A0';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    flashAlpha *= 0.82;
  } else {
    flashAlpha = 0;
  }

  if (state === 'PAUSED') drawPausedOverlay();
}

// ─── GAME LOGIC ───────────────────────────────────────────────

function update() {
  if (state !== 'PLAYING') return;

  playFrames++;
  if (playFrames % 60 === 0) updateTimeDisplay();

  particles.forEach(p => p.update());
  particles = particles.filter(p => p.alive);

  if (phase === 'FALL') {
    fallTimer++;
    const interval = Math.max(14, 46 - (level - 1) * 3);
    if (fallTimer >= interval) {
      fallTimer = 0;
      if (canPlace(piece.col, piece.row + 1, piece.rot)) {
        piece.row++;
      } else {
        lockPiece();
      }
    }
  } else if (phase === 'LOCK_PAUSE') {
    if (--pauseTimer <= 0) {
      // The falling pair locks as a rigid unit, so over uneven column
      // heights one cell can end up floating with a gap beneath it.
      // Settle every column before checking for matches.
      applyGravity();
      phase = 'RESOLVING';
    }
  } else if (phase === 'RESOLVING') {
    if (--pauseTimer <= 0) {
      if (resolveStep()) {
        pauseTimer = 18;
      } else {
        phase = 'SPAWN_PAUSE';
        pauseTimer = 12;
        chainCount = 0;
      }
    }
  } else if (phase === 'SPAWN_PAUSE') {
    if (--pauseTimer <= 0 && state === 'PLAYING') {
      if (pendingLevelPreset) {
        applyLevelPreset();
        pendingLevelPreset = false;
      }
      phase = 'FALL';
      trySpawnPiece();
    }
  }
}

function gameOver() {
  state = 'GAMEOVER';
  piece = null;
  stopBGM();
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('moyomoyo-best', String(bestScore));
  }
  const secs = Math.floor(playFrames / 60);
  const mm = Math.floor(secs / 60);
  const ss = secs % 60;
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  document.getElementById('ov-title').textContent = '😵 グミがあふれた！';
  document.getElementById('ov-sub').textContent =
    `Lv.${level}　スコア: ${score}pt　ベスト: ${bestScore}pt\n⏱ ${mm}:${String(ss).padStart(2,'0')}`;
  document.getElementById('left-col').style.visibility = 'hidden';
  document.getElementById('right-col').style.visibility = 'hidden';
}

function startGame() {
  state = 'PLAYING';
  phase = 'FALL';
  score = 0;
  level = 1;
  pendingLevelPreset = false;
  playFrames = 0;
  grid = newGrid();
  magicGrid = newMagicGrid();
  particles = [];
  chainCount = 0;
  fallTimer = 0;
  pauseTimer = 0;
  comboText = ''; comboTimer = 0;
  legendText = ''; legendTimer = 0;
  celebrateText = ''; celebrateTimer = 0;
  popTimer = 0; popStage = 0;
  flashAlpha = 0;
  shakeX = 0; shakeY = 0;
  document.getElementById('pause-btn').textContent = '⏸';
  nextPair = rollPair();
  document.getElementById('hud').style.visibility = 'visible';
  document.getElementById('left-col').style.visibility = 'visible';
  document.getElementById('right-col').style.visibility = 'visible';
  document.getElementById('overlay').classList.add('hidden');
  updateHUD();
  updateTimeDisplay();
  startBGM();
  trySpawnPiece();
}

// ─── BGM (soft ambient pad, barely audible) ────────────────────

let audioCtx = null;
let bgmMaster = null;
let bgmNodes = null;
let bgmDucked = false;

function initAudio() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  bgmMaster = audioCtx.createGain();
  bgmMaster.gain.value = 0;
  bgmMaster.connect(audioCtx.destination);
}

function startBGM() {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (bgmNodes) return;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 900;
  filter.Q.value = 0.3;
  filter.connect(bgmMaster);

  const freqs = [130.81, 164.81, 196.00, 261.63]; // soft C major pad
  const oscs = freqs.map(f => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    const g = audioCtx.createGain();
    g.gain.value = 0.22 / freqs.length;
    osc.connect(g);
    g.connect(filter);
    osc.start();
    return { osc, g };
  });

  // Slow filter wobble for a gentle "もよもよ" breathing feel
  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.07;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 260;
  lfo.connect(lfoGain);
  lfoGain.connect(filter.frequency);
  lfo.start();

  bgmNodes = { filter, oscs, lfo, lfoGain };

  const target = bgmDucked ? 0.012 : 0.035;
  const now = audioCtx.currentTime;
  bgmMaster.gain.cancelScheduledValues(now);
  bgmMaster.gain.setValueAtTime(bgmMaster.gain.value, now);
  bgmMaster.gain.linearRampToValueAtTime(target, now + 2.5);
}

function stopBGM() {
  if (!audioCtx || !bgmNodes) return;
  const now = audioCtx.currentTime;
  bgmMaster.gain.cancelScheduledValues(now);
  bgmMaster.gain.setValueAtTime(bgmMaster.gain.value, now);
  bgmMaster.gain.linearRampToValueAtTime(0, now + 0.8);
  const nodes = bgmNodes;
  bgmNodes = null;
  setTimeout(() => {
    nodes.oscs.forEach(({ osc, g }) => { osc.stop(); osc.disconnect(); g.disconnect(); });
    nodes.lfo.stop(); nodes.lfo.disconnect(); nodes.lfoGain.disconnect();
    nodes.filter.disconnect();
  }, 900);
}

function duckBGM(down) {
  bgmDucked = down;
  if (!audioCtx || !bgmMaster) return;
  const now = audioCtx.currentTime;
  bgmMaster.gain.cancelScheduledValues(now);
  bgmMaster.gain.setValueAtTime(bgmMaster.gain.value, now);
  bgmMaster.gain.linearRampToValueAtTime(down ? 0.012 : 0.035, now + 0.6);
}

// ─── INPUT ────────────────────────────────────────────────────

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * scaleX,
    y: (src.clientY - rect.top)  * scaleY,
  };
}

function pauseGame() {
  if (state !== 'PLAYING') return;
  state = 'PAUSED';
  document.getElementById('pause-btn').textContent = '▶';
  duckBGM(true);
}
function resumeGame() {
  if (state !== 'PAUSED') return;
  state = 'PLAYING';
  document.getElementById('pause-btn').textContent = '⏸';
  duckBGM(false);
}
function quitToTitle() {
  state = 'TITLE';
  titleFrame = 0;
  document.getElementById('pause-btn').textContent = '⏸';
  document.getElementById('hud').style.visibility = 'hidden';
  document.getElementById('left-col').style.visibility = 'hidden';
  document.getElementById('right-col').style.visibility = 'hidden';
  stopBGM();
}

function onDown(e) {
  e.preventDefault();
  const p = getPos(e);
  if (state === 'TITLE') {
    if (p.x >= W/2 - 85 && p.x <= W/2 + 85 && p.y >= 421 && p.y <= 469) { startGame(); return; }
    if (p.y >= H - 34) { window.location.href = 'angry-mokumoku.html'; return; }
    return;
  }
  if (state === 'PAUSED') {
    if (p.x >= W/2-90 && p.x <= W/2+90 && p.y >= PAUSE_RESUME_Y-24 && p.y <= PAUSE_RESUME_Y+24) { resumeGame(); return; }
    if (p.x >= W/2-90 && p.x <= W/2+90 && p.y >= PAUSE_QUIT_Y-22 && p.y <= PAUSE_QUIT_Y+22) { quitToTitle(); return; }
    return;
  }
}

function onUp(e) {
  e.preventDefault();
}

canvas.addEventListener('mousedown',  onDown, { passive: false });
canvas.addEventListener('mouseup',    onUp,   { passive: false });
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchend',   onUp,   { passive: false });

function ctrlAction(action) {
  if (state !== 'PLAYING' || phase !== 'FALL') return;
  if (action === 'left') moveLeft();
  else if (action === 'right') moveRight();
  else if (action === 'rotate') rotatePiece();
  else if (action === 'down') softDrop();
}

document.querySelectorAll('.ctrl-btn').forEach(btn => {
  const action = btn.dataset.action;
  const fire = (e) => { e.preventDefault(); ctrlAction(action); };
  btn.addEventListener('mousedown', fire, { passive: false });
  btn.addEventListener('touchstart', fire, { passive: false });
});

document.getElementById('ov-btn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  startGame();
});

document.getElementById('pause-btn').addEventListener('click', () => {
  if (state === 'PLAYING') pauseGame();
  else if (state === 'PAUSED') resumeGame();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (state === 'PLAYING' || state === 'PAUSED')) {
    if (state === 'PLAYING') pauseGame(); else resumeGame();
    return;
  }
  if (state !== 'PLAYING' || phase !== 'FALL') return;
  if (e.key === 'ArrowLeft') moveLeft();
  else if (e.key === 'ArrowRight') moveRight();
  else if (e.key === 'ArrowUp' || e.key === ' ') rotatePiece();
  else if (e.key === 'ArrowDown') softDrop();
});

// ─── MAIN LOOP ────────────────────────────────────────────────

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function init() {
  state = 'TITLE';
  titleFrame = 0;
  grid = newGrid();
  loop();
}

init();
</script>
