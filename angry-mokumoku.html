// ─── REVERSED GRAVITY BACKGROUNDS (Lv21-25) ────────────────────

function _drawReversedGravityBackground(idx) {
  const ACCENTS = ['#8A3CFF', '#2EE6C5', '#FF3CB0', '#FFA82E', '#3CC8FF'];
  const accent = ACCENTS[idx];
  const t = Date.now();

  // Cosmic void sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#05030F');
  sky.addColorStop(0.5, '#0A0620');
  sky.addColorStop(1, '#140A2E');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Distant stars
  const starPts = [[60,140,1.0],[150,200,0.8],[260,110,1.1],[350,250,0.7],[440,170,1.2],
    [530,230,0.8],[620,150,1.0],[710,270,0.9],[800,190,1.1],[860,240,0.7],[100,320,0.8],[400,330,0.9],[700,310,0.8]];
  starPts.forEach(([sx, sy, sr]) => {
    ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 0.001 * sr + sx);
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Ceiling rock formation (mirrored "ground") — towers hang from here
  const ceilH = CEIL_Y + 30;
  const ceilGrad = ctx.createLinearGradient(0, 0, 0, ceilH);
  ceilGrad.addColorStop(0, '#241640'); ceilGrad.addColorStop(1, '#140A22');
  ctx.fillStyle = ceilGrad;
  ctx.fillRect(0, 0, W, ceilH);
  // Jagged bottom edge + glowing crack, computed once for reuse
  const jagPts = [];
  for (let x = 0; x <= W; x += 40) jagPts.push([x, ceilH - (8 + 10 * Math.sin(x * 0.05 + idx))]);
  ctx.fillStyle = '#1A1030';
  ctx.beginPath();
  ctx.moveTo(0, ceilH);
  jagPts.forEach(([x, y]) => ctx.lineTo(x, y));
  ctx.lineTo(W, ceilH); ctx.closePath(); ctx.fill();
  ctx.save();
  ctx.shadowColor = accent; ctx.shadowBlur = 14;
  ctx.strokeStyle = accent; ctx.globalAlpha = 0.7; ctx.lineWidth = 2;
  ctx.beginPath();
  jagPts.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  ctx.stroke();
  ctx.restore();

  // Drifting motes floating upward, toward the ceiling
  for (let i = 0; i < 16; i++) {
    const seed = i * 137.5;
    const speed = 0.02 + (i % 5) * 0.006;
    const span = H - ceilH + 40;
    const py = H - ((t * speed + seed) % span);
    const px = (seed * 3.7) % W;
    const alpha = Math.max(0, 0.25 + 0.35 * Math.sin(t * 0.002 + i));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = accent; ctx.shadowBlur = 8;
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(px, py, 2 + (i % 3), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Floating debris chunks mid-air (decorative)
  [[130, H*0.45], [330, H*0.58], [560, H*0.4], [760, H*0.55]].forEach(([dx, dy], i) => {
    const bob = Math.sin(t * 0.0015 + i * 2) * 10;
    ctx.save();
    ctx.translate(dx, dy + bob);
    ctx.rotate(Math.sin(t * 0.0008 + i) * 0.15);
    ctx.fillStyle = '#2A1E44';
    ctx.beginPath();
    ctx.moveTo(-14,-8); ctx.lineTo(10,-12); ctx.lineTo(16,4); ctx.lineTo(-6,12); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = accent; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  });

  // Ground platform at the bottom — the slingshot's safe footing
  const grd = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  grd.addColorStop(0, '#241A38'); grd.addColorStop(1, '#140A1E');
  ctx.fillStyle = grd; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.roundRect(0, GROUND_Y - 4, W, 8, 3); ctx.fill();
  ctx.restore();
}

// ─── SOCCER KIT BACKGROUNDS (Lv26-30) ──────────────────────────

function _drawSoccerBackground(idx) {
  const KITS = [
    { bands: ['#75C6F2', '#FFFFFF', '#75C6F2'], seat: ['#75C6F2', '#FFFFFF'], accent: '#F6B40E', pattern: 'vstripe' }, // Argentina
    { bands: ['#0055A4', '#FFFFFF', '#EF4135'], seat: ['#0055A4', '#EF4135'], accent: '#FFD700', pattern: 'vstripe' }, // France
    { bands: ['#FFDF00', '#FFF3B0', '#FFDF00'], seat: ['#009739', '#FFDF00'], accent: '#002776', pattern: 'sun'     }, // Brazil
    { bands: ['#FFFFFF', '#FCEAEA', '#FFFFFF'], seat: ['#BC002D', '#FFFFFF'], accent: '#BC002D', pattern: 'disc'    }, // Japan
    { bands: ['#AA151B', '#F1BF00', '#AA151B'], seat: ['#F1BF00', '#AA151B'], accent: '#AA151B', pattern: 'hstripe' }, // Spain
  ];
  const kit = KITS[idx];

  // Sky — kit-colored bands
  if (kit.pattern === 'hstripe') {
    const bh = GROUND_Y / kit.bands.length;
    kit.bands.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(0, i * bh, W, bh + 1); });
  } else {
    const bw = W / (kit.bands.length * 2);
    for (let i = 0; i < kit.bands.length * 2; i++) {
      ctx.fillStyle = kit.bands[i % kit.bands.length];
      ctx.fillRect(i * bw, 0, bw + 1, GROUND_Y);
    }
  }
  // Soft white haze near horizon for legibility
  const haze = ctx.createLinearGradient(0, GROUND_Y - 140, 0, GROUND_Y);
  haze.addColorStop(0, 'rgba(255,255,255,0)');
  haze.addColorStop(1, 'rgba(255,255,255,0.35)');
  ctx.fillStyle = haze; ctx.fillRect(0, GROUND_Y - 140, W, 140);

  // Country accent emblem
  ctx.save();
  if (kit.pattern === 'sun') {
    ctx.translate(W/2, 90);
    for (let i = 0; i < 16; i++) {
      const a = (Math.PI * 2 * i) / 16;
      ctx.save(); ctx.rotate(a);
      ctx.fillStyle = kit.accent; ctx.globalAlpha = 0.35;
      ctx.fillRect(-4, -70, 8, 40);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = kit.accent;
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI*2); ctx.fill();
  } else if (kit.pattern === 'disc') {
    ctx.fillStyle = kit.accent;
    ctx.beginPath(); ctx.arc(W/2, 95, 46, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.translate(W/2, 90);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = kit.accent; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = kit.accent;
    ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(13,10); ctx.lineTo(-13,10); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // Stadium stands silhouette (curved bowl, crowd dot-texture)
  const standTop = GROUND_Y - 165;
  ctx.fillStyle = 'rgba(20,20,30,0.42)';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.quadraticCurveTo(W*0.5, standTop, W, GROUND_Y);
  ctx.closePath(); ctx.fill();
  for (let row = 0; row < 7; row++) {
    const ry = GROUND_Y - 30 - row * 20;
    if (ry < standTop) continue;
    for (let cx2 = 20; cx2 < W - 20; cx2 += 16) {
      const curveY = standTop + (GROUND_Y - standTop) * Math.pow(Math.abs(cx2 - W/2) / (W/2), 1.6);
      if (ry < curveY - 10) continue;
      ctx.fillStyle = kit.seat[(row + Math.floor(cx2/16)) % kit.seat.length];
      ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(cx2, ry, 3.2, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // Floodlights
  [90, W - 90].forEach(fx => {
    ctx.strokeStyle = 'rgba(40,40,50,0.6)'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(fx, GROUND_Y - 40); ctx.lineTo(fx, 60); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,240,0.85)';
    ctx.beginPath(); ctx.roundRect(fx - 22, 40, 44, 16, 3); ctx.fill();
  });

  // Ground — pitch (green grass + white lines) instead of dirt
  const pitch = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  pitch.addColorStop(0, '#2E9E44'); pitch.addColorStop(1, '#1E7A32');
  ctx.fillStyle = pitch; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  for (let x = 0; x < W; x += 60) {
    ctx.fillStyle = (Math.floor(x / 60) % 2 === 0) ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
    ctx.fillRect(x, GROUND_Y, 60, H - GROUND_Y);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 8); ctx.lineTo(W, GROUND_Y + 8); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2, GROUND_Y + 8, 26, 0, Math.PI, false); ctx.stroke();
}

function drawBlocks() {
  blocks.forEach(b => {
    if (!b.alive) return;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle);

    const hw = b.w / 2, hh = b.h / 2;

    if (b.type === 'bamboo') {
      // Bamboo pole
      const grad = ctx.createLinearGradient(-hw, 0, hw, 0);
      grad.addColorStop(0, '#9DC45A');
      grad.addColorStop(0.5, '#C0E070');
      grad.addColorStop(1, '#7A9840');
      ctx.fillStyle = b.flash > 0 ? '#FFFFFF' : grad;
      ctx.beginPath();
      ctx.roundRect(-hw, -hh, b.w, b.h, 4);
      ctx.fill();
      // Bamboo joints
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1.5;
      const joints = Math.floor(b.h / 28);
      for (let i = 1; i < joints; i++) {
        const jy = -hh + i * (b.h / joints);
        ctx.beginPath();
        ctx.moveTo(-hw, jy);
        ctx.lineTo(hw, jy);
        ctx.stroke();
      }
    } else if (b.type === 'wood') {
      // Wood plank
      const grad = ctx.createLinearGradient(0, -hh, 0, hh);
      grad.addColorStop(0, '#C4803A');
      grad.addColorStop(1, '#8A5018');
      ctx.fillStyle = b.flash > 0 ? '#FFE8A0' : grad;
      ctx.beginPath();
      ctx.roundRect(-hw, -hh, b.w, b.h, 3);
      ctx.fill();
      // Wood grain
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1;
      const grains = Math.max(2, Math.floor(b.w / 18));
      for (let i = 1; i < grains; i++) {
        const gx = -hw + i * (b.w / grains);
        ctx.beginPath(); ctx.moveTo(gx, -hh); ctx.lineTo(gx, hh); ctx.stroke();
      }
      // Border
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(-hw, -hh, b.w, b.h, 3); ctx.stroke();
    } else if (b.type === 'tnt') {
      // TNT box
      ctx.fillStyle = b.flash > 0 ? '#FFFFFF' : '#C81808';
      ctx.fillRect(-hw, -hh, b.w, b.h);
      ctx.strokeStyle = '#7A0800'; ctx.lineWidth = 2.5;
      ctx.strokeRect(-hw, -hh, b.w, b.h);
      // Cross stripes
      ctx.strokeStyle = '#FF6040'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-hw, -hh); ctx.lineTo(hw, hh); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hw, -hh); ctx.lineTo(-hw, hh); ctx.stroke();
      // Label
      ctx.fillStyle = '#FFE020';
      ctx.font = `bold ${Math.max(10, Math.floor(b.h * 0.44))}px Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('TNT', 0, 0);
      ctx.textBaseline = 'alphabetic';
      // Fuse spark when damaged
      const tntDmg = 1 - b.hp / 4;
      if (tntDmg > 0.15) {
        const spk = Math.sin(Date.now() * 0.02) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(255,${Math.floor(180*spk)},0,${0.6+spk*0.4})`;
        ctx.beginPath(); ctx.arc(0, -hh - 5, 3 + tntDmg * 5, 0, Math.PI*2); ctx.fill();
      }
    } else {
      // Crate
      ctx.fillStyle = b.flash > 0 ? '#FFE8A0' : '#C8A830';
      ctx.fillRect(-hw, -hh, b.w, b.h);
      // Crate planks
      ctx.strokeStyle = '#8A6010';
      ctx.lineWidth = 2;
      ctx.strokeRect(-hw, -hh, b.w, b.h);
      ctx.beginPath(); ctx.moveTo(-hw, 0); ctx.lineTo(hw, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -hh); ctx.lineTo(0, hh); ctx.stroke();
      // X cross
      ctx.strokeStyle = 'rgba(100,60,0,0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-hw, -hh); ctx.lineTo(hw, hh); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hw, -hh); ctx.lineTo(-hw, hh); ctx.stroke();
    }

    // HP damage cracks
    const dmgRatio = 1 - b.hp / (b.type === 'bamboo' ? 1.5 : b.type === 'wood' ? 3 : 5);
    if (dmgRatio > 0.3) {
      ctx.strokeStyle = `rgba(0,0,0,${dmgRatio * 0.5})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, -hh * 0.3); ctx.lineTo(hw * 0.4, hh * 0.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-hw * 0.2, hh * 0.1); ctx.lineTo(hw * 0.3, -hh * 0.2); ctx.stroke();
    }

    ctx.restore();
  });
}

function _drawRatBase(r, bodyCol, earInnerCol) {
  ctx.fillStyle = bodyCol;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = bodyCol === '#787878' ? '#A09090' : '#C0A0A0';
  ctx.beginPath(); ctx.ellipse(r*0.55, r*0.08, r*0.42, r*0.28, 0, 0, Math.PI*2); ctx.fill();
  [[-r*0.25, -r*0.88], [r*0.38, -r*0.88]].forEach(([ex, ey]) => {
    ctx.fillStyle = bodyCol;
    ctx.beginPath(); ctx.ellipse(ex, ey, r*0.22, r*0.28, ex > 0 ? 0.25 : -0.25, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = earInnerCol;
    ctx.beginPath(); ctx.ellipse(ex, ey, r*0.12, r*0.16, ex > 0 ? 0.25 : -0.25, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-r*0.05, -r*0.15, r*0.11, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.5, -r*0.05, r*0.09, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(-r*0.01, -r*0.2, r*0.04, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FF8888';
  ctx.beginPath(); ctx.arc(r*0.9, r*0.08, r*0.08, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(200,200,200,0.7)'; ctx.lineWidth = 0.8;
  [[-0.3,0.1],[0.1,-0.05],[-0.1,0.3]].forEach(([a,b]) => {
    ctx.beginPath(); ctx.moveTo(r*0.5,r*0.08); ctx.lineTo(r*1.5+a*r,r*0.08+b*r); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.5,r*0.08); ctx.lineTo(-r*0.2+a*r*0.3,r*0.08+b*r); ctx.stroke();
  });
  ctx.strokeStyle = '#909090'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-r,r*0.15);
  ctx.bezierCurveTo(-r*1.6,-r*0.4,-r*2.1,r*0.7,-r*1.9,r*1.3); ctx.stroke();
}

function drawRats() {
  rats.forEach(rat => {
    if (!rat.alive) return;
    ctx.save();
    ctx.translate(rat.x, rat.y);
    ctx.rotate(rat.angle);
    ctx.globalAlpha = rat.dying ? Math.max(0, 1 - rat.deathT / 30) : 1;
    const r = rat.r;

    if (rat.type === 'boss') {
      _drawRatBase(r, '#7A4A20', '#D08060');
      // Gold crown
      ctx.fillStyle = '#FFD700';
      ctx.beginPath(); ctx.moveTo(-r*0.5,-r*0.9); ctx.lineTo(-r*0.5,-r*1.5);
      ctx.lineTo(-r*0.2,-r*1.2); ctx.lineTo(0,-r*1.6); ctx.lineTo(r*0.2,-r*1.2);
      ctx.lineTo(r*0.5,-r*1.5); ctx.lineTo(r*0.5,-r*0.9); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#C8A000'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle='#FF4444';
      ctx.beginPath(); ctx.arc(0,-r*1.6,r*0.1,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-r*0.5,-r*1.5,r*0.08,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.5,-r*1.5,r*0.08,0,Math.PI*2); ctx.fill();

    } else if (rat.type === 'ninja') {
      _drawRatBase(r, '#2A2A2A', '#550000');
      // Red headband
      ctx.fillStyle = '#CC0000';
      ctx.beginPath(); ctx.ellipse(0,-r*0.55,r*0.7,r*0.18,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FF3333';
      ctx.beginPath(); ctx.arc(0,-r*0.55,r*0.1,0,Math.PI*2); ctx.fill();
      // White eyes (ninja mask)
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.ellipse(-r*0.2,-r*0.15,r*0.2,r*0.12,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.4,-r*0.05,r*0.16,r*0.1,0,0,Math.PI*2); ctx.fill();

    } else if (rat.type === 'suit') {
      _drawRatBase(r, '#606060', '#D08080');
      // Business tie
      ctx.fillStyle = '#2244CC';
      ctx.beginPath(); ctx.moveTo(-r*0.12,r*0.25); ctx.lineTo(r*0.12,r*0.25);
      ctx.lineTo(r*0.08,r*0.75); ctx.lineTo(0,r*0.9); ctx.lineTo(-r*0.08,r*0.75);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1133AA';
      ctx.beginPath(); ctx.moveTo(-r*0.1,r*0.25); ctx.lineTo(r*0.1,r*0.25);
      ctx.lineTo(r*0.06,r*0.45); ctx.lineTo(-r*0.06,r*0.45); ctx.closePath(); ctx.fill();
      // Tiny collar
      ctx.fillStyle = 'white'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(-r*0.18,r*0.2); ctx.lineTo(0,r*0.32); ctx.lineTo(r*0.18,r*0.2); ctx.stroke();

    } else if (rat.type === 'baby') {
      _drawRatBase(r, '#FFB0C8', '#FF8888');
      // Tiny cute features — bigger relative eyes
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-r*0.1,-r*0.1,r*0.18,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.45,-r*0.05,r*0.14,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='white';
      ctx.beginPath(); ctx.arc(-r*0.05,-r*0.17,r*0.07,0,Math.PI*2); ctx.fill();
      // Little bow
      ctx.fillStyle = '#FF4488';
      ctx.beginPath(); ctx.ellipse(-r*0.3,-r*1.05,r*0.25,r*0.12,-0.4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r*0.3,-r*1.05,r*0.25,r*0.12,0.4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FF2266'; ctx.beginPath(); ctx.arc(0,-r*1.05,r*0.1,0,Math.PI*2); ctx.fill();

    } else {
      // chef (default)
      _drawRatBase(r, '#787878', '#D08080');
      ctx.fillStyle = 'white';
      ctx.fillRect(-r*0.35, -r*1.35, r*0.7, r*0.35);
      ctx.beginPath(); ctx.ellipse(0,-r*1.55,r*0.28,r*0.28,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#DDD'; ctx.lineWidth=1;
      ctx.strokeRect(-r*0.35,-r*1.35,r*0.7,r*0.35);
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  });
}

function drawMokumoku(x, y, r, angle, mood) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle || 0);
  mood = mood || 'neutral';

  // Body — slightly redder when super-angry
  ctx.fillStyle = mood === 'super-angry' ? '#D48060' : '#C8956A';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  const bodyShade = ctx.createRadialGradient(-r*0.3, -r*0.3, 0, 0, 0, r);
  bodyShade.addColorStop(0, 'rgba(255,255,255,0.15)');
  bodyShade.addColorStop(1, 'rgba(0,0,0,0.2)');
  ctx.fillStyle = bodyShade;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();

  // Face patch
  ctx.fillStyle = '#E8D5B0';
  ctx.beginPath(); ctx.ellipse(0, r*0.12, r*0.66, r*0.76, 0, 0, Math.PI*2); ctx.fill();

  // Eye height based on mood
  const eyeH = mood === 'super-angry' ? r*0.145 : mood === 'angry' ? r*0.175 : r*0.235;
  const eyeW = r*0.19;

  // Eyes
  ctx.fillStyle = '#151515';
  ctx.beginPath(); ctx.ellipse(-r*0.32, -r*0.14, eyeW, eyeH, -0.08, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.32, -r*0.14, eyeW, eyeH, 0.08, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(-r*0.32, -r*0.14, eyeW, eyeH, -0.08, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(r*0.32, -r*0.14, eyeW, eyeH, 0.08, 0, Math.PI*2); ctx.stroke();

  // Angry eyebrows
  if (mood === 'angry' || mood === 'super-angry') {
    const slope = mood === 'super-angry' ? r*0.16 : r*0.10;
    ctx.strokeStyle = '#4A1800';
    ctx.lineWidth = mood === 'super-angry' ? r*0.09 : r*0.07;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-r*0.52, -r*0.36 - slope); ctx.lineTo(-r*0.14, -r*0.36 + slope*0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.14, -r*0.36 + slope*0.3); ctx.lineTo(r*0.52, -r*0.36 - slope); ctx.stroke();
  }

  // Eye highlights
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(-r*0.27, -r*0.2, r*0.065, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.37, -r*0.2, r*0.065, 0, Math.PI*2); ctx.fill();

  // Forehead stripe
  ctx.fillStyle = mood === 'super-angry' ? '#C87818' : '#E89230';
  ctx.beginPath(); ctx.ellipse(0, -r*0.02, r*0.24, r*0.115, 0, 0, Math.PI*2); ctx.fill();

  // Beak — open when angry
  if (mood === 'super-angry') {
    // Open beak: dark mouth interior + upper/lower parts
    ctx.fillStyle = '#2A1000';
    ctx.beginPath(); ctx.ellipse(0, r*0.15, r*0.115, r*0.10, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#D07818';
    ctx.beginPath(); ctx.ellipse(0, r*0.10, r*0.115, r*0.075, 0, Math.PI, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, r*0.17, r*0.115, r*0.06, 0, 0, Math.PI); ctx.fill();
  } else if (mood === 'angry') {
    // Slightly open beak
    ctx.fillStyle = '#5A2800';
    ctx.beginPath(); ctx.ellipse(0, r*0.14, r*0.105, r*0.055, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#D07818';
    ctx.beginPath(); ctx.ellipse(0, r*0.09, r*0.115, r*0.075, 0, Math.PI, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, r*0.155, r*0.105, r*0.055, 0, 0, Math.PI); ctx.fill();
  } else {
    // Closed beak
    ctx.fillStyle = '#D07818';
    ctx.beginPath(); ctx.ellipse(0, r*0.12, r*0.115, r*0.135, 0, 0, Math.PI); ctx.fill();
  }

  // Teal leaf bowtie
  ctx.fillStyle = '#3DA890';
  ctx.beginPath(); ctx.ellipse(-r*0.28, r*0.47, r*0.24, r*0.13, -0.35, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.28, r*0.47, r*0.24, r*0.13, 0.35, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2A7868';
  ctx.beginPath(); ctx.arc(0, r*0.47, r*0.07, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#2A7868'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(-r*0.04, r*0.47); ctx.lineTo(-r*0.48, r*0.45); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r*0.04, r*0.47); ctx.lineTo(r*0.48, r*0.45); ctx.stroke();

  // Orange feet
  ctx.fillStyle = '#E89230';
  ctx.beginPath(); ctx.ellipse(-r*0.26, r*0.88, r*0.13, r*0.08, 0.25, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.26, r*0.88, r*0.13, r*0.08, -0.25, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#C06810'; ctx.lineWidth = 1.2;
  [-r*0.26, r*0.26].forEach(fx => {
    ctx.beginPath(); ctx.moveTo(fx - r*0.07, r*0.9); ctx.lineTo(fx - r*0.15, r*0.96); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx, r*0.92); ctx.lineTo(fx, r*1.0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx + r*0.07, r*0.9); ctx.lineTo(fx + r*0.15, r*0.96); ctx.stroke();
  });

  ctx.restore();
}

function drawSlingshot() {
  const forkL = { x: SX - 18, y: FORK_Y + 4 };
  const forkR = { x: SX + 18, y: FORK_Y + 4 };

  // Elastic bands
  if (state === 'AIMING' && dragging) {
    const birdX = SX + pullX;
    const birdY = FORK_Y + pullY;
    ctx.strokeStyle = '#A0623A';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    // Left band
    ctx.beginPath(); ctx.moveTo(forkL.x, forkL.y); ctx.lineTo(birdX, birdY); ctx.stroke();
    // Right band
    ctx.beginPath(); ctx.moveTo(forkR.x, forkR.y); ctx.lineTo(birdX, birdY); ctx.stroke();
  } else {
    // Relaxed bands
    ctx.strokeStyle = '#8A5230';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(forkL.x, forkL.y); ctx.lineTo(SX, FORK_Y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(forkR.x, forkR.y); ctx.lineTo(SX, FORK_Y); ctx.stroke();
  }

  // Fork prongs
  ctx.strokeStyle = '#6B3C12';
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(SX, SY);
  ctx.lineTo(SX, FORK_Y + 20);
  ctx.stroke();
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(SX, FORK_Y + 24);
  ctx.lineTo(forkL.x, forkL.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(SX, FORK_Y + 24);
  ctx.lineTo(forkR.x, forkR.y);
  ctx.stroke();
  // Fork tips
  ctx.fillStyle = '#8B5A2B';
  [forkL, forkR].forEach(f => {
    ctx.beginPath(); ctx.arc(f.x, f.y, 4.5, 0, Math.PI*2); ctx.fill();
  });
}

function drawBird() {
  if (!bird) return;

  // Lucky bird glow
  if (birdType === 'super') {
    ctx.save();
    const hue = (Date.now() * 0.3) % 360;
    ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.shadowBlur = 36;
    ctx.fillStyle = `hsla(${hue},100%,60%,0.15)`;
    ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.r + 12, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else if (birdType === 'giant') {
    ctx.save();
    ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 28;
    ctx.fillStyle = 'rgba(255,215,0,0.12)';
    ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.r + 8, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  } else if (birdType === 'speed') {
    ctx.save();
    ctx.shadowColor = '#00EEFF'; ctx.shadowBlur = 28;
    ctx.fillStyle = 'rgba(0,238,255,0.10)';
    ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.r + 8, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Trail
  const RAINBOW = ['#FF3060','#FF8800','#FFE030','#30FF70','#3090FF','#AA00FF','#FF30CC'];
  if (birdType === 'super') {
    bird.trail.forEach((pt, i) => {
      const alpha = (i / bird.trail.length) * 0.55;
      const sz = bird.r * 0.45 * (i / bird.trail.length);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = RAINBOW[i % RAINBOW.length];
      ctx.beginPath(); ctx.arc(pt.x, pt.y, sz, 0, Math.PI*2); ctx.fill();
    });
    // Sparkles at bird position
    if (bird.launched) {
      for (let s = 0; s < 5; s++) {
        const sa = (Date.now() * 0.01 + s * 1.26) % (Math.PI * 2);
        const sd = bird.r * 0.7 + Math.sin(Date.now() * 0.008 + s) * 6;
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = RAINBOW[s % RAINBOW.length];
        ctx.beginPath(); ctx.arc(bird.x + Math.cos(sa)*sd, bird.y + Math.sin(sa)*sd, 2.5, 0, Math.PI*2); ctx.fill();
      }
    }
  } else {
    const trailColor = birdType === 'speed' ? '#00EEFF' : birdType === 'giant' ? '#FFD700' : '#FFE070';
    bird.trail.forEach((pt, i) => {
      const alpha = (i / bird.trail.length) * 0.35;
      const sz = bird.r * 0.3 * (i / bird.trail.length);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = trailColor;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, sz, 0, Math.PI*2); ctx.fill();
    });
  }
  ctx.globalAlpha = 1;

  // Flash ring
  if (bird.flash > 0) {
    ctx.strokeStyle = `rgba(255,220,50,${bird.flash / 8})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.r + 8, 0, Math.PI*2); ctx.stroke();
  }

  // Mood: neutral when aiming, angry when flying, super-angry after boost or lucky bird
  let mood = 'neutral';
  if (score >= 1500) mood = 'angry';
  if (state === 'FLYING') {
    mood = (boostUsed || birdType !== 'normal') ? 'super-angry' : 'angry';
  }

  const angle = bird.launched ? bird.angle : 0;
  drawMokumoku(bird.x, bird.y, bird.r, angle, mood);
}

function drawTrajectoryArc() {
  if (!dragging) return;
  if (birdType === 'super') return; // super mokumoku doesn't fly a parabola — no preview
  const speedMult = birdType === 'speed' ? SPEED_MULT : 1;
  const r = birdType === 'giant' ? GIANT_R : BIRD_R;
  const vx = -pullX * POWER * speedMult;
  const vy = -pullY * POWER * speedMult;
  let x = SX + pullX, y = FORK_Y + pullY;
  let dvx = vx, dvy = vy;
  let landX = x, landY = y;
  let landed = false;

  const arcColor = birdType === 'speed' ? 'rgba(100,230,255,0.65)' :
                   birdType === 'giant' ? 'rgba(255,210,50,0.65)' :
                   'rgba(255,255,255,0.55)';

  ctx.save();
  ctx.setLineDash([5, 8]);
  ctx.strokeStyle = arcColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let i = 0; i < 120; i++) {
    dvy += curGrav;
    x += dvx; y += dvy;
    if (curGDir === 1 ? (y >= curFloorY - r || x > W) : (y <= curFloorY + r || x > W)) {
      landX = x; landY = curGDir === 1 ? Math.min(y, curFloorY) : Math.max(y, curFloorY);
      landed = true; break;
    }
    ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Landing indicator
  if (landed && landX < W) {
    ctx.fillStyle = arcColor;
    ctx.beginPath(); ctx.arc(landX, landY, 5, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawWaitingBirds() {
  // Show extra birds waiting near base of slingshot
  for (let i = 0; i < birdsLeft - 1; i++) {
    const bx = SX - 60 - i * 52;
    drawMokumoku(bx, GROUND_Y - 16, 16, 0);
  }
}

// ─── AIMING UI ────────────────────────────────────────────────

function drawAimUI() {
  // Highlight zone around bird when not dragging
  if (!dragging) {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.005);
    ctx.strokeStyle = `rgba(255,220,80,${0.4 + pulse * 0.4})`;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.arc(SX, FORK_Y, BIRD_R + 14, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
  drawTrajectoryArc();
}

// ─── GAME LOGIC ───────────────────────────────────────────────

function launch() {
  if (!bird || state !== 'AIMING') return;
  const speedMult = birdType === 'speed' ? SPEED_MULT : 1;
  const vx = -pullX * POWER * speedMult;
  const vy = -pullY * POWER * speedMult;
  bird.x = SX + pullX;
  bird.y = FORK_Y + pullY;
  bird.vx = vx;
  bird.vy = vy;
  bird.launched = true;
  state = 'FLYING';
  settleTimer = 0;
  boostCooldown = 30; // prevent accidental boost on launch touchend

  if (birdType === 'super') {
    const spd = Math.sqrt(vx * vx + vy * vy) || 0.001;
    bird.dirX = vx / spd; bird.dirY = vy / spd;
    bird.perpX = -bird.dirY; bird.perpY = bird.dirX;
    bird.speed = spd * 1.15;
    bird.baseX = bird.x; bird.baseY = bird.y;
    bird.travel = 0;
  } else {
    document.getElementById('boost-hint').style.opacity = '1';
    setTimeout(() => {
      document.getElementById('boost-hint').style.opacity = '0';
    }, 2000);
  }
}

function applyBoost() {
  if (!bird || !bird.launched || boostUsed || boostCooldown > 0 || birdType === 'super') return;
  const sp = Math.sqrt(bird.vx*bird.vx + bird.vy*bird.vy);
  if (sp < 0.1) return;
  const nx = bird.vx / sp, ny = bird.vy / sp;
  bird.vx += nx * BOOST_SPD;
  bird.vy += ny * BOOST_SPD;
  bird.flash = 18;
  boostUsed = true;
  addParticles(bird.x, bird.y, '#FFE030', 16, 6);
  addParticles(bird.x, bird.y, '#FF8030', 10, 4);
  document.getElementById('boost-hint').style.opacity = '0';
}

function checkWinLose() {
  const livingRats = rats.filter(r => r.alive && !r.dying);
  if (livingRats.length === 0) {
    setTimeout(() => showResult('WIN'), 800);
    return true;
  }
  return false;
}

function nextBirdOrLose() {
  if (checkWinLose()) return;

  birdsLeft--;
  updateHUD();

  if (birdsLeft <= 0) {
    const dyingRats = rats.filter(r => r.dying).length;
    const aliveRats  = rats.filter(r => r.alive && !r.dying).length;
    if (aliveRats > 0) {
      setTimeout(() => showResult('LOSE'), 800);
    } else {
      setTimeout(() => showResult('WIN'), 800);
    }
  } else {
    setTimeout(() => {
      resetBird();
      state = 'AIMING';
    }, 1200);
  }
}

function showResult(result) {
  state = result;
  const ov      = document.getElementById('overlay');
  const title   = document.getElementById('ov-title');
  const sub     = document.getElementById('ov-sub');
  const nextBtn = document.getElementById('ov-next-btn');

  if (result === 'WIN') {
    const unused = Math.max(0, birdsLeft - 1);
    if (unused > 0) { score += unused * BIRD_BONUS; updateHUD(); }
    saveProgress();

    // All-clear: last level cleared
    if (currentLevel >= LEVEL_CONFIGS.length - 1) {
      totalPlayTime = Math.floor((Date.now() - gameStartTime) / 1000);
      state = 'ALLCLEAR';
      return;
    }

    // Chapter checkpoint: pause on a congrats screen at Lv.10 and Lv.20
    if (currentLevel === 9 || currentLevel === 19) {
      state = 'CHECKPOINT';
      return;
    }

    ov.classList.remove('hidden');
    const cfg   = LEVEL_CONFIGS[currentLevel];
    const lvScore = score - levelStartScore;
    const stars = lvScore >= cfg.stars[2] ? 3 : lvScore >= cfg.stars[1] ? 2 : 1;
    const starStr = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    title.textContent = '🎉 全員やっつけた！';
    sub.textContent   = `${starStr}  累計 ${score} pt`;
    nextBtn.style.display = 'inline-block';
  } else {
    ov.classList.remove('hidden');
    title.textContent = '😢 やられた…';
    sub.textContent = `${ratsKilled}/${totalRatsAtStart}匹倒した  スコア: ${score}pt`;
    nextBtn.style.display = 'none';
  }
}

function restartGame() {
  score = Math.floor(score / 2); // halve score as penalty
  levelStartScore = score;       // new baseline after penalty
  totalDeaths++;
  particles = [];
  state = 'AIMING';
  document.getElementById('overlay').classList.add('hidden');
  setupLevel(currentLevel);
  resetBird();
  updateHUD();
}

function nextLevel() {
  currentLevel++;
  levelStartScore = score; // carry cumulative score forward
  particles = [];
  state = 'AIMING';
  document.getElementById('overlay').classList.add('hidden');
  setupLevel(currentLevel);
  resetBird();
  updateHUD();
}

// ─── INPUT ────────────────────────────────────────────────────

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * scaleX,
    y: (src.clientY - rect.top)  * scaleY,
  };
}

function startFromTitle() {
  const savedLevel = getSavedLevel();
  const lvl = (titleMenuSel === 1 && savedLevel >= 0 && savedLevel < LEVEL_CONFIGS.length)
    ? savedLevel : 0;
  currentLevel = lvl;
  score = 0; levelStartScore = 0; totalDeaths = 0;
  totalPlayTime = 0; gameStartTime = Date.now();
  allClearParticles = [];
  particles = [];
  document.getElementById('hud').style.visibility = 'visible';
  setupLevel(currentLevel);
  resetBird();
  updateHUD();
  state = 'AIMING';
}

function onDown(e) {
  e.preventDefault();
  if (state === 'CHECKPOINT') {
    allClearParticles = [];
    nextLevel();
    return;
  }
  if (state === 'ALLCLEAR') {
    const p = getPos(e);
    // Share button: centered at W/2=450, y range [398,436]
    if (p.x >= 360 && p.x <= 540 && p.y >= 398 && p.y <= 436) {
      shareResult();
      return;
    }
    state = 'TITLE';
    titleMenuSel = 0; titleFrame = 0;
    allClearParticles = []; shareCopied = false; shareCopiedTimer = 0;
    document.getElementById('hud').style.visibility = 'hidden';
    return;
  }
  if (state === 'TITLE') {
    const p = getPos(e);
    // Cross-links to the sister games (top-right corner, stacked)
    if (p.x >= W - 220 && p.x <= W - 10 && p.y >= 8 && p.y <= 38) {
      window.location.href = 'moyomoyo.html';
      return;
    }
    if (p.x >= W - 220 && p.x <= W - 10 && p.y >= 38 && p.y <= 58) {
      window.location.href = 'mk-mobile.html';
      return;
    }
    const menuY = 345;
    if (p.y >= menuY - 24 && p.y < menuY + 30) { titleMenuSel = 0; startFromTitle(); return; }
    if (p.y >= menuY + 22) {
      const savedLevel = getSavedLevel();
      if (savedLevel >= 0 && savedLevel < LEVEL_CONFIGS.length) { titleMenuSel = 1; }
      startFromTitle(); return;
    }
    return;
  }
  if (state !== 'AIMING') return;
  const p = getPos(e);
  const dx = p.x - SX, dy = p.y - FORK_Y;
  if (Math.sqrt(dx*dx + dy*dy) < BIRD_R + 20) {
    dragging = true;
    mouse = p;
  }
}

function onMove(e) {
  e.preventDefault();
  if (!dragging || state !== 'AIMING') return;
  const p = getPos(e);
  mouse = p;
  let dx = p.x - SX, dy = p.y - FORK_Y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > MAX_PULL) {
    dx = dx / dist * MAX_PULL;
    dy = dy / dist * MAX_PULL;
  }
  pullX = dx; pullY = dy;
  if (bird) { bird.x = SX + pullX; bird.y = FORK_Y + pullY; }
}

function onUp(e) {
  e.preventDefault();
  if (!dragging || state !== 'AIMING') return;
  dragging = false;
  const dist = Math.sqrt(pullX*pullX + pullY*pullY);
  if (dist > 12) {
    launch();
  } else {
    pullX = 0; pullY = 0;
    if (bird) { bird.x = SX; bird.y = FORK_Y; }
  }
}

function onClick(e) {
  if (state === 'FLYING') {
    applyBoost();
  }
}

function onTouchStart(e) {
  e.preventDefault();
  if (state === 'TITLE') { onDown(e); return; }
  if (state === 'FLYING') { applyBoost(); return; }
  onDown(e);
}

canvas.addEventListener('mousedown',  onDown,        { passive: false });
canvas.addEventListener('mousemove',  onMove,        { passive: false });
canvas.addEventListener('mouseup',    onUp,          { passive: false });
canvas.addEventListener('click',      onClick);
canvas.addEventListener('touchstart', onTouchStart,  { passive: false });
canvas.addEventListener('touchmove',  onMove,        { passive: false });
canvas.addEventListener('touchend',   onUp,          { passive: false });

document.getElementById('ov-btn').addEventListener('click', restartGame);
document.getElementById('ov-next-btn').addEventListener('click', nextLevel);

document.addEventListener('keydown', e => {
  if (state === 'TITLE') {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const savedLevel = getSavedLevel();
      if (savedLevel >= 0 && savedLevel < LEVEL_CONFIGS.length) {
        titleMenuSel = titleMenuSel === 0 ? 1 : 0;
      }
    } else if (e.key === 'Enter' || e.key === ' ') {
      startFromTitle();
    }
  }
});

// ─── MAIN LOOP ────────────────────────────────────────────────

function update() {
  if (state === 'TITLE' || state === 'WIN' || state === 'LOSE' || state === 'CHECKPOINT' || state === 'ALLCLEAR') return;

  // Always animate particles/dying objects even while waiting
  particles.forEach(p => p.update());
  particles = particles.filter(p => p.alive);
  rats.forEach(r => r.update());
  rats = rats.filter(r => r.alive);
  blocks.forEach(b => b.update());
  blocks = blocks.filter(b => b.alive);

  if (state === 'AIMING') return;

  if (boostCooldown > 0) boostCooldown--;
  if (bird) bird.update();

  // WAITING can be entered mid-flight (win detected before the bird lands).
  // Keep running bird.update() above so it still falls/settles naturally
  // instead of freezing in mid-air — but skip collisions/win-checks below,
  // the result is already being finalized.
  if (state === 'WAITING') return;

  checkCollisions();
  checkBlockRatCollisions();

  // Win check fires even mid-flight (e.g. block crushes last rat)
  if ((state === 'FLYING' || state === 'SETTLING') && totalRatsAtStart > 0) {
    const livingRats = rats.filter(r => r.alive && !r.dying);
    if (livingRats.length === 0) {
      state = 'WAITING';
      setTimeout(() => showResult('WIN'), 800);
      return;
    }
  }

  if (bird && !bird.alive && state === 'FLYING') {
    state = 'SETTLING';
    settleTimer = 0;
  }

  if (state === 'SETTLING') {
    settleTimer++;
    if (settleTimer >= SETTLE_WAIT) {
      state = 'WAITING'; // guard: prevent calling nextBirdOrLose every frame
      nextBirdOrLose();
    }
  }
}

function drawBoostPrompt() {
  if (state !== 'FLYING' || boostUsed || !bird || boostCooldown > 0 || birdType === 'super') return;
  const a = 0.65 + 0.35 * Math.sin(Date.now() * 0.006);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFE030';
  ctx.shadowColor = '#FF8000';
  ctx.shadowBlur = 10;
  ctx.fillText('💥 タップでブースト！', W / 2, H - 55);
  ctx.restore();
}

function drawLuckyAnnouncement() {
  if (luckyTimer <= 0 || !luckyText) return;
  luckyTimer--;
  const alpha = luckyTimer > 60 ? 1 : luckyTimer / 60;
  const scale = luckyTimer > 75 ? 1 + (90 - luckyTimer) * 0.025 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2 - 70);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px Arial';
  const hueShift = (Date.now() * 0.3) % 360;
  ctx.shadowColor = birdType === 'super' ? `hsl(${hueShift},100%,60%)` : birdType === 'giant' ? '#FF8800' : '#0088FF';
  ctx.shadowBlur = birdType === 'super' ? 30 : 22;
  ctx.fillStyle = birdType === 'super' ? `hsl(${hueShift},100%,72%)` : birdType === 'giant' ? '#FFD700' : '#00EEFF';
  ctx.fillText(luckyText, 0, 0);
  ctx.restore();
}

function _dataURLToBlob(dataURL) {
  const [header, base64] = dataURL.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const binary = atob(base64);
  const arr = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function shareResult() {
  const rating = computeRating(score, totalPlayTime, totalDeaths);
  const mins = Math.floor(totalPlayTime / 60);
  const secs = String(totalPlayTime % 60).padStart(2, '0');
  const GRADE_STARS = { '伝説':5, 'エース':4, 'ベテラン':3, 'アマチュア':2, 'ビギナー':1 };
  const stars = '⭐'.repeat(GRADE_STARS[rating] || 1);
  const text = `🎊 Angry Mokumoku 全20ステージ クリア！\n` +
    `🦉 ${rating}モクモク ${stars}\n` +
    `📊 累計スコア: ${score} pt\n` +
    `⏱ プレイ時間: ${mins}分${secs}秒\n` +
    `💀 やられた回数: ${totalDeaths}回\n` +
    `https://aohaus.github.io/Dev/angry-mokumoku.html`;

  // Snapshot the current (all-clear) canvas frame as a shareable PNG.
  // toDataURL is synchronous so this stays inside the click's user-gesture
  // scope, which iOS Safari requires for navigator.share to work.
  let blob = null;
  try { blob = _dataURLToBlob(canvas.toDataURL('image/png')); } catch (e) {}

  if (blob) {
    const file = new File([blob], 'angry-mokumoku-clear.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ title: 'Angry Mokumoku 全クリア！', text, files: [file] }).catch(() => {});
      return;
    }
  }
  if (navigator.share) {
    navigator.share({ title: 'Angry Mokumoku 全クリア！', text }).catch(() => {});
    return;
  }
  if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(() => {}); }
  if (blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'angry-mokumoku-clear.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  shareCopied = true; shareCopiedTimer = 90;
}

function computeRating(totalScore, timeSeconds, deaths) {
  let pts = Math.min(60, Math.floor(totalScore / 500));
  if      (timeSeconds < 300)  pts += 25;
  else if (timeSeconds < 600)  pts += 20;
  else if (timeSeconds < 900)  pts += 14;
  else if (timeSeconds < 1200) pts += 8;
  else if (timeSeconds < 1800) pts += 3;
  pts -= Math.min(25, deaths * 5);
  if (pts >= 72) return '伝説';
  if (pts >= 55) return 'エース';
  if (pts >= 38) return 'ベテラン';
  if (pts >= 20) return 'アマチュア';
  return 'ビギナー';
}

const CHECKPOINTS = {
  9:  { title: '🎉 クアラルンプール編 クリア！', sub: '次は東南アジア各都市を巡る旅へ…',
        col1: '#1C0038', col2: '#0A1830', hue: 190 },
  19: { title: '🎉 東南アジア＆異世界編 クリア！', sub: '次は重力が反転する未知のゾーンへ…',
        col1: '#140A28', col2: '#02051A', hue: 280 },
};

function drawCheckpointScreen() {
  const cp = CHECKPOINTS[currentLevel] || CHECKPOINTS[9];

  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, cp.col1); bg.addColorStop(1, cp.col2);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Gentle sparkle particles (reuses the all-clear firework particle pool, calmer rate)
  if (Math.random() < 0.03) {
    const fx = 80 + Math.random() * (W - 160);
    const fy = 40 + Math.random() * 180;
    const FCOLS = ['#FFD700', '#00CCFF', '#FF88CC', '#88FF88'];
    const fc = FCOLS[Math.floor(Math.random() * FCOLS.length)];
    for (let i = 0; i < 10; i++) {
      const a2 = (i / 10) * Math.PI * 2;
      const sp = 1.5 + Math.random() * 3;
      allClearParticles.push(new Particle(fx, fy, Math.cos(a2)*sp, Math.sin(a2)*sp - 1, fc, 3 + Math.random()*2, 45));
    }
  }
  allClearParticles.forEach(p => {
    p.update();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, Math.PI*2); ctx.fill();
  });
  allClearParticles = allClearParticles.filter(p => p.alive);
  ctx.globalAlpha = 1;

  // Title
  ctx.save();
  ctx.textAlign = 'center';
  ctx.shadowColor = `hsl(${cp.hue},100%,65%)`; ctx.shadowBlur = 30;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 36px Arial';
  ctx.fillText(cp.title, W/2, 130);
  ctx.shadowBlur = 0;
  ctx.restore();

  // Bouncing Mokumoku
  const bob = Math.sin(Date.now() * 0.003) * 6;
  const tilt = Math.sin(Date.now() * 0.002) * 0.12;
  drawMokumoku(W/2, 240 + bob, 52, tilt, 'angry');

  // Subtitle / teaser
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '18px Arial';
  ctx.fillText(cp.sub, W/2, 330);
  ctx.fillStyle = 'rgba(255,224,60,0.9)';
  ctx.font = '15px Arial';
  ctx.fillText(`累計スコア: ${score} pt`, W/2, 358);
  ctx.restore();

  // Tap to continue
  const pulse = 0.6 + 0.4 * Math.sin(Date.now() * 0.005);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFE030';
  ctx.font = 'bold 18px Arial';
  ctx.fillText('▶ タップして次のステージへ ◀', W/2, H - 30);
  ctx.restore();
}

function drawAllClearScreen() {
  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1C0038'); bg.addColorStop(1, '#020A20');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Spawn fireworks
  if (Math.random() < 0.06) {
    const fx = 80 + Math.random() * (W - 160);
    const fy = 40 + Math.random() * 200;
    const FCOLS = ['#FF3060','#FF9020','#FFE030','#30FF90','#30A0FF','#CC30FF','#FF30C0'];
    const fc = FCOLS[Math.floor(Math.random() * FCOLS.length)];
    for (let i = 0; i < 18; i++) {
      const a2 = (i / 18) * Math.PI * 2;
      const sp = 2 + Math.random() * 4.5;
      allClearParticles.push(new Particle(fx, fy, Math.cos(a2)*sp, Math.sin(a2)*sp - 1.5, fc, 4 + Math.random()*3, 55));
    }
  }
  // Update & draw firework particles
  allClearParticles.forEach(p => {
    p.update();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, Math.PI*2); ctx.fill();
  });
  allClearParticles = allClearParticles.filter(p => p.alive);
  ctx.globalAlpha = 1;

  // "全クリア！" title
  ctx.save();
  ctx.textAlign = 'center';
  const hue = (Date.now() * 0.2) % 360;
  ctx.shadowColor = `hsl(${hue},100%,65%)`; ctx.shadowBlur = 38;
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 58px Arial';
  ctx.fillText('🎊  全 ク リ ア ！  🎊', W/2, 88);
  ctx.shadowBlur = 0;
  ctx.restore();

  // Bouncing Mokumoku
  const bob = Math.sin(Date.now() * 0.003) * 6;
  const tilt = Math.sin(Date.now() * 0.002) * 0.12;
  drawMokumoku(W/2, 182 + bob, 52, tilt, 'super-angry');

  // Rating
  const rating = computeRating(score, totalPlayTime, totalDeaths);
  const GRADE_COLS = { '伝説':'#FFD700', 'エース':'#FF88FF', 'ベテラン':'#60DDFF', 'アマチュア':'#AAFFAA', 'ビギナー':'#AAAAAA' };
  const GRADE_STARS = { '伝説':5, 'エース':4, 'ベテラン':3, 'アマチュア':2, 'ビギナー':1 };
  const gcol = GRADE_COLS[rating] || '#FFFFFF';
  const stars = GRADE_STARS[rating] || 1;

  ctx.save();
  ctx.textAlign = 'center';
  ctx.shadowColor = gcol; ctx.shadowBlur = 22;
  ctx.fillStyle = gcol;
  ctx.font = 'bold 38px Arial';
  ctx.fillText(`${rating}モクモク`, W/2, 268);
  ctx.shadowBlur = 0;
  ctx.font = '30px Arial';
  ctx.fillText('⭐'.repeat(stars) + '☆'.repeat(5 - stars), W/2, 306);
  ctx.restore();

  // Stats
  const mins = Math.floor(totalPlayTime / 60);
  const secs = totalPlayTime % 60;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  ctx.font = '17px Arial';
  ctx.fillText(`累計スコア: ${score} pt`, W/2, 346);
  ctx.fillText(`プレイ時間: ${mins}分 ${String(secs).padStart(2,'0')}秒`, W/2, 370);
  ctx.fillText(`やられた回数: ${totalDeaths}回`, W/2, 394);
  ctx.restore();

  // Share button
  const sbx = W/2, sby = 418;
  ctx.save();
  ctx.shadowColor = '#00CCFF'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#0099DD';
  ctx.beginPath(); ctx.roundRect(sbx - 90, sby - 20, 180, 38, 20); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'white';
  ctx.font = 'bold 18px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('📤 シェアする', sbx, sby);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
  // "Copied!" toast
  if (shareCopied && shareCopiedTimer > 0) {
    shareCopiedTimer--;
    if (shareCopiedTimer <= 0) { shareCopied = false; }
    const ta = shareCopiedTimer > 60 ? 1 : shareCopiedTimer / 60;
    ctx.save();
    ctx.globalAlpha = ta;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#00FFAA';
    ctx.font = 'bold 16px Arial';
    ctx.shadowColor = '#00CC88'; ctx.shadowBlur = 10;
    ctx.fillText('✅ テキストをコピー・画像を保存しました！', W/2, sby + 30);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  // Tap to continue
  const pulse = 0.6 + 0.4 * Math.sin(Date.now() * 0.005);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFE030';
  ctx.font = 'bold 18px Arial';
  ctx.fillText('▶ タップしてタイトルへ ◀', W/2, H - 24);
  ctx.restore();
}

function drawTitleScreen() {
  titleFrame++;
  // Game Boy-style dark BG
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#030D08'); bg.addColorStop(1, '#081810');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // Scanlines
  for (let y = 0; y < H; y += 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, y, W, 2);
  }
  // Border
  ctx.strokeStyle = '#2A7A30'; ctx.lineWidth = 3;
  ctx.strokeRect(12, 12, W-24, H-24);
  ctx.strokeStyle = '#1A5020'; ctx.lineWidth = 1;
  ctx.strokeRect(17, 17, W-34, H-34);

  // Title
  ctx.save();
  ctx.textAlign = 'center';
  ctx.shadowColor = '#66FF44'; ctx.shadowBlur = 24;
  ctx.fillStyle = '#88FF66';
  ctx.font = 'bold 50px "Courier New", monospace';
  ctx.fillText('ANGRY MOKUMOKU', W/2, 85);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#3A9040';
  ctx.font = '16px "Courier New", monospace';
  ctx.fillText('★  K L  C I T Y  E D I T I O N  ★', W/2, 112);
  ctx.restore();

  // Cross-links to the sister games
  ctx.save();
  ctx.textAlign = 'right';
  ctx.font = '12px "Courier New", monospace';
  const linkPulse = 0.7 + 0.3 * Math.sin(titleFrame * 0.05);
  ctx.globalAlpha = linkPulse;
  ctx.fillStyle = '#FF8FC4';
  ctx.fillText('🍬 モヨモヨへ ▶', W - 20, 28);
  ctx.fillStyle = '#FFD37A';
  ctx.fillText('⚽ MK Mobileへ ▶', W - 20, 48);
  ctx.restore();

  // Owl character
  const bob = Math.sin(titleFrame * 0.05) * 6;
  const tilt = Math.sin(titleFrame * 0.028) * 0.07;
  drawMokumoku(W/2, 210 + bob, 58, tilt, 'neutral');

  // Stars around owl
  const sparkT = (titleFrame * 0.04) % (Math.PI * 2);
  [[W/2-85,185],[ W/2+90,175],[W/2-70,250],[W/2+75,255]].forEach(([sx,sy],i)=>{
    const s = 0.5 + 0.5*Math.sin(sparkT + i*1.5);
    ctx.globalAlpha = s * 0.8;
    ctx.fillStyle = '#CCFF66';
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('✦', sx, sy);
  });
  ctx.globalAlpha = 1;

  // Menu
  const savedLevel = getSavedLevel();
  const hasSave    = savedLevel >= 0 && savedLevel < LEVEL_CONFIGS.length;
  const menuY = 345;
  const items = [
    { text: 'はじめから',                   enabled: true  },
    { text: hasSave ? `つづきから  (Lv.${savedLevel+1})` : 'つづきから  (データなし)', enabled: hasSave },
  ];
  ctx.font = 'bold 20px "Courier New", monospace';
  items.forEach((item, i) => {
    const sel = titleMenuSel === i;
    const y   = menuY + i * 46;
    ctx.textAlign = 'center';
    if (!item.enabled) {
      ctx.fillStyle = '#1A4520'; ctx.shadowBlur = 0;
    } else if (sel) {
      ctx.fillStyle = '#CCFF66';
      ctx.shadowColor = '#88FF44'; ctx.shadowBlur = 12;
    } else {
      ctx.fillStyle = '#44AA44'; ctx.shadowBlur = 0;
    }
    const arrow = sel ? '▶ ' : '  ';
    ctx.fillText(arrow + item.text, W/2, y);
  });
  ctx.shadowBlur = 0;

  // Player count
  if (onlinePlayers > 1) {
    ctx.fillStyle = '#2A6A2A'; ctx.font = '13px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`👥 オンライン: ${onlinePlayers}人`, W/2, H-36);
  }
  // Footer
  ctx.fillStyle = '#1E4A20'; ctx.font = '12px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('CLICK OR TAP TO SELECT  •  ARROW KEYS TO MOVE', W/2, H-20);
}

function drawPlayerCount() {
  if (onlinePlayers <= 1) return;
  ctx.save();
  ctx.textAlign = 'right'; ctx.font = '13px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(`👥 ${onlinePlayers}`, W - 14, H - 14);
  ctx.restore();
}

function drawComboAnnouncement() {
  if (comboTimer <= 0 || !comboText) return;
  comboTimer--;
  const alpha = comboTimer > 60 ? 1 : comboTimer / 60;
  const scale = comboTimer > 80 ? 1 + (100 - comboTimer) * 0.018 : 1;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2 + 30);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center';
  ctx.font = 'bold 30px Arial';
  ctx.shadowColor = '#FF6600'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#FFD700';
  ctx.fillText(comboText, 0, 0);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'TITLE') { drawTitleScreen(); return; }
  if (state === 'ALLCLEAR') { drawAllClearScreen(); return; }
  if (state === 'CHECKPOINT') { drawCheckpointScreen(); return; }
  // Screen shake
  ctx.save();
  ctx.translate(shakeX, shakeY);
  shakeX *= 0.72; shakeY *= 0.72;
  if (Math.abs(shakeX) < 0.1) shakeX = 0;
  if (Math.abs(shakeY) < 0.1) shakeY = 0;
  drawBackground();
  drawBlocks();
  drawRats();
  drawParticles();
  drawWaitingBirds();
  drawSlingshot();
  drawBird();
  if (state === 'AIMING') drawAimUI();
  drawBoostPrompt();
  drawPlayerCount();
  drawLuckyAnnouncement();
  drawComboAnnouncement();
  ctx.restore(); // end shake translate
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ─── INIT ─────────────────────────────────────────────────────

function init() {
  state = 'TITLE';
  titleMenuSel = 0;
  titleFrame = 0;
  initPlayerTracking();
  loop();
}

init();
</script>
</body>
</html>
