<!-- Home-screen / PWA setup -->

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1228;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  user-select: none;
  overflow: hidden;
  touch-action: none;
}
#wrapper {
  position: relative;
  display: inline-block;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  width: 100vw;
  max-width: min(1366px, calc(100vh * 1.8));
}
canvas { display: block; cursor: crosshair; width: 100%; height: auto; }
#hud {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 10px 16px;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
}
#score-display {
  background: rgba(0,0,0,0.45);

  font-size: 16px; font-weight: 700;
  padding: 6px 14px; border-radius: 20px;
  letter-spacing: 0.3px;
}
#target-display {
  background: rgba(0,0,0,0.35);

  letter-spacing: 0.2px;
}
#birds-display {
  font-size: 20px;
  background: rgba(0,0,0,0.45);
  padding: 6px 12px; border-radius: 20px;
}
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;

  backdrop-filter: blur(4px);
  pointer-events: all;
}
#overlay.hidden { display: none; }
#overlay h1 { color: #fff; font-size: 42px; margin-bottom: 8px; text-shadow: 0 2px 12px rgba(0,0,0,0.5); }
#overlay p { color: #FFE066; font-size: 18px; margin-bottom: 24px; }
#overlay .btn-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
#overlay button {
  background: #FF6B35; color: #fff;

  padding: 12px 32px; font-size: 18px; font-weight: 700;

#overlay button:hover { background: #FF8C5A; transform: scale(1.05); }
#ov-next-btn { background: #3DA890; box-shadow: 0 4px 16px rgba(61,168,144,0.4); }
#ov-next-btn:hover { background: #4ABEA3; }
#boost-hint {
  position: absolute; bottom: 14px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.45);
  color: rgba(255,255,255,0.85);
  font-size: 13px; padding: 5px 14px; border-radius: 20px;
  pointer-events: none; opacity: 0; transition: opacity 0.3s;
  white-space: nowrap;
}
#rotate-hint {
  display: none;
  position: fixed; inset: 0; z-index: 999;
  background: #1a1228;
  flex-direction: column; align-items: center; justify-content: center;
  color: white; font-size: 18px; gap: 16px;
}
#rotate-hint span { font-size: 56px; animation: spin 1.5s ease-in-out infinite alternate; }
@keyframes spin { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }
@media (max-width: 600px) and (orientation: portrait) {
  #rotate-hint { display: flex; }
}
</style>

<body>
<div id="wrapper">
  <canvas id="c"></canvas>
  <div id="hud" style="visibility:hidden">
    <div id="score-display">Lv.1 | スコア: 0</div>
    <div id="target-display">⭐⭐⭐ = 1800pt</div>

</div>

</div>

<script>
// ─── CANVAS ───────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 900, H = 500;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

// ─── CONFIG ───────────────────────────────────────────────────
const GRAV        = 0.42;
const GROUND_Y    = 435;
const SX          = 155;   // slingshot x
const SY          = GROUND_Y;
const FORK_H      = 143;
const FORK_Y      = SY - FORK_H;
const MAX_PULL    = 90;
const POWER       = 0.19;
const BOOST_SPD   = 7;
const BIRD_R      = 23;
const GIANT_R     = 38;
const SPEED_MULT  = 1.4;
const RAT_R       = 17;
const SETTLE_WAIT = 90;
const CEIL_Y      = 65;   // "floor" anchor line for reversed-gravity levels (mirrors GROUND_Y's margin)

// Per-level gravity state (levels 21-25 flip gravity — see setupLevel()).
// curGDir:  1 = normal (floor below, gravity pulls down), -1 = flipped (floor above, gravity pulls up)
let curGDir   = 1;
let curFloorY = GROUND_Y;
let curGrav   = GRAV;
// Amount to add to vy to "pop" something away from its resting surface
// (upward when normal, downward when flipped) — used for death/knockback pops.
function popAway(amount) { return curGDir * -amount; }
// Level-builder helper: the y coordinate `dist` px out from the floor/ceiling
// into open play space. Equivalent to `GROUND_Y - dist` when gravity is normal.
function GY(dist) { return curFloorY - curGDir * dist; }

// ─── LEVELS ───────────────────────────────────────────────────
// Stars calibrated: max = sum(rat.pts) + blocks*50 + potential_unused*200
// thresholds ≈ 35% / 65% / 88% of max
const LEVEL_CONFIGS = [
  { birds: 3, stars: [ 800, 1500, 2000], name: 'Lv.1'  }, // max≈2300
  { birds: 4, stars: [1000, 1900, 2500], name: 'Lv.2'  }, // max≈2850
  { birds: 4, stars: [1100, 2100, 2800], name: 'Lv.3'  }, // max≈3150
  { birds: 5, stars: [1300, 2500, 3400], name: 'Lv.4'  }, // max≈3850
  { birds: 5, stars: [1500, 2900, 3900], name: 'Lv.5'  }, // max≈4400
  { birds: 5, stars: [1600, 3000, 4000], name: 'Lv.6'  }, // max≈4550
  { birds: 6, stars: [1700, 3300, 4400], name: 'Lv.7'  }, // max≈5000
  { birds: 6, stars: [1900, 3700, 4900], name: 'Lv.8'  }, // max≈5600
  { birds: 6, stars: [1800, 3500, 4600], name: 'Lv.9'  }, // max≈5250
  { birds: 6, stars: [2200, 4300, 5700], name: 'Lv.10' }, // max≈6500
  { birds: 7, stars: [2500, 4800, 6400], name: 'Lv.11' }, // Bangkok
  { birds: 7, stars: [2700, 5200, 7000], name: 'Lv.12' }, // Singapore
  { birds: 7, stars: [2900, 5600, 7500], name: 'Lv.13' }, // Jakarta
  { birds: 8, stars: [3200, 6000, 8000], name: 'Lv.14' }, // Hanoi
  { birds: 8, stars: [3500, 6500, 8800], name: 'Lv.15' }, // Manila
  { birds: 8, stars: [3800, 7000, 9500], name: 'Lv.16' }, // 暗黒城
  { birds: 8, stars: [4000, 7500,10000], name: 'Lv.17' }, // 溶岩域
  { birds: 8, stars: [4200, 8000,10800], name: 'Lv.18' }, // 氷の世界
  { birds: 9, stars: [4500, 8500,11500], name: 'Lv.19' }, // 魔法の森
  { birds: 9, stars: [5000, 9000,12500], name: 'Lv.20' }, // 天空神殿
  { birds: 8, stars: [4800, 9000,12000], name: 'Lv.21' }, // 重力反転ゾーン1
  { birds: 8, stars: [5100, 9600,12800], name: 'Lv.22' }, // 重力反転ゾーン2
  { birds: 9, stars: [5400,10200,13600], name: 'Lv.23' }, // 重力反転ゾーン3
  { birds: 9, stars: [5700,10800,14400], name: 'Lv.24' }, // 重力反転ゾーン4
  { birds: 9, stars: [6000,11400,15200], name: 'Lv.25' }, // 重力反転ゾーン5
  { birds: 8, stars: [6300,12000,16000], name: 'Lv.26' }, // アルゼンチン
  { birds: 8, stars: [6600,12600,16800], name: 'Lv.27' }, // フランス
  { birds: 9, stars: [6900,13200,17600], name: 'Lv.28' }, // ブラジル
  { birds: 9, stars: [7200,13800,18400], name: 'Lv.29' }, // 日本
  { birds:10, stars: [7800,14800,19800], name: 'Lv.30' }, // スペイン
];
const BIRD_BONUS = 200; // pts per unused bird at win

// ─── TIME / SAVE / PLAYERS ────────────────────────────────────
function getTimeOfDay() {
  const h = new Date().getHours();
  if (h >= 6  && h < 12) return 'morning';
  if (h >= 12 && h < 18) return 'day';
  if (h >= 18 && h < 22) return 'evening';
  return 'night';
}
function getLevelGroup(idx) {
  if (idx < 10) return Math.floor(idx / 2);  // KL: groups 0-4
  if (idx < 15) return 5 + (idx - 10);        // SE Asia: groups 5-9
  if (idx < 20) return 10 + (idx - 15);       // Isekai: groups 10-14
  if (idx < 25) return 15 + (idx - 20);       // Reversed Gravity: groups 15-19
  return 20 + (idx - 25);                      // Soccer kits: groups 20-24
}
function saveProgress() { localStorage.setItem('amoku-level', (currentLevel + 1).toString()); }
function getSavedLevel() {
  const v = localStorage.getItem('amoku-level');
  return v !== null ? parseInt(v) : -1;
}
function initPlayerTracking() {
  if (typeof BroadcastChannel === 'undefined') return;
  const ch = new BroadcastChannel('amoku-players');
  const myId = Date.now().toString(36);
  const peers = new Set();
  ch.onmessage = e => {
    if (e.data.type === 'hello') {
      peers.add(e.data.id);
      ch.postMessage({ type: 'ack', id: myId });
    } else if (e.data.type === 'ack') {
      peers.add(e.data.id);
    } else if (e.data.type === 'bye') {
      peers.delete(e.data.id);
    }
    onlinePlayers = peers.size + 1;
  };
  ch.postMessage({ type: 'hello', id: myId });
  window.addEventListener('beforeunload', () => ch.postMessage({ type: 'bye', id: myId }));
  setInterval(() => ch.postMessage({ type: 'hello', id: myId }), 8000);
}
function applyBrightness(hex, f) {
  const r = Math.round(parseInt(hex.slice(1,3),16)*f);
  const g = Math.round(parseInt(hex.slice(3,5),16)*f);
  const b = Math.round(parseInt(hex.slice(5,7),16)*f);
  return `rgb(${r},${g},${b})`;
}

// ─── STATE ────────────────────────────────────────────────────
let state        = 'TITLE'; // TITLE | AIMING | FLYING | SETTLING | WAITING | WIN | LOSE | CHECKPOINT | ALLCLEAR
let score        = 0;
let currentLevel = 0;
let totalBirds   = LEVEL_CONFIGS[0].birds;
let birdsLeft    = totalBirds;
let settleTimer  = 0;
let boostUsed    = false;
let boostCooldown = 0;
let birdType     = 'normal'; // 'normal' | 'giant' | 'speed' | 'super'
let luckyTimer   = 0;
let luckyText    = '';
let ratsKilled   = 0;
let totalRatsAtStart = 0;
let bird         = null;
let blocks       = [];
let rats         = [];
let titleMenuSel = 0;
let titleFrame   = 0;
let onlinePlayers = 1;
let totalDeaths   = 0;
let levelStartScore = 0;
let gameStartTime  = 0;
let totalPlayTime  = 0;
let allClearParticles = [];
let particles    = [];
let shakeX = 0, shakeY = 0;
let comboCount  = 0;
let comboTimer  = 0;
let comboText   = '';
let lastKillTime = 0;
let shareCopied = false;
let shareCopiedTimer = 0;
let mouse        = { x: 0, y: 0, down: false };
let dragging     = false;
let pullX = 0, pullY = 0;

// ─── CLASSES ──────────────────────────────────────────────────

class Bird {
  constructor(x, y, r, type) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.r = r || BIRD_R;
    this.type = type || 'normal';
    this.angle = 0;
    this.alive = true;
    this.launched = false;
    this.trail = [];
    this.flash = 0;
    this.sinePhase = 0;
    this.dirX = 0; this.dirY = 0; this.perpX = 0; this.perpY = 0;
    this.speed = 0; this.baseX = 0; this.baseY = 0; this.travel = 0;
  }
  update() {
    if (!this.launched) return;

    if (this.type === 'super') {
      // No gravity arc — flies straight in the aimed direction, waving side to side.
      this.travel += this.speed;
      this.sinePhase += 0.16;
      const wave = Math.sin(this.sinePhase) * 34;
      this.x = this.baseX + this.dirX * this.travel + this.perpX * wave;
      this.y = this.baseY + this.dirY * this.travel + this.perpY * wave;
      this.angle = Math.atan2(this.dirY, this.dirX);
      this.flash = Math.max(0, this.flash - 1);
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 22) this.trail.shift();
      if (curGDir === 1 ? (this.y + this.r >= curFloorY) : (this.y - this.r <= curFloorY)) {
        this.y = curGDir === 1 ? (curFloorY - this.r) : (curFloorY + this.r);
        addParticles(this.x, this.y + curGDir * this.r, '#C8A060', 5, 2);
        this.alive = false;
      }
      if (this.x > W + 120 || this.x < -120 || this.y > H + 150 || this.y < -150) this.alive = false;
      return;
    }

    this.vy += curGrav;
    this.x += this.vx;
    this.y += this.vy;
    this.angle = Math.atan2(this.vy, this.vx);
    this.flash = Math.max(0, this.flash - 1);

    // Trail
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 22) this.trail.shift();

    // Floor/ceiling contact (whichever side gravity pulls toward)
    if (curGDir === 1 ? (this.y + this.r >= curFloorY) : (this.y - this.r <= curFloorY)) {
      this.y = curGDir === 1 ? (curFloorY - this.r) : (curFloorY + this.r);
      this.vy *= -0.35;
      this.vx *= 0.78;
      addParticles(this.x, this.y + curGDir * this.r, '#C8A060', 5, 2);
      if (Math.abs(this.vy) < 1.5) { this.vy = 0; this.alive = false; }
    }
    if (this.x > W + 120 || this.x < -120 || this.y > H + 150 || this.y < -150) this.alive = false;
  }
}

class Block {
  constructor(x, y, w, h, type) {
    this.x = x; this.y = y;
    this.w = w; this.h = h;
    this.type = type;
    this.vx = 0; this.vy = 0;
    this.angle = 0;
    this.angV = 0;
    this.alive = true;
    this.hp = type === 'bamboo' ? 1.5 : type === 'wood' ? 3 : type === 'tnt' ? 4 : 5;
    this.flash = 0;
    this.grounded = true;
  }
  update() {
    this.flash = Math.max(0, this.flash - 1);
    if (this.grounded && this.vy === 0 && Math.abs(this.vx) < 0.2) return;
    this.grounded = false;
    this.vy += curGrav;
    this.x += this.vx;
    this.y += this.vy;
    this.angle += this.angV;
    this.vx *= 0.99;
    this.angV *= 0.97;

    if (curGDir === 1 ? (this.y + this.h / 2 >= curFloorY) : (this.y - this.h / 2 <= curFloorY)) {
      this.y = curGDir === 1 ? (curFloorY - this.h / 2) : (curFloorY + this.h / 2);
      this.vy *= -0.28;
      this.vx *= 0.82;
      this.angV *= 0.68;
      if (Math.abs(this.vy) < 1.2) { this.vy = 0; this.grounded = true; }
    }
  }
}

class Rat {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type || 'chef';
    if (this.type === 'boss')       { this.r = 22; this.pts = 800; }
    else if (this.type === 'ninja') { this.r = 13; this.pts = 350; }
    else if (this.type === 'suit')  { this.r = 17; this.pts = 600; }
    else if (this.type === 'baby')  { this.r = 10; this.pts = 200; }
    else                            { this.r = 17; this.pts = 500; } // chef
    this.vx = 0; this.vy = 0;
    this.angle = 0;
    this.angV = 0;
    this.alive = true;
    this.dying = false;
    this.deathT = 0;
    this.grounded = true;
    this.eyeAnim = Math.random() * Math.PI * 2;
    this.patrol = false;
    this.patrolDir = 1;
    this.patrolHome = x;
    this.patrolRange = 18;
    this.vPatrol = false;
    this.vPatrolHome = y;
    this.vPatrolRange = 0;
    this.vPhase = Math.random() * Math.PI * 2;
  }
  update() {
    this.eyeAnim += 0.06;
    if (this.dying) {
      this.deathT++;
      this.vy += curGrav;
      this.x += this.vx;
      this.y += this.vy;
      this.angle += this.angV;
      if (this.deathT > 55 || this.y > H + 60 || this.y < -60) this.alive = false;
      return;
    }
    if (this.vPatrol) {
      this.vPhase += 0.045;
      this.y = this.vPatrolHome + Math.sin(this.vPhase) * this.vPatrolRange;
      this.angle *= 0.88; if (Math.abs(this.angle) < 0.02) this.angle = 0;
      return;
    }
    if (this.patrol && this.grounded) {
      this.angle *= 0.88; if (Math.abs(this.angle) < 0.02) this.angle = 0;
      this.x += this.patrolDir * 0.7;
      if (Math.abs(this.x - this.patrolHome) > this.patrolRange) this.patrolDir *= -1;
      this.x = clamp(this.x, this.r + 2, W - this.r - 2);
      return;
    }
    if (this.grounded && this.vy === 0 && Math.abs(this.vx) < 0.1) {
      this.angle *= 0.88; if (Math.abs(this.angle) < 0.02) this.angle = 0;
      return;
    }
    const wasAirborne = !this.grounded;
    this.grounded = false;
    this.vy += curGrav;
    this.x += this.vx;
    this.y += this.vy;
    this.angle += this.angV;
    this.vx *= 0.95;
    this.angV *= 0.9;

    if (curGDir === 1 ? (this.y + this.r >= curFloorY) : (this.y - this.r <= curFloorY)) {
      const impactVy = this.vy;
      this.y = curGDir === 1 ? (curFloorY - this.r) : (curFloorY + this.r);
      this.vy *= -0.4;
      this.vx *= 0.85;
      this.angV *= 0.7;
      if (Math.abs(this.vy) < 1) { this.vy = 0; this.grounded = true; }
      // Kill rat that falls hard into the floor/ceiling (knocked off perch)
      if (wasAirborne && (curGDir === 1 ? impactVy > 3 : impactVy < -3)) {
        this.die();
        return;
      }
    }
    this.x = clamp(this.x, this.r + 2, W - this.r - 2);
    if (this.y > H + 60 || this.y < -60) { this.alive = false; }
  }
  die() {
    if (this.dying) return;
    this.dying = true;
    this.vx += (Math.random() - 0.5) * 5;
    this.vy += popAway(5 + Math.random() * 3);
    this.angV = (Math.random() - 0.5) * 0.35;
    // Combo multiplier
    const now = Date.now();
    if (lastKillTime > 0 && now - lastKillTime < 2000) {
      comboCount++;
    } else {
      comboCount = 0;
    }
    lastKillTime = now;
    const mult = 1 + comboCount * 0.5;
    const earned = Math.round(this.pts * mult);
    score += earned;
    ratsKilled++;
    if (comboCount > 0) {
      comboText  = `${comboCount + 1}コンボ！  ×${mult.toFixed(1)}`;
      comboTimer = 100;
    }
    updateHUD();
    addParticles(this.x, this.y, '#FFB830', 14, 4);
    addParticles(this.x, this.y, '#FF6030', 8, 3);
    addShake(comboCount > 1 ? 10 : 5);
  }
}

class Particle {
  constructor(x, y, vx, vy, col, sz, life) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.col = col; this.sz = sz;
    this.alpha = 1;
    this.life = life || 35;
    this.age = 0;
  }
  update() {
    this.vy += 0.18;
    this.x += this.vx; this.y += this.vy;
    this.age++;
    this.alpha = 1 - this.age / this.life;
    this.sz *= 0.94;
  }
  get alive() { return this.age < this.life; }
}

// ─── HELPERS ──────────────────────────────────────────────────

function addParticles(x, y, col, count, sz) {
  for (let i = 0; i < count; i++) {
    const a = Math.PI * 2 * i / count + Math.random() * 0.5;
    const sp = 2 + Math.random() * 5;
    particles.push(new Particle(x, y, Math.cos(a)*sp, Math.sin(a)*sp - 2, col, sz || 5));
  }
}

function addShake(intensity) {
  shakeX = (Math.random() - 0.5) * intensity * 2;
  shakeY = (Math.random() - 0.5) * intensity * 2;
}

function updateHUD() {
  const cfg = LEVEL_CONFIGS[currentLevel];
  document.getElementById('score-display').textContent = `${cfg.name} | スコア: ${score}`;
  document.getElementById('target-display').textContent = `🐀 ${ratsKilled}/${totalRatsAtStart}匹`;
  const rem = Math.max(0, birdsLeft);
  document.getElementById('birds-display').textContent = '🦉'.repeat(rem);
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ─── LEVEL ────────────────────────────────────────────────────

function makeBlock(x, y, w, h, type) {
  const b = new Block(x, y, w, h, type);
  blocks.push(b); return b;
}
function makeRat(x, y, type, patrol, vRange) {
  const r = new Rat(x, y, type || 'chef');
  if (patrol) { r.patrol = true; r.patrolHome = x; }
  if (vRange) { r.vPatrol = true; r.vPatrolHome = y; r.vPatrolRange = vRange; }
  rats.push(r); return r;
}

// Scales every block/rat's distance from the floor/ceiling anchor uniformly
// so the tallest tower's far edge never goes off-canvas — stacked pieces
// stay glued together since they all scale by the same factor. Works for
// both normal levels (anchor = ground, structures reach toward the top) and
// gravity-flipped levels (anchor = ceiling, structures hang toward the bottom).
function _clampLevelToScreen() {
  const SAFE_MARGIN = 18;
  const s = curGDir;
  const anchor = curFloorY;
  const limitDist = s === 1 ? (anchor - SAFE_MARGIN) : ((GROUND_Y - 40) - anchor);
  const extentOf = (edgeY) => s * (anchor - edgeY);
  let maxExtent = 0;
  blocks.forEach(b => {
    const edge = s === 1 ? (b.y - b.h / 2) : (b.y + b.h / 2);
    maxExtent = Math.max(maxExtent, extentOf(edge));
  });
  rats.forEach(r => {
    const margin = r.type === 'boss' ? r.r * 2.2 : r.type === 'chef' ? r.r * 2.0 : r.r * 1.5;
    const baseY = r.vPatrol ? r.vPatrolHome : r.y;
    const vExtra = r.vPatrol ? r.vPatrolRange : 0;
    const edge = s === 1 ? (baseY - margin - vExtra) : (baseY + margin + vExtra);
    maxExtent = Math.max(maxExtent, extentOf(edge));
  });
  if (maxExtent <= limitDist) return;
  const F = limitDist / maxExtent;
  blocks.forEach(b => {
    const dist = s * (anchor - b.y);
    b.y = anchor - s * dist * F;
    b.h *= F;
  });
  rats.forEach(r => {
    const dist = s * (anchor - r.y);
    r.y = anchor - s * dist * F;
    if (r.vPatrol) {
      const vDist = s * (anchor - r.vPatrolHome);
      r.vPatrolHome = anchor - s * vDist * F;
      r.vPatrolRange *= F;
    }
  });
}

function setupLevel(idx) {
  blocks = []; rats = [];
  ratsKilled = 0;
  comboCount = 0; comboTimer = 0; comboText = ''; lastKillTime = 0;
  const cfg = LEVEL_CONFIGS[idx];
  totalBirds = cfg.birds;
  birdsLeft  = totalBirds;
  const flipped = idx >= 20 && idx <= 24;
  curGDir   = flipped ? -1 : 1;
  curFloorY = flipped ? CEIL_Y : GROUND_Y;
  curGrav   = GRAV * curGDir;
  [_buildLevel1,_buildLevel2,_buildLevel3,_buildLevel4,_buildLevel5,
   _buildLevel6,_buildLevel7,_buildLevel8,_buildLevel9,_buildLevel10,
   _buildLevel11,_buildLevel12,_buildLevel13,_buildLevel14,_buildLevel15,
   _buildLevel16,_buildLevel17,_buildLevel18,_buildLevel19,_buildLevel20,
   _buildLevel21,_buildLevel22,_buildLevel23,_buildLevel24,_buildLevel25,
   _buildLevel26,_buildLevel27,_buildLevel28,_buildLevel29,_buildLevel30][idx]();
  _clampLevelToScreen();
  totalRatsAtStart = rats.length;
}

  boostCooldown = 0;
  dragging = false;

  const roll = Math.random();
  if (roll < 0.02) {
    birdType = 'super';
    luckyText = '🌈 スーパーモクモク！！';
    luckyTimer = 110;
  } else if (roll < 0.17) {
    birdType = 'giant';
    luckyText = '🌟 ジャイアントモクモク！';
    luckyTimer = 90;
  } else if (roll < 0.37) {

  bird = new Bird(SX, FORK_Y, r, birdType);
  document.getElementById('boost-hint').style.opacity = '0';
}

// ─── COLLISION ────────────────────────────────────────────────

function circleRect(cx, cy, cr, rx, ry, rw, rh) {
  const nx = clamp(cx, rx - rw/2, rx + rw/2);
  const ny = clamp(cy, ry - rh/2, ry + rh/2);
  const dx = cx - nx, dy = cy - ny;
  const d2 = dx*dx + dy*dy;
  if (d2 >= cr*cr) return null;
  const d = Math.sqrt(d2) || 0.001;
  return { nx: dx/d, ny: dy/d, d };
}

function circleCirle(ax, ay, ar, bx, by, br) {
  const dx = bx - ax, dy = by - ay;
  const d2 = dx*dx + dy*dy;
  if (d2 >= (ar+br)*(ar+br)) return null;
  const d = Math.sqrt(d2) || 0.001;
  return { nx: dx/d, ny: dy/d, d };
}

function explodeTNT(x, y) {
  addParticles(x, y, '#FF5500', 22, 7);
  addParticles(x, y, '#FFD000', 16, 5);
  addParticles(x, y, '#FF0000', 10, 4);
  addShake(16);
  score += 100; updateHUD();
  const BLAST = 155;
  rats.forEach(rat => {
    if (!rat.alive || rat.dying) return;
    const dx = rat.x - x, dy = rat.y - y;
    if (Math.sqrt(dx*dx + dy*dy) < BLAST) rat.die();
  });
  blocks.forEach(blk => {
    if (!blk.alive) return;
    const dx = blk.x - x, dy = blk.y - y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d >= BLAST) return;
    blk.hp -= 3.5 * (1 - d / BLAST);
    if (blk.hp <= 0) {
      blk.alive = false;
      score += 50; updateHUD();
      addParticles(blk.x, blk.y, blockColor(blk.type), 8, 3);
      if (blk.type === 'tnt') setTimeout(() => explodeTNT(blk.x, blk.y), 160);
    } else {
      const f = (1 - d / BLAST) * 7;
      blk.vx += (dx / (d||1)) * f;
      blk.vy += (dy / (d||1)) * f;
      blk.angV += (Math.random() - 0.5) * 0.2;
      blk.grounded = false;
    }
  });
}

function checkCollisions() {
  if (!bird || !bird.launched || !bird.alive) return;
  const speed = Math.sqrt(bird.vx*bird.vx + bird.vy*bird.vy);
  const dmgMult = birdType === 'super' ? 3.2 : birdType === 'giant' ? 2.5 : birdType === 'speed' ? 1.4 : 1;
  const bounce  = birdType === 'super' ? 0.92 : birdType === 'giant' ? 0.85 : 0.65;

  rats.forEach(rat => {
    if (!rat.alive || rat.dying) return;
    const c = circleCirle(bird.x, bird.y, bird.r, rat.x, rat.y, rat.r);
    if (c) {
      rat.die();
      bird.vx *= bounce; bird.vy *= bounce;
    }
  });

  blocks.forEach(blk => {
    if (!blk.alive) return;
    const c = circleRect(bird.x, bird.y, bird.r, blk.x, blk.y, blk.w, blk.h);
    if (!c) return;

    blk.hp -= speed * 0.12 * dmgMult;
    blk.flash = 8;

    if (blk.hp <= 0) {
      blk.alive = false;
      if (blk.type === 'tnt') {
        explodeTNT(blk.x, blk.y);
        addShake(12);
      } else {
        score += 50; updateHUD();
        addParticles(blk.x, blk.y, blockColor(blk.type), 10, 4);
        addShake(4);
        rats.forEach(rat => {
          if (rat.dying) return;
          const dx = rat.x - blk.x, dy = rat.y - blk.y;
          if (Math.sqrt(dx*dx + dy*dy) < 110) {
            rat.vy += popAway(5 + Math.random() * 3);
            rat.vx += (Math.random() - 0.5) * 8;
            rat.grounded = false;
          }
        });
      }
    } else {
      blk.vx += c.nx * speed * 0.4;
      blk.vy += c.ny * speed * 0.4;
      blk.angV += (Math.random() - 0.5) * 0.12;
      blk.grounded = false;
    }

    const birdBounce = birdType === 'giant' ? 0.1 : 0.25;
    bird.vx -= c.nx * speed * birdBounce;
    bird.vy -= c.ny * speed * birdBounce;
    bird.flash = 6;
  });
}

function checkBlockRatCollisions() {
  blocks.forEach(blk => {
    if (!blk.alive || blk.grounded || (curGDir === 1 ? blk.vy < 1.5 : blk.vy > -1.5)) return;
    rats.forEach(rat => {
      if (!rat.alive || rat.dying) return;
      const c = circleRect(rat.x, rat.y, rat.r, blk.x, blk.y, blk.w, blk.h);
      if (c) rat.die();
    });
  });
}

// ─── DRAW HELPERS ─────────────────────────────────────────────

function blockColor(type) {
  return type === 'bamboo' ? '#7DB84A' : type === 'wood' ? '#A0652A' : type === 'tnt' ? '#CC2010' : '#C8A030';
}

function drawBackground() {
  const group = getLevelGroup(currentLevel);

  // Soccer-kit worlds and reversed-gravity worlds: completely custom backgrounds
  if (group >= 20) { _drawSoccerBackground(group - 20); return; }
  if (group >= 15) { _drawReversedGravityBackground(group - 15); return; }
  // Isekai: completely custom background (sky + ground)
  if (group >= 10) { _drawIsekaiBackground(group - 10); return; }

  const tod = getTimeOfDay();

  // ── Sky ──
  const SKY = {
    morning: ['#F07030','#FFB870','#FFE0B0'],
    day:     ['#6EC6F0','#A8D8F0','#D0ECFF'],
    evening: ['#0D0325','#9A2A10','#FF7020'],
    night:   ['#020508','#060D1A','#0E1830'],
  }[tod];
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, SKY[0]); sky.addColorStop(0.5, SKY[1]); sky.addColorStop(1, SKY[2]);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, GROUND_Y);

  if (tod === 'night') _drawStars();
  _drawCelestialBody(tod);

  if (tod !== 'night') {
    ctx.save();
    ctx.globalAlpha = tod === 'evening' ? 0.5 : 0.88;
    drawCloud(120, 80, 0.9); drawCloud(340, 55, 1.1); drawCloud(620, 90, 0.75);
    ctx.restore();
  }

  // ── City layers ──
  if (group < 5) {
    // Kuala Lumpur
    drawPetronas(450, GROUND_Y - 10, tod);
    if (group >= 1) _drawMenaraKL(280, GROUND_Y, tod);
    drawShophouses(0, GROUND_Y, 4, tod);
  } else {
    // SE Asian cities (groups 5-9)
    _drawSEAsianLandmark(group - 5, tod);
    drawShophouses(0, GROUND_Y, 3, tod);
  }
  _drawLevelBuildings(group, tod);

  // ── Ground ──
  const GC = {
    morning: ['#9A7A38','#8A6A28','#6A4A18'],
    day:     ['#8B6B2A','#7A5C22','#5A3E18'],
    evening: ['#5A3818','#4A2810','#341808'],
    night:   ['#1E1208','#180A04','#100600'],
  }[tod];
  const grd = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  grd.addColorStop(0, GC[0]); grd.addColorStop(0.2, GC[1]); grd.addColorStop(1, GC[2]);
  ctx.fillStyle = grd;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  const GRASS = { morning:'#6AB040', day:'#5AAA30', evening:'#3A7020', night:'#1A4810' }[tod];
  ctx.fillStyle = GRASS;
  ctx.beginPath(); ctx.roundRect(0, GROUND_Y - 6, W, 14, 4); ctx.fill();

  ctx.strokeStyle = `rgba(0,0,0,${tod === 'night' ? 0.35 : 0.12})`;
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 8); ctx.lineTo(x, H); ctx.stroke();
  }

  if (tod === 'evening') {
    const fog = ctx.createLinearGradient(0, GROUND_Y - 90, 0, GROUND_Y);
    fog.addColorStop(0, 'rgba(255,60,0,0)');
    fog.addColorStop(1, 'rgba(255,80,10,0.14)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, GROUND_Y - 90, W, 90);
  }
}

function _drawStars() {
  const pts = [[50,20,1.2],[120,40,0.9],[200,15,1.1],[280,50,0.8],[360,25,1.3],
    [440,45,0.7],[520,18,1.4],[600,38,1.0],[680,22,1.2],[760,48,0.8],[840,30,1.1],
    [880,12,0.9],[30,65,0.7],[150,75,1.0],[310,60,1.2],[470,70,0.8],[630,55,1.3],
    [790,68,0.9],[100,100,0.6],[400,90,1.1],[700,95,0.7],[870,80,1.0],[60,130,0.8],
    [250,120,0.9],[560,110,1.2],[730,125,0.7]];
  ctx.fillStyle = 'white';
  pts.forEach(([sx, sy, sr]) => {
    ctx.globalAlpha = (0.5 + 0.5 * Math.sin(Date.now()*0.001*sr + sx)) * 0.9;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function _drawCelestialBody(tod) {
  ctx.save();
  if (tod === 'day') {
    ctx.shadowColor = '#FFE033'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#FFE033';
    ctx.beginPath(); ctx.arc(820, 70, 38, 0, Math.PI*2); ctx.fill();
  } else if (tod === 'morning') {
    ctx.shadowColor = '#FF9020'; ctx.shadowBlur = 45;
    ctx.fillStyle = '#FFAA30';
    ctx.beginPath(); ctx.arc(820, 165, 42, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 0.14;
    ctx.fillStyle = '#FF8800';
    ctx.beginPath(); ctx.arc(820, 165, 68, 0, Math.PI*2); ctx.fill();
  } else if (tod === 'evening') {
    ctx.shadowColor = '#FF3000'; ctx.shadowBlur = 55;
    ctx.fillStyle = '#FF4020';
    ctx.beginPath(); ctx.arc(75, 195, 46, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 0.16;
    ctx.fillStyle = '#FF6040';
    ctx.beginPath(); ctx.arc(75, 195, 80, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.shadowColor = '#D0E8FF'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#E8F4FF';
    ctx.beginPath(); ctx.arc(750, 65, 32, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0E1830'; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(763, 55, 28, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function _drawMenaraKL(cx, gy, tod) {
  const col = tod === 'night' ? 'rgba(70,85,110,0.8)' :
              tod === 'evening' ? 'rgba(150,110,90,0.7)' : 'rgba(155,170,190,0.65)';
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(cx-9,gy); ctx.lineTo(cx-5,gy-195);
  ctx.lineTo(cx-2,gy-218); ctx.lineTo(cx+2,gy-218);
  ctx.lineTo(cx+5,gy-195); ctx.lineTo(cx+9,gy);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, gy-232, 24, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(cx, gy-252); ctx.lineTo(cx, gy-315); ctx.stroke();
  if (tod === 'night' || tod === 'evening') {
    ctx.save(); ctx.shadowColor = '#FF2010'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#FF2010';
    ctx.beginPath(); ctx.arc(cx, gy-315, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

  const BASE_COLS = [
    ['#B8C8D8','#C0D0C0','#C8C0B0','#B0C0B8','#C0B8C8','#C8C8B0','#B8C0C8'],
    ['#A8C0D0','#9ABDD5','#B0C8D8','#A0B8D0','#90A8C0','#A8BCCC','#98B0C4','#A4B8CC'],
    ['#C0A8B8','#A8C0A8','#C8B8A0','#A8B0C8','#B8A8C8','#C8B8A8','#A8C0C8','#B0B8D0'],
    ['#808898','#909898','#808898','#788090','#8890A0','#7A8898','#8089A0','#7A8090'],
    ['#8090B0','#9095B0','#8892A8','#8890B0','#9098B8','#8090A8','#8898B5','#8090A8','#9098B0','#8890B0','#8898A8'],

    ['#B0C4D8','#A4B8D0','#C2D4E4','#98B4CC','#B8CAD8','#A8BCCC'],

    ['#C89068','#D8A878','#B88050','#DCAC7A','#C49468','#D0A070'],
    // Group 8 - Hanoi
    ['#DEC060','#D4B250','#E8CC70','#CCAA48','#DCC068','#D4B458'],

  ];

    ctx.fillRect(bx, GROUND_Y - bh, bw, bh);

function drawCloud(x, y, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  const puffs = [
    [0, 0, 28], [-30, 8, 22], [30, 8, 22], [-14, -10, 20], [14, -10, 20]
  ];
  puffs.forEach(([px, py, r]) => {
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

function drawPetronas(cx, gy, tod) {
  const tw = 52, th = 210, gap = 36;
  const lx = cx - gap/2 - tw, rx = cx + gap/2;
  const col = tod === 'night'   ? 'rgba(70,90,130,0.7)' :
              tod === 'evening' ? 'rgba(150,100,80,0.65)' :
              tod === 'morning' ? 'rgba(200,180,160,0.6)' : 'rgba(180,195,215,0.55)';

  [lx, rx].forEach(tx => {
    // Main shaft
    ctx.fillStyle = col;
    ctx.fillRect(tx + tw*0.12, gy - th, tw*0.76, th);
    // Side tabs every 15px
    for (let i = 0; i < 8; i++) {
      const yy = gy - th * 0.25 - i * (th*0.06);
      ctx.fillRect(tx, yy, tw*0.12, th*0.055);
      ctx.fillRect(tx + tw*0.88, yy, tw*0.12, th*0.055);
    }
    // Spire
    ctx.fillStyle = 'rgba(170,185,205,0.55)';
    ctx.beginPath();
    ctx.moveTo(tx + tw/2, gy - th - 52);
    ctx.lineTo(tx + tw*0.35, gy - th);
    ctx.lineTo(tx + tw*0.65, gy - th);
    ctx.closePath(); ctx.fill();
    // Ball (bulb before spire)
    ctx.beginPath();
    ctx.arc(tx + tw/2, gy - th - 10, tw*0.14, 0, Math.PI*2);
    ctx.fill();
  });

  // Sky bridge
  ctx.fillStyle = col;
  ctx.fillRect(lx + tw*0.85, gy - th*0.41, gap + tw*0.28, th*0.042);

  // Windows
  const wCol = tod === 'night' ? 'rgba(255,215,80,0.45)' : 'rgba(210,230,255,0.25)';
  ctx.fillStyle = wCol;
  [lx, rx].forEach(tx => {
    for (let row = 1; row < 14; row++) {
      for (let c = 0; c < 3; c++) {
        ctx.fillRect(tx + tw*0.18 + c*(tw*0.22), gy - row*(th/14.5), tw*0.14, th*0.05);
      }
    }
  });
}

function drawShophouses(startX, gy, count, tod) {
  const DAY_COLS   = ['#E8A060','#70C8A0','#E8D060','#C080C8','#60A8D8'];
  const NIGHT_COLS = ['#7A5030','#286040','#7A6828','#602858','#185068'];
  const EVE_COLS   = ['#C07840','#508060','#C0A040','#904090','#3878A0'];
  const colors = tod === 'night' ? NIGHT_COLS : tod === 'evening' ? EVE_COLS : DAY_COLS;
  const ws = [85, 70, 90, 75, 80];
  let x = startX;
  for (let i = 0; i < count; i++) {
    const w = ws[i % ws.length];
    const h = 140 + (i % 2) * 20;
    const col = colors[i % colors.length];
    ctx.fillStyle = col;
    ctx.fillRect(x, gy - h, w, h);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(x, gy - h, w, 20);
    // Windows
    const winCol = tod === 'night' ? 'rgba(255,215,80,0.7)' :
                   tod === 'evening' ? 'rgba(255,160,80,0.5)' : 'rgba(255,255,255,0.5)';
    ctx.fillStyle = winCol;
    for (let row = 0; row < 2; row++) {
      ctx.fillRect(x + 12, gy - h + 28 + row * 36, 18, 24);
      ctx.fillRect(x + w - 30, gy - h + 28 + row * 36, 18, 24);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.arc(x + w/2, gy - 22, w*0.38, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + w, gy - h); ctx.lineTo(x + w, gy); ctx.stroke();
    x += w;
  }
}

// ─── SE ASIAN LANDMARKS ───────────────────────────────────────

function _drawSEAsianLandmark(cityIdx, tod) {
  const silhouette = tod === 'night'   ? 'rgba(55,70,110,0.80)' :
                     tod === 'evening' ? 'rgba(130,90,70,0.68)' :
                     tod === 'morning' ? 'rgba(195,175,155,0.62)' : 'rgba(165,180,205,0.58)';
  [_drawWatArun, _drawMarinaBS, _drawMonas, _drawTurtleTower, _drawRizalMon][cityIdx](450, GROUND_Y, silhouette, tod);
}

function _drawWatArun(cx, gy, col, tod) {
  // Central prang (main spire)
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(cx - 22, gy);
  ctx.lineTo(cx - 14, gy - 130);
  ctx.lineTo(cx - 8,  gy - 190);
  ctx.lineTo(cx,      gy - 245);
  ctx.lineTo(cx + 8,  gy - 190);
  ctx.lineTo(cx + 14, gy - 130);
  ctx.lineTo(cx + 22, gy);
  ctx.closePath(); ctx.fill();
  // Stepped tiers on main prang
  for (let i = 0; i < 5; i++) {
    const ty = gy - 80 - i * 30;
    const tw = 20 - i * 3;
    ctx.fillRect(cx - tw, ty, tw * 2, 8);
  }
  // Left minor prang
  ctx.beginPath();
  ctx.moveTo(cx - 68, gy); ctx.lineTo(cx - 62, gy - 85);
  ctx.lineTo(cx - 57, gy - 115); ctx.lineTo(cx - 52, gy - 85); ctx.lineTo(cx - 46, gy);
  ctx.closePath(); ctx.fill();
  // Right minor prang
  ctx.beginPath();
  ctx.moveTo(cx + 46, gy); ctx.lineTo(cx + 52, gy - 85);
  ctx.lineTo(cx + 57, gy - 115); ctx.lineTo(cx + 62, gy - 85); ctx.lineTo(cx + 68, gy);
  ctx.closePath(); ctx.fill();
  // Far left/right small prangs
  [[cx - 110, 65], [cx + 110, 65]].forEach(([px, ph]) => {
    ctx.beginPath();
    ctx.moveTo(px - 10, gy); ctx.lineTo(px - 7, gy - ph * 0.6);
    ctx.lineTo(px, gy - ph); ctx.lineTo(px + 7, gy - ph * 0.6); ctx.lineTo(px + 10, gy);
    ctx.closePath(); ctx.fill();
  });
  // Horizontal terrace
  ctx.fillRect(cx - 90, gy - 28, 180, 10);
  ctx.fillRect(cx - 70, gy - 18, 140, 8);
  // Night glow
  if (tod === 'night' || tod === 'evening') {
    ctx.save(); ctx.shadowColor = '#FFCC44'; ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(255,200,60,0.35)';
    ctx.beginPath(); ctx.arc(cx, gy - 245, 10, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function _drawMarinaBS(cx, gy, col, tod) {
  // Three curved towers
  const positions = [cx - 52, cx, cx + 52];
  positions.forEach(tx => {
    ctx.fillStyle = col;
    // Tower base widens slightly downward
    ctx.beginPath();
    ctx.moveTo(tx - 11, gy);
    ctx.bezierCurveTo(tx - 13, gy - 80, tx - 10, gy - 140, tx - 8, gy - 200);
    ctx.lineTo(tx + 8, gy - 200);
    ctx.bezierCurveTo(tx + 10, gy - 140, tx + 13, gy - 80, tx + 11, gy);
    ctx.closePath(); ctx.fill();
    // Windows
    const wCol = tod === 'night' ? 'rgba(255,210,80,0.4)' : 'rgba(200,230,255,0.2)';
    ctx.fillStyle = wCol;
    for (let row = 1; row < 14; row++) {
      ctx.fillRect(tx - 5, gy - row * 14 - 4, 10, 8);
    }
  });
  // Rooftop "boat" platform
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(cx - 85, gy - 200);
  ctx.lineTo(cx - 82, gy - 218);
  ctx.lineTo(cx + 82, gy - 218);
  ctx.lineTo(cx + 85, gy - 200);
  ctx.closePath(); ctx.fill();
  // Infinity pool curve on roof
  ctx.beginPath();
  ctx.ellipse(cx, gy - 212, 78, 12, 0, Math.PI, 0);
  ctx.fill();
  if (tod === 'night' || tod === 'evening') {
    ctx.save(); ctx.shadowColor = '#60CCFF'; ctx.shadowBlur = 24;
    ctx.fillStyle = 'rgba(80,190,255,0.22)';
    ctx.fillRect(cx - 80, gy - 220, 160, 5);
    ctx.restore();
  }
}

function _drawMonas(cx, gy, col, tod) {
  // Stepped base
  ctx.fillStyle = col;
  ctx.fillRect(cx - 40, gy - 20, 80, 20);
  ctx.fillRect(cx - 28, gy - 35, 56, 16);
  // Obelisk shaft
  ctx.beginPath();
  ctx.moveTo(cx - 12, gy - 35);
  ctx.lineTo(cx - 8,  gy - 170);
  ctx.lineTo(cx - 3,  gy - 220);
  ctx.lineTo(cx + 3,  gy - 220);
  ctx.lineTo(cx + 8,  gy - 170);
  ctx.lineTo(cx + 12, gy - 35);
  ctx.closePath(); ctx.fill();
  // Gold flame top
  ctx.fillStyle = tod === 'night' ? 'rgba(255,195,40,0.9)' : col;
  ctx.beginPath();
  ctx.moveTo(cx - 6,  gy - 220);
  ctx.bezierCurveTo(cx - 14, gy - 240, cx - 8, gy - 260, cx, gy - 280);
  ctx.bezierCurveTo(cx + 8,  gy - 260, cx + 14, gy - 240, cx + 6, gy - 220);
  ctx.closePath(); ctx.fill();
  if (tod === 'night' || tod === 'evening') {
    ctx.save(); ctx.shadowColor = '#FFD020'; ctx.shadowBlur = 30;
    ctx.fillStyle = 'rgba(255,210,30,0.5)';
    ctx.beginPath(); ctx.arc(cx, gy - 255, 14, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function _drawTurtleTower(cx, gy, col, tod) {
  // Rocky island base
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(cx, gy - 8, 48, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(cx - 20, gy - 22, 40, 16);
  // Tower walls
  ctx.fillRect(cx - 18, gy - 75, 36, 54);
  // Arched windows suggestion
  ctx.fillRect(cx - 14, gy - 72, 10, 18);
  ctx.fillRect(cx + 4,  gy - 72, 10, 18);
  // Tier 2
  ctx.fillRect(cx - 13, gy - 105, 26, 32);
  // Tier 3 / turret
  ctx.fillRect(cx - 9,  gy - 130, 18, 27);
  // Battlements
  [-8, -2, 4, 10].forEach(bx => {
    if (bx === -2) return;
    ctx.fillRect(cx + bx, gy - 138, 4, 10);
  });
  // Small spire
  ctx.beginPath();
  ctx.moveTo(cx - 4, gy - 138); ctx.lineTo(cx, gy - 160); ctx.lineTo(cx + 4, gy - 138);
  ctx.closePath(); ctx.fill();
}

function _drawRizalMon(cx, gy, col, tod) {
  // Pedestal
  ctx.fillStyle = col;
  ctx.fillRect(cx - 28, gy - 18, 56, 18);
  ctx.fillRect(cx - 22, gy - 30, 44, 14);
  ctx.fillRect(cx - 16, gy - 40, 32, 12);
  // Tall column
  ctx.fillRect(cx - 7, gy - 195, 14, 156);
  // Capital detail
  ctx.fillRect(cx - 10, gy - 197, 20, 5);
  // Statue figure (stylized)
  ctx.beginPath();
  ctx.arc(cx, gy - 210, 7, 0, Math.PI * 2); ctx.fill(); // head
  ctx.fillRect(cx - 5, gy - 225, 10, 16); // body
  // Flag pole
  ctx.fillRect(cx + 3, gy - 225, 2, 30);
  ctx.fillStyle = tod === 'night' ? 'rgba(255,100,80,0.6)' : col;
  ctx.fillRect(cx + 5, gy - 252, 22, 14); // flag
}

function _drawIsekaiDarkCastle() {
  const t = Date.now();
  // Sky gradient: deep purple to black
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, '#080010'); sky.addColorStop(0.6, '#1A0030'); sky.addColorStop(1, '#2E0050');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, GROUND_Y);
  // Stars (purple-tinted)
  const starData = [[50,30,0.8],[130,20,1.1],[220,45,0.7],[300,15,1.2],[420,35,0.9],
    [500,18,1.0],[600,40,0.8],[700,25,1.1],[800,32,0.9],[860,12,1.3],[180,80,0.7],[450,70,0.9],[650,65,0.8]];
  starData.forEach(([sx, sy, sr]) => {
    ctx.globalAlpha = (0.4 + 0.5 * Math.sin(t * 0.001 * sr + sx)) * 0.85;
    ctx.fillStyle = Math.sin(sx + t*0.0005) > 0 ? '#CC88FF' : '#FF88CC';
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // Blood moon
  ctx.save(); ctx.shadowColor = '#CC2040'; ctx.shadowBlur = 40;
  ctx.fillStyle = '#AA1020';
  ctx.beginPath(); ctx.arc(750, 75, 40, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1A0030';
  ctx.beginPath(); ctx.arc(762, 64, 35, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // Bats (simple triangles)
  [[200,120],[350,90],[550,140],[720,100]].forEach(([bx, by], i) => {
    const flap = Math.sin(t * 0.004 + i * 1.5);
    ctx.fillStyle = 'rgba(10,0,20,0.9)';
    ctx.beginPath();
    ctx.moveTo(bx, by); ctx.lineTo(bx - 16 - flap * 4, by - 8); ctx.lineTo(bx - 8, by + 4);
    ctx.moveTo(bx, by); ctx.lineTo(bx + 16 + flap * 4, by - 8); ctx.lineTo(bx + 8, by + 4);
    ctx.fill();
  });
  // Dark castle silhouette in background
  ctx.fillStyle = 'rgba(18,2,35,0.85)';
  // Main castle keep
  ctx.fillRect(350, GROUND_Y - 190, 200, 190);
  // Battlements
  for (let i = 0; i < 8; i++) ctx.fillRect(354 + i * 25, GROUND_Y - 205, 12, 16);
  // Side towers
  [[330, 160], [540, 145], [300, 120], [570, 110]].forEach(([tx, th]) => {
    ctx.fillRect(tx, GROUND_Y - th, 32, th);
    for (let i = 0; i < 3; i++) ctx.fillRect(tx + 3 + i * 9, GROUND_Y - th - 12, 6, 12);
    // Tower spire
    ctx.beginPath();
    ctx.moveTo(tx, GROUND_Y - th); ctx.lineTo(tx + 16, GROUND_Y - th - 28); ctx.lineTo(tx + 32, GROUND_Y - th);
    ctx.closePath(); ctx.fill();
  });
  // Ground: dark stone
  const grd = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  grd.addColorStop(0, '#140822'); grd.addColorStop(0.3, '#0E0418'); grd.addColorStop(1, '#080210');
  ctx.fillStyle = grd; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#2A1040';
  ctx.beginPath(); ctx.roundRect(0, GROUND_Y - 6, W, 14, 4); ctx.fill();
  // Cracks with purple glow
  ctx.save(); ctx.strokeStyle = 'rgba(150,50,255,0.25)'; ctx.lineWidth = 1;
  for (let x = 40; x < W; x += 80) {
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 5); ctx.lineTo(x + 15, GROUND_Y + 30); ctx.stroke();
  }
  ctx.restore();
}

function _drawIsekaiLava() {

  [[100,80,1.2],[300,50,0.9],[600,70,1.1],[800,45,1.0]].forEach(([cx, cy, s]) => {
    ctx.fillStyle = '#111';
    const puffs = [[0,0,28],[-22,6,20],[22,6,20],[-10,-8,16],[10,-8,16]];
    puffs.forEach(([px, py, r]) => {
      ctx.beginPath(); ctx.arc(cx + px * s, cy + py * s, r * s, 0, Math.PI * 2); ctx.fill();
    });

  // Volcano silhouettes
  [[180, 200], [680, 240]].forEach(([vx, vh]) => {

    ctx.beginPath(); ctx.arc(vx, GROUND_Y - vh, 20, 0, Math.PI * 2); ctx.fill();

    ctx.beginPath(); ctx.arc(vx - 10, GROUND_Y - vh + 20 + dripY, 5, 0, Math.PI * 2); ctx.fill();
