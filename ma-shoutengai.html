<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f59e2b">
<title>商店街M&amp;A おみせつなぎ屋さん</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🏪%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #fff4dc;
  --paper: #ffffff;
  --ink: #3a2414;
  --dim: #8a6a4e;
  --line: #ecd9b8;
  --orange: #f59e2b;
  --orange-dark: #c46a0c;
  --green: #22a565;
  --green-bg: #e3f7ec;
  --red: #e0453a;
  --red-bg: #fde6e3;
  --blue: #2f6fe0;
  --blue-bg: #e5eeff;
  --purple: #7a4fd6;
  --purple-bg: #efe8ff;
}
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100dvh;
  background:
    radial-gradient(circle at 20% 0%, #ffe3a8 0, transparent 40%),
    repeating-linear-gradient(90deg, #fff4dc 0 40px, #fff0d2 40px 80px);
  background-color: var(--bg);
  color: var(--ink);
  font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  font-weight: 500;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
b, strong, h1, h2, h3, button { font-weight: 800; }
#app { max-width: 720px; margin: 0 auto; padding: 12px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }

/* ─── top bar ─── */
.topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.brand { font-weight: 900; font-size: 15px; color: var(--orange-dark); }
.sp { flex: 1; }
.pill { background: var(--paper); border: 2px solid var(--line); border-radius: 99px; padding: 2px 10px; font-size: 13px; font-weight: 800; white-space: nowrap; }
.phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 14px; }
.phases div { text-align: center; font-size: 11px; font-weight: 800; padding: 5px 2px; border-radius: 8px; background: #f3e4c6; color: #a88b6c; line-height: 1.3; }
.phases div.on { background: var(--orange); color: #fff; }
.phases div.done { background: #ffd79a; color: var(--orange-dark); }

/* ─── cards / text ─── */
.card { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: 0 3px 0 var(--line); }
h1 { font-size: clamp(26px, 7vw, 40px); line-height: 1.2; color: var(--orange-dark); text-align: center; }
h2 { font-size: 20px; line-height: 1.35; margin-bottom: 8px; }
h2 .no { display: inline-block; background: var(--orange); color: #fff; border-radius: 8px; padding: 0 8px; margin-right: 6px; font-size: 15px; vertical-align: 2px; }
h3 { font-size: 16px; margin: 10px 0 6px; }
p + p { margin-top: 6px; }
.dim { color: var(--dim); font-size: 13px; }
.center { text-align: center; }
.big { font-size: 22px; font-weight: 900; }
.plus { color: var(--green); font-weight: 800; }
.minus { color: var(--red); font-weight: 800; }

.talk { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
.talk .face { flex: 0 0 52px; height: 52px; border-radius: 50%; background: #ffe2b0; display: grid; place-items: center; font-size: 30px; border: 2px solid var(--orange); }
.talk .bubble { position: relative; background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; flex: 1; }
.talk .bubble .who { font-size: 12px; color: var(--dim); font-weight: 800; display: block; }
.talk.seller .face { background: #e7f0ff; border-color: var(--blue); }

.word { background: var(--purple-bg); border: 2px dashed var(--purple); border-radius: 14px; padding: 10px 12px; margin: 12px 0; font-size: 14px; }
.word::before { content: '🎓 おとなの言葉では…'; display: block; color: var(--purple); font-weight: 900; font-size: 13px; margin-bottom: 2px; }
.word b { color: var(--purple); }

/* ─── buttons ─── */
button { font-family: inherit; cursor: pointer; border: none; }
.btn { display: block; width: 100%; padding: 14px; border-radius: 14px; font-size: 18px; color: #fff; background: var(--orange); box-shadow: 0 4px 0 var(--orange-dark); margin-top: 10px; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--orange-dark); }
.btn:disabled { background: #d9c8ad; box-shadow: 0 4px 0 #b9a688; cursor: not-allowed; transform: none; }
.btn.sub { background: var(--paper); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); font-size: 15px; padding: 10px; }
.btn.blue { background: var(--blue); box-shadow: 0 4px 0 #1b47a0; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }

/* ─── choice tiles ─── */
.choices { display: grid; gap: 10px; }
.choice { text-align: left; background: var(--paper); border: 3px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: 15px; color: var(--ink); display: flex; gap: 10px; align-items: center; font-weight: 500; }
.choice .ic { font-size: 30px; flex: 0 0 auto; }
.choice b { display: block; font-size: 16px; }
.choice.on { border-color: var(--orange); background: #fff3df; box-shadow: 0 0 0 3px #ffd79a; }
.choice:disabled { opacity: .45; cursor: not-allowed; }

/* ─── shop list ─── */
.shops { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.shop { position: relative; text-align: left; background: var(--paper); border: 3px solid var(--line); border-radius: 16px; padding: 10px 12px; color: var(--ink); font-size: 13px; font-weight: 500; }
.shop .head { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.shop .head .ic { font-size: 34px; }
.shop .head b { font-size: 16px; line-height: 1.3; display: block; }
.shop .head small { color: var(--dim); font-size: 12px; }
.shop dl { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; }
.shop dt { color: var(--dim); }
.shop dd { font-weight: 800; }
.shop .checks { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.chk { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 99px; }
.chk.ok { background: var(--green-bg); color: var(--green); }
.chk.ng { background: var(--red-bg); color: var(--red); }
.shop.on { border-color: var(--orange); background: #fff3df; box-shadow: 0 0 0 3px #ffd79a; }
.shop.on::after { content: '本命 ✔'; position: absolute; top: 8px; right: 10px; background: var(--orange); color: #fff; font-size: 12px; font-weight: 900; padding: 1px 8px; border-radius: 99px; }
.shop.out { opacity: .45; }
.shop.out::after { content: 'ことわられた'; position: absolute; top: 8px; right: 10px; background: #999; color: #fff; font-size: 12px; font-weight: 900; padding: 1px 8px; border-radius: 99px; }
.stars { color: #f5b301; letter-spacing: -1px; }

/* ─── NDA / contract paper ─── */
.paper { background: #fffdf6; border: 2px solid #d8c39a; border-radius: 6px; padding: 16px; font-size: 14px; box-shadow: 4px 4px 0 #ecd9b8; position: relative; }
.paper h3 { text-align: center; margin-top: 0; font-size: 18px; letter-spacing: .1em; }
.paper ol { padding-left: 1.4em; }
.paper li + li { margin-top: 4px; }
.hanko { position: absolute; right: 18px; bottom: 14px; width: 64px; height: 64px; border: 3px solid var(--red); border-radius: 50%; color: var(--red);
  display: grid; place-items: center; font-weight: 900; font-size: 13px; line-height: 1.1; text-align: center; transform: rotate(-12deg) scale(1); opacity: .9; animation: stamp .35s ease-out; }
@keyframes stamp { from { transform: rotate(-12deg) scale(2.2); opacity: 0; } }

/* ─── valuation ─── */
.calc { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 15px; background: #fffaf0; border-radius: 12px; padding: 10px 12px; border: 2px solid var(--line); }
.calc .r { text-align: right; font-weight: 800; }
.calc .tot { border-top: 2px dashed var(--line); padding-top: 4px; font-size: 17px; }
.slider { width: 100%; margin: 12px 0 4px; accent-color: var(--orange); height: 34px; }
.offer { text-align: center; font-size: 34px; font-weight: 900; color: var(--orange-dark); }
.gauge { position: relative; height: 18px; border-radius: 99px; background: linear-gradient(90deg, #cfe6ff, #e3f7ec 40%, #fff1c4 70%, #fde6e3); margin: 4px 0 2px; }
.gauge i { position: absolute; top: -4px; width: 4px; height: 26px; border-radius: 2px; background: var(--ink); }
.gauge i.est { background: var(--green); }
.gauge i.ask { background: var(--red); }
.gauge-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }

/* ─── DD cards ─── */
.dd { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.ddc { min-height: 120px; border-radius: 14px; padding: 10px; text-align: left; font-size: 13px; color: var(--ink); font-weight: 500; border: 3px solid var(--line); background: var(--paper); }
.ddc.closed { background: repeating-linear-gradient(45deg, #ffe7bd 0 10px, #ffdca0 10px 20px); border-color: #f0c070; display: grid; place-items: center; text-align: center; }
.ddc.closed .cat { font-size: 30px; display: block; }
.ddc.closed b { font-size: 15px; }
.ddc.good { border-color: var(--green); background: var(--green-bg); }
.ddc.bad { border-color: var(--red); background: var(--red-bg); }
.ddc.flip { animation: flip .4s ease-out; }
@keyframes flip { from { transform: rotateY(90deg); } }
.ddc .tag { font-size: 12px; font-weight: 900; }
.ddc .ttl { display: block; font-size: 15px; font-weight: 800; margin: 2px 0; line-height: 1.35; }
.ddc .val { display: block; margin-top: 4px; font-weight: 900; }
.ddc:disabled { cursor: not-allowed; opacity: .6; }

/* ─── negotiation ─── */
.issue { border: 2px solid var(--red); background: var(--red-bg); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
.issue .ttl { font-weight: 800; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.opt { background: var(--paper); border: 2px solid var(--line); border-radius: 10px; padding: 6px 4px; font-size: 12px; line-height: 1.35; color: var(--ink); }
.opt span { display: block; font-size: 20px; }
.opt.on { border-color: var(--orange); background: #fff3df; box-shadow: 0 0 0 2px #ffd79a; }
.opt:disabled { opacity: .4; cursor: not-allowed; }
.hearts { font-size: 22px; letter-spacing: 2px; }
.meter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ─── closing ─── */
.swap { display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 56px; margin: 18px 0; }
.swap .go { animation: goR 1.4s ease-in-out infinite alternate; }
.swap .back { animation: goL 1.4s ease-in-out infinite alternate; }
@keyframes goR { to { transform: translateX(24px); } }
@keyframes goL { to { transform: translateX(-24px); } }

/* ─── result ─── */
.resstars { font-size: 52px; text-align: center; letter-spacing: 4px; color: #f5b301; text-shadow: 0 3px 0 #c98a00; }
table.bk { width: 100%; border-collapse: collapse; font-size: 14px; }
table.bk td { padding: 6px 4px; border-bottom: 1px dashed var(--line); }
table.bk td:last-child { text-align: right; font-weight: 800; white-space: nowrap; }
table.bk tr.tot td { border-top: 3px double var(--ink); border-bottom: none; font-size: 17px; }
.gloss { display: grid; gap: 6px; font-size: 14px; }
.gloss div { display: grid; grid-template-columns: 9.5em 1fr; gap: 8px; padding: 6px 8px; border-radius: 10px; background: #fffaf0; }
.gloss div b { color: var(--purple); }
@media (max-width: 420px) { .gloss div { grid-template-columns: 1fr; gap: 0; } }

/* English labels for the CSS-drawn badges */
html[lang=en] .word::before { content: '🎓 In grown-up words…'; }
html[lang=en] .shop.on::after { content: 'Top pick ✔'; }
html[lang=en] .shop.out::after { content: 'Said no'; }
.langbtn { color: var(--ink); }

.fade { animation: fade .3s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';
/* 商店街M&A — Buy Side (買い手) mode.
 * The player is an "おみせつなぎ屋さん" (an M&A advisor) helping a bakery buy
 * another shop. Each screen is one step of real buy-side M&A, retold for
 * 6th graders, and ends with the grown-up word for what they just did.
 * Japanese and English: L('日本語', 'English'); ?lang=en opens in English.
 * Money is kept in 万円 and shown as dollars (×100) in English. */

const BUDGET = 600;          // the bakery's budget
const FREE_DD = 3;           // free investigation points
const EXTRA_DD_COST = 20;    // each extra investigation
const MAX_EXTRA_DD = 3;
const PATIENCE = 3;          // how many asks the seller will listen to
const PMI_POINTS = 3;
const YEARS = 5;

// ─── language ───
const LANG_KEY = 'ma-shoutengai-lang';
let lang = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'ja' || q === 'en') return q;
  try { const v = localStorage.getItem(LANG_KEY); if (v === 'ja' || v === 'en') return v; } catch (e) {}
  return /^ja/i.test(navigator.language || '') ? 'ja' : 'en';
})();
const L = (ja, en) => lang === 'en' ? en : ja;
const tx = (o, k) => lang === 'en' && o.en && o.en[k] !== undefined ? o.en[k] : o[k];
function setLang(v) {
  lang = v;
  try { localStorage.setItem(LANG_KEY, v); } catch (e) {}
  const u = new URL(location.href);
  u.searchParams.set('lang', v);
  history.replaceState(null, '', u);
  render();
}

const GOALS = {
  product: { ic: '🥪', name: 'あたらしい商品を売りたい', desc: 'パンだけでなく、サンドイッチやおべんとうも売りたい',
    en: { name: 'Sell new kinds of food', desc: 'Not just bread — sandwiches and lunch boxes too' } },
  station: { ic: '🚉', name: '駅前にお店を出したい', desc: '人がたくさん通る駅前で、もっと多くの人に食べてほしい',
    en: { name: 'Open a shop by the station', desc: 'Lots of people walk past the station every day' } },
  factory: { ic: '🏭', name: 'たくさん作れるようにしたい', desc: 'パンを作る力を大きくして、スーパーにもならべたい',
    en: { name: 'Bake much more bread', desc: 'Make enough bread to sell in supermarkets too' } },
};

const CRITERIA = {
  budget:  { name: '予算（600万円）で買えそう', short: '予算で買えそう', test: s => s.ask <= BUDGET,
    en: { name: 'Fits the budget ($60,000)', short: 'Fits budget' } },
  profit:  { name: 'しっかりもうかっている（1年50万円以上）', short: 'しっかりもうかっている', test: s => s.profit >= 50,
    en: { name: 'Makes good profit ($5,000+ a year)', short: 'Good profit' } },
  fit:     { name: '目的にピッタリ', short: '目的にピッタリ', test: s => s.fit[S.goal] >= 2,
    en: { name: 'Matches our goal', short: 'Matches goal' } },
  popular: { name: 'お客さんに人気（★4つ以上）', short: 'お客さんに人気', test: s => s.pop >= 4,
    en: { name: 'Popular with customers (4★ or more)', short: 'Popular' } },
};

const CATS = {
  money: { ic: '💰', name: 'お金', en: { name: 'Money' } },
  rules: { ic: '📜', name: '約束ごと', en: { name: 'Contracts' } },
  tax:   { ic: '🧾', name: '税金', en: { name: 'Taxes' } },
  biz:   { ic: '🛒', name: '商売', en: { name: 'Business' } },
  people:{ ic: '👩‍🍳', name: '人', en: { name: 'People' } },
  tools: { ic: '🔧', name: '道具・建物', en: { name: 'Equipment' } },
};

// Each shop: public flyer info, a hidden lowest price the seller accepts,
// how well it fits each goal (0–3), and six face-down investigation cards.
// Card: [category, title, detail, value change, risk tag]; en.dd holds [title, detail].
const OK_TAX = ['税金はきちんと払っている', '問題なし。安心！'];
const OK_TAX_EN = ['Taxes are all paid', 'No problems here. Phew!'];
const SHOPS = [
  { id: 'sand', ic: '🥪', name: 'サンドイッチのハムハム亭', place: '商店街', owner: '🐹', ownerName: 'ハムじいさん',
    profit: 70, assets: 40, ask: 380, min: 300, pop: 4, staff: 3,
    reason: '店長が年をとったので、引退したい', fit: { product: 3, station: 1, factory: 0 },
    note: 'たまごサンドが名物。店員さんは3人。お店の建物は借りている。',
    dd: [
      ['money', 'レジの記録がばらばら', '毎日の売上の記録がところどころぬけていて、本当のもうけは少し少ないかも。', -30],
      ['rules', '建物を借りる約束があと1年で終わる', '大家さんが「その後は家賃を上げたい」と言っている。', -60],
      ['tax', ...OK_TAX, 0],
      ['biz', '高校生が毎朝買いに来る', '近くの高校の生徒に大人気。これからも売れそう。', 40],
      ['people', 'ひみつのレシピは店長しか知らない', 'たまごサンドの味を出せるのはハムじいさんだけ…。', -50, 'recipe'],
      ['tools', '冷蔵庫がこわれかけ', 'そろそろ買いかえが必要。', -20],
    ],
    en: { name: 'Hamham Sandwich House', place: 'Shopping street', ownerName: 'Grandpa Hammy',
      reason: 'The owner is getting old and wants to retire',
      note: 'Famous for its egg sandwich. 3 staff. The building is rented.',
      dd: [
        ['The cash register records are a mess', 'Some days of sales are missing, so the real profit may be a little lower.'],
        ['The building lease ends in 1 year', 'The landlord says he wants to raise the rent after that.'],
        OK_TAX_EN,
        ['High school students come every morning', 'Very popular with the school nearby. Sales should keep going.'],
        ['Only the owner knows the secret recipe', 'Only Grandpa Hammy can make the egg sandwich taste right…'],
        ['The fridge is about to break', 'It needs replacing soon.'],
      ] } },
  { id: 'bento', ic: '🍱', name: 'まんぷく弁当', place: '商店街', owner: '🐷', ownerName: 'ブタやまさん',
    profit: 90, assets: 60, ask: 520, min: 400, pop: 3, staff: 5,
    reason: '大きなお店の仲間になって、配達をふやしたい', fit: { product: 2, station: 0, factory: 1 },
    note: '近くの会社にもおべんとうを届けている。店員さんは5人。',
    dd: [
      ['money', '銀行からの借金が100万円ある', 'お店を買うと、この借金も引きつぐことになる！', -100],
      ['rules', '会社に毎日おべんとうを届ける約束', '近くの会社と、3年間毎日届ける約束がある。', 60],
      ['tax', '去年の税金を少し払いわすれている', 'あとで払わないといけない。', -30],
      ['biz', 'となりにライバル店ができる', '来月、となりに大きなおべんとう屋さんがオープンする。', -40],
      ['people', '店員さんはみんなベテラン', '仕事が早くて、教えるのも上手。', 20],
      ['tools', '大きなかまどは新品', '去年買いかえたばかり。', 10],
    ],
    en: { name: 'Manpuku Lunch Box', place: 'Shopping street', ownerName: 'Mr. Piggy',
      reason: 'Wants to join a bigger shop and deliver more',
      note: 'Delivers lunch boxes to offices nearby. 5 staff.',
      dd: [
        ['The shop owes the bank $10,000', 'If you buy the shop, you take over this debt too!'],
        ['A deal to deliver lunch to an office every day', 'An office nearby will order every day for 3 years.'],
        ['Some of last year\'s tax was not paid', 'It still has to be paid later.'],
        ['A rival shop is opening next door', 'A big lunch box shop opens next month.'],
        ['The staff are all experts', 'They work fast and are good at teaching.'],
        ['The big oven is brand new', 'It was replaced last year.'],
      ] } },
  { id: 'coffee', ic: '☕', name: 'えきまえ珈琲', place: '駅前', owner: '🦉', ownerName: 'フクロウさん',
    profit: 50, assets: 30, ask: 280, min: 210, pop: 4, staff: 2,
    reason: '店長が遠くの町に引っこす', fit: { product: 1, station: 3, factory: 0 },
    note: '駅の目の前の小さなコーヒースタンド。アルバイトさんが2人。',
    dd: [
      ['money', 'お客さんの数はチラシ通り', '数字にうそはなかった。', 0],
      ['rules', 'コーヒーマシンは借りもの', '返すときに、お金がかかる約束になっている。', -20],
      ['tax', ...OK_TAX, 0],
      ['biz', '駅の工事で入口がふさがる', '来年、半年間ほど駅の工事があって、お客さんがへりそう。', -40],
      ['people', 'アルバイトさんが2人とも辞めるかも', '「店長がいなくなるなら…」と迷っている。', -30, 'staff'],
      ['tools', '朝はいつも行列', '場所がとてもよくて、朝は行列ができる。', 50],
    ],
    en: { name: 'Station Coffee', place: 'By the station', ownerName: 'Mr. Owl',
      reason: 'The owner is moving to a faraway town',
      note: 'A small coffee stand right outside the station. 2 part-timers.',
      dd: [
        ['Customer numbers match the flyer', 'The numbers were honest.'],

// ─── scoring: what the bakery gained over YEARS years ───
function score() {
  const s = T(), fit = s.fit[S.goal], has = k => S.pmi.includes(k);
  const tips = [];
  let morale = 3;
  if (has('talk')) morale += 2;
  if (has('teach')) morale += 1;
  if (has('sign') && s.pop >= 4) morale -= 1;

  // hidden things: good ones always count; bad ones count unless handled
  let hiddenSum = 0, handledStaff = true;
  const hidden = [];
  s.dd.forEach((_, i) => {
    const c = card(s, i), v = c[3], opened = S.opened.includes(i), how = S.nego[i];
    if (!opened && v < 0) hidden.push(c);
    if (v >= 0) { hiddenSum += v; return; }
    if (how === 'price' || how === 'contract') return;
    let hit = v;
    if (c[4] === 'recipe' && has('teach')) { hit = 0; tips.push(L('前の店長にレシピを教えてもらったので、名物の味を守れました。', 'The old owner taught you the recipe, so the famous taste was saved.')); }
    if (c[4] === 'staff') { handledStaff = false; if (has('talk')) { hit = Math.round(v / 2); tips.push(L('店員さんとじっくり話したので、辞める人を少なくできました。', 'You talked with the staff, so fewer people quit.')); } }
    hiddenSum += hit;
  });
  if (!handledStaff && !has('talk')) morale -= 1;

  const moraleMult = morale <= 1 ? 0.7 : 1;
  const base = Math.round(s.profit * YEARS * moraleMult);
  const mult = (has('menu') ? 0.5 : 0) + (has('plan') ? 0.5 : 0) + (morale >= 4 && (has('menu') || has('plan')) ? 0.2 : 0);
  const synergy = Math.round(fit * 15 * mult * YEARS);
  const saving = has('buy') ? 10 * YEARS : 0;
  const signV = has('sign') ? (s.pop >= 4 ? -50 : 25) : 0;
  const name = tx(s, 'name');

  const rows = [
    [L(`${name}の${YEARS}年分のもうけ`, `${YEARS} years of profit from ${name}`)
      + (moraleMult < 1 ? L('（店員さんが元気をなくして3割へった）', ' (down 30% — the staff lost heart)') : ''), base],
    [L('合体ボーナス（シナジー）', 'Combo bonus (synergy)'), synergy],
  ];
  if (saving) rows.push([L('仕入れをまとめて安くなった分', 'Savings from buying together'), saving]);
  if (signV) rows.push([signV > 0 ? L('看板をそろえて知ってもらえた', 'The new signs made the shop better known') : L('看板を変えたら常連さんがへった', 'Regulars left after the signs changed'), signV]);
  rows.push([L('かくれていたこと（いいこと・こまったこと）', 'Hidden things (good and bad)'), hiddenSum]);
  rows.push([L('払った値段', 'Price paid'), -S.price]);
  if (ddCost()) rows.push([S.sunk ? L('追加の調査代（やめたお店の分もふくむ）', 'Extra checks (including shops you walked away from)') : L('追加の調査代', 'Extra checks'), -ddCost()]);
  const net = rows.reduce((a, r) => a + r[1], 0);

  // advice
  if (fit === 0) tips.push(L(`${name}は、くまさんの目的「${GOALS[S.goal].name}」とあまり関係がなかったので、合体ボーナスが出ませんでした。<b>目的に合うお店をえらぶ</b>ことが大切です。`,
    `${name} had little to do with Mr. Kuma's goal ("${GOALS[S.goal].en.name}"), so there was no combo bonus. <b>Choosing a shop that fits the goal</b> matters.`));
  else if (!has('menu') && !has('plan')) tips.push(L('合体ボーナスは自動では出ません。<b>商品の合体</b>や<b>100日プラン</b>など、買ったあとの作戦が大事です。',
    'The combo bonus doesn\'t happen by itself. Plans after buying, like <b>combining products</b> or a <b>100-day plan</b>, are what make it happen.'));
  else if (synergy > 0) tips.push(L(`目的に合ったお店を買って合体作戦もしたので、合体ボーナスが ${money(synergy)} 出ました！`,
    `You bought a shop that fit the goal and planned the combining well, so you got a ${money(synergy)} combo bonus!`));
  if (S.offer > estimate(s)) tips.push(L(`手紙の値段（${money(S.offer)}）が目安（${money(estimate(s))}）より高かったので、元を取るのが大変でした。`,
    `Your letter price (${money(S.offer)}) was higher than the estimate (${money(estimate(s))}), so it was hard to earn it back.`));
  if (hidden.length) tips.push(L('調べなかったところに、こまったことがかくれていました。<b>どこを調べるか</b>がDDのポイントです。',
    'Problems were hiding where you didn\'t check. <b>Choosing what to check</b> is the key to DD.'));
  if (morale <= 1) tips.push(L('店員さんが不安なまま合体したので、元気をなくしてしまいました。<b>人の気持ち</b>もM&amp;Aではとても大切です。',
    'The staff were still worried when the shops combined, so they lost heart. <b>People\'s feelings</b> matter a lot in M&amp;A.'));
  if (has('sign') && s.pop >= 4) tips.push(L('人気のお店の名前を変えたら、なじみのお客さんがはなれてしまいました。<b>変えないほうがいいもの</b>もあります。',
    'Changing a popular shop\'s name drove away its regulars. <b>Some things are better left as they are.</b>'));

  const comment = net >= 200 ? L('お店がぐんと大きくなりました！あなたに相談してよかった！', 'My bakery grew so much! I\'m glad I asked you!')
    : net >= 100 ? L('お店を買ってよかった！これからもがんばります。', 'Buying the shop was a good idea! I\'ll keep working hard.')
    : net >= 0 ? L('なんとか元は取れたけど、もう少しうまくできたかも…。', 'We earned the money back, but maybe we could have done better…')
    : L('うーん、払ったお金のほうが多くなっちゃった…。次はもっとうまくやりたいな。', 'Hmm, we paid more than we earned… Let\'s do better next time.');
  return { rows, net, hidden, tips, comment };
}

// ─── actions ───
// The seller's reply is stored as a key so it follows a language switch.
function sellerText(k) {
  return {
    over: L('えっ、そんなに！？ぜひお願いします！<span class="dim">（…ちょっと払いすぎかも？）</span>', 'Wow, that much!? Yes, please! <span class="dim">(…maybe that\'s paying too much?)</span>'),
    good: L('いいお話ですね。ぜひ前向きに考えます！', 'That\'s a nice offer. We\'ll think about it seriously!'),
    ok: L('うーん…ちょっと安いけど、くまさんならいいかな。前向きに考えます。', 'Hmm… it\'s a bit low, but for Mr. Kuma, okay. We\'ll think about it.'),
    close: L('うーん、おしい！もう少しだけ高くならない？', 'So close! Could you go a little higher?'),
    low: L('それは安すぎます！お店の価値をちゃんと見てほしいな。', 'That\'s way too low! Please look at what the shop is really worth.'),
  }[k];
}
function sellerReply() {
  const s = T(), o = S.offer;
  S.loiTries++;
  if (o >= s.min) {
    S.sellerMsg = o >= s.ask ? 'over' : o >= s.min + 40 ? 'good' : 'ok';
    S.price = o;
    return go('loiOk');
  }
  if (S.loiTries >= 3) {
    S.refused.push(s.id);
    S.sellerMsg = null;
    alert(L(`${s.ownerName}「何度もありがとう。でも、その値段ではゆずれません。ごめんなさい。」\n\nほかの本命のお店に声をかけよう。`,
      `${s.en.ownerName}: "Thank you for trying so many times. But we can't sell at that price. Sorry."\n\nLet's try another shop on your short list.`));
    S.target = null;
    if (S.short.every(id => S.refused.includes(id))) {
      alert(L('本命の3つ全部にことわられてしまった…。お店さがしからやり直そう。', 'All 3 shops on your short list said no… Let\'s start the search again.'));
      S.short = []; S.refused = []; return go('list');
    }
    return go('nda');
  }
  S.sellerMsg = o >= s.min * 0.85 ? 'close' : 'low';
  render();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.lang) return setLang(d.lang);
  if (d.goal) { S.goal = d.goal; return render(); }
  if (d.crit) { S.criteria = S.criteria.includes(d.crit) ? S.criteria.filter(k => k !== d.crit) : [...S.criteria, d.crit]; return render(); }
  if (d.short) {
    if (S.short.includes(d.short)) S.short = S.short.filter(k => k !== d.short);
    else if (S.short.length < 3) S.short.push(d.short);
    return render();
  }
  if (d.target) {
    const s = shop(d.target);
    S.target = d.target; S.loiTries = 0; S.sellerMsg = null;
    S.offer = Math.min(BUDGET, Math.round(estimate(s) / 10) * 10);
    S.opened = []; S.extra = 0; S.nego = {}; S.daSigned = false;
    return go('loi');
  }
  if (d.dd !== undefined) { S.opened.push(+d.dd); S.justOpened = +d.dd; render(); S.justOpened = null; return; }
  if (d.nego !== undefined) {
    S.nego[d.nego] = d.v;
    return render();
  }
  if (d.pmi) { S.pmi = S.pmi.includes(d.pmi) ? S.pmi.filter(k => k !== d.pmi) : [...S.pmi, d.pmi]; return render(); }
  switch (d.act) {
    case 'start': return go('goal');
    case 'toList': return go('list');
    case 'toNda': S.ndaSigned = false; S.refused = []; return go('nda');
    case 'signNda': S.ndaSigned = true; return render();
    case 'sendLoi': return sellerReply();
    case 'toDd': return go('dd');
    case 'moreDd': S.extra++; return render();
    case 'toNego': return go('nego');
    case 'walkAway':
      if (!confirm(L('このお店を買うのをやめて、ほかの本命のお店に声をかけますか？\n（調査代は返ってきません）',
        'Stop buying this shop and try another one on your short list?\n(Money spent on checks won\'t come back.)'))) return;
      S.sunk += S.extra * EXTRA_DD_COST;
      S.refused.push(S.target); S.target = null;
      if (S.short.every(id => S.refused.includes(id))) { S.short = []; S.refused = []; return go('list'); }
      return go('nda');
    case 'toDa': S.price = S.offer - priceCuts(); S.daSigned = false; return go('da');
    case 'signDa': S.daSigned = true; return render();
    case 'toClosing': return go('closing');
    case 'toPmi': S.pmi = []; return go('pmi');
    case 'toResult': return go('result');
    case 'again': reset(); return go('title');
  }
});

document.addEventListener('input', e => {
  if (e.target.id !== 'offer') return;
  S.offer = +e.target.value;
  $('offerOut').textContent = money(S.offer);
  const pct = (S.offer - 100) / (BUDGET - 100) * 100;
  $('offerMark').style.left = `${pct}%`;
});

render();
</script>
