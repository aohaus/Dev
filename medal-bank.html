<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8fa3c4">
<title>MEDAL BANK メダルバンク</title>
<link rel="icon" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-top: #5d7396;
  --bg-bot: #dfe5ee;
  --cab: #f3f3ef;
  --cab-shade: #d6d7d1;
  --front: #ea4a22;
  --front-dark: #b8300f;
  --frame: #2a1d18;
  --gold: #ffd21a;
  --lcd: #eef4fb;
  --lcd-ink: #1b2533;
  --lcd-dim: #5b6778;
  --lcd-line: #c9d5e3;
  --accent: #e8471f;
  --ok: #17a45a;
  --ng: #d8141c;
}
html, body { min-height: 100%; }
body {
  background: linear-gradient(180deg, var(--bg-top) 0%, #9fb0c9 45%, var(--bg-bot) 100%) fixed;
  background-color: #9fb0c9;
  font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  font-weight: 800;
  color: var(--lcd-ink);
  -webkit-tap-highlight-color: transparent;
  padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- cabinet ---------- */
.cab { width: 100%; max-width: 460px; margin: 0 auto; filter: drop-shadow(0 18px 24px rgba(20,30,50,.35)); }
.cap {
  height: 18px; border-radius: 6px 6px 0 0;
  background: linear-gradient(90deg, #d81d14, #f0331f 70%, #c91a12);
}
.marquee {
  position: relative; text-align: center; padding: 12px 10px 10px;
  background: linear-gradient(180deg, #ffffff 0%, #eef6f4 60%, #cfe9e6 100%);
  border-bottom: 3px solid #b9c7c4;
}
.marquee svg { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); width: 76%; height: 44px; }
.marquee h1 {
  position: relative; font-family: 'Arial Black', 'Arial', sans-serif; font-style: italic; font-weight: 900;
  font-size: clamp(30px, 9vw, 44px); letter-spacing: .08em; line-height: 1.1;
  color: var(--gold); -webkit-text-stroke: 2px #2c2400; paint-order: stroke fill;
  text-shadow: 0 3px 0 #7a6200;
}
.marquee p {
  position: relative; display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 900; color: #2c2400; letter-spacing: .1em;
}
.marquee p::before, .marquee p::after { content: ''; width: 34px; height: 3px; background: repeating-linear-gradient(90deg, #c8a000 0 6px, transparent 6px 9px); }

.front {
  display: grid; grid-template-columns: 1fr 40px; gap: 10px;
  padding: 14px 12px 16px; background: linear-gradient(180deg, var(--front), #e2401a);
}
.frame { border: 3px solid var(--frame); border-radius: 4px; padding: 8px; background: rgba(0,0,0,.06); min-width: 0; }
.frame .label { font-family: Georgia, serif; font-size: 12px; letter-spacing: .12em; color: #3a1206; margin: 0 0 6px 4px; }
.lcd {
  border: 5px solid #3b3f46; border-radius: 6px; background: var(--lcd);
  box-shadow: inset 0 2px 8px rgba(0,0,0,.25);
  padding: 12px; min-height: 280px; overflow: hidden;
}
.side { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 70px; }
.lock {
  width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #555, #111);
  display: grid; place-items: center; box-shadow: 0 2px 0 rgba(0,0,0,.35);
}
.lock::after { content: ''; width: 6px; height: 16px; border-radius: 3px; background: #c9c9c9; }
.slot-deco { width: 30px; height: 60px; border-radius: 4px; background: #3b3f46; display: grid; place-items: center; }
.slot-deco::after { content: ''; width: 4px; height: 38px; border-radius: 2px; background: #0c0d10; }

.base {
  background: linear-gradient(90deg, var(--cab-shade), var(--cab) 12%, var(--cab) 88%, var(--cab-shade));
  padding: 14px 16px 16px; border-radius: 0 0 4px 4px; position: relative;
}
.tray {
  width: 150px; height: 60px; margin: 0 auto 14px; border-radius: 4px;
  background: linear-gradient(180deg, #666, #2b2d33); border: 5px solid #bfc3c8;
  display: grid; place-items: center; color: #d6d9de; font-size: 11px; letter-spacing: .08em;
}
.games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.games a {
  display: block; text-align: center; text-decoration: none; color: #333; font-size: 12px; line-height: 1.3;
  background: #fff; border: 2px solid #c8ccd2; border-radius: 8px; padding: 8px 4px;
}
.games a b { display: block; font-size: 18px; }
.home { display: block; margin-top: 10px; text-align: center; text-decoration: none; color: #fff; font-size: 14px;
  background: linear-gradient(#3a1d63, #170d2e); border-radius: 8px; padding: 10px; box-shadow: 0 0 10px rgba(255,79,163,.4); }
.toprow { max-width: 460px; margin: -6px auto 8px; display: flex; justify-content: flex-end; }
.langbtn { border: 1px solid rgba(255,255,255,.6); background: rgba(255,255,255,.85); color: #2c2400;
  border-radius: 99px; padding: 4px 14px; font-size: 13px; font-weight: 900; }
.feet { display: flex; justify-content: space-between; padding: 0 22px; }
.feet i { width: 26px; height: 8px; background: #222; border-radius: 0 0 4px 4px; }
.note { max-width: 460px; margin: 14px auto 0; font-size: 12px; font-weight: 700; color: #2b3647; line-height: 1.6; }

/* ---------- screen UI ---------- */
.lcd h2 { font-size: 16px; margin-bottom: 8px; }
.lcd h3 { font-size: 13px; margin: 12px 0 6px; color: var(--lcd-dim); }
.who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.who b { font-size: 18px; }
.cup { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; margin: 10px 0 4px; }
.cup > div { background: #0e1420; border-radius: 6px; padding: 6px 10px; }
.cup span { display: block; font-size: 11px; color: #9fb0c9; }
.cup output { display: block; text-align: right; font: 700 26px/1.1 'Courier New', monospace; color: #ffb13b; }
.btn.svc { flex: 1 1 100%; white-space: normal; background: linear-gradient(#ffe36b, #f0b400); color: #5a3400; }
.row > #depN, .row > #wdN { flex: 1 1 40px; }
.bal { margin: 10px 0 4px; background: #0e1420; color: #ffb13b; border-radius: 6px; padding: 8px 12px;
  display: flex; justify-content: space-between; align-items: baseline; }
.bal span { font-size: 12px; color: #9fb0c9; }
.bal output { font: 700 30px/1.1 'Courier New', monospace; }
.cards { display: flex; flex-wrap: wrap; gap: 4px; font-size: 13px; }
.cards span { background: #fff; border: 1px solid var(--lcd-line); border-radius: 6px; padding: 1px 6px; }
.cards span.off { opacity: .3; }
.tabs { display: flex; gap: 4px; margin: 12px 0 8px; border-bottom: 2px solid var(--lcd-line); }
.tabs button { flex: 1 1 0; white-space: nowrap; border: 0; background: none; padding: 6px 2px; font-size: 12.5px; color: var(--lcd-dim); border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.row > input, .row > select { flex: 1 1 90px; min-width: 0; }
input, select, textarea { padding: 7px 9px; border-radius: 8px; border: 1px solid #aab6c6; background: #fff; font-size: 16px; }
textarea { width: 100%; font: 12px/1.4 'Courier New', monospace; resize: vertical; word-break: break-all; }
.pin { letter-spacing: .3em; max-width: 140px; }
.btn { border: 0; border-radius: 8px; padding: 7px 12px; font-weight: 900; background: var(--accent); color: #fff; white-space: nowrap; }
.btn.sub { background: #d9e1ec; color: var(--lcd-ink); }
.btn.ng { background: var(--ng); }
.btn:disabled { opacity: .45; cursor: default; }
.user.moved { flex-wrap: wrap; }
.user.moved .nm { flex-basis: 100%; }
.user .acts { display: flex; gap: 6px; }
.mini { white-space: nowrap; border: 1px solid currentColor; background: none; border-radius: 99px; padding: 1px 10px; font-size: 12px; }
.users { display: grid; gap: 6px; }
.user { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: #fff; border: 1px solid var(--lcd-line); }
.user.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.user .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user small { color: var(--lcd-dim); font-size: 11px; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 99px; background: #ffe7a3; color: #6a4a00; }
.dim { color: var(--lcd-dim); font-size: 12px; font-weight: 700; line-height: 1.55; }
.flash { margin-top: 8px; padding: 6px 10px; border-radius: 8px; font-size: 13px; color: #fff; }
.flash.ok { background: var(--ok); }
.flash.ng { background: var(--ng); }
.box { background: #fff; border: 1px solid var(--lcd-line); border-radius: 8px; padding: 10px; margin-top: 8px; }

.log { list-style: none; max-height: 360px; overflow: auto; border: 1px solid var(--lcd-line); border-radius: 8px; background: #fff; }
.log li { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; padding: 6px 8px; border-bottom: 1px solid #edf1f6; font-size: 12.5px; cursor: pointer; }
.log li:last-child { border-bottom: 0; }
.log li:hover { background: #f5f8fc; }
.log .t { color: var(--lcd-dim); font-size: 11px; font-weight: 700; }
.log .ty { font-size: 11px; padding: 0 6px; border-radius: 4px; color: #fff; justify-self: start; }
.log .ty.deposit { background: #1e5be6; }
.log .ty.withdraw { background: #e8471f; }
.log .ty.adjust { background: #6b7a90; }
.log .ty.service { background: #d99a00; }
.log .n { text-align: right; font-family: 'Courier New', monospace; font-weight: 700; }
.log .n.plus { color: #1e5be6; }
.log .n.minus { color: #e8471f; }
.log .sub { grid-column: 1 / -1; color: var(--lcd-dim); font-size: 11px; font-weight: 700; }
.log li.editing { cursor: default; background: #fff8e6; }
.log .edit { grid-column: 1 / -1; }
.empty { padding: 16px; text-align: center; color: var(--lcd-dim); font-size: 13px; }
.qr { margin-top: 8px; text-align: center; }
.qr svg { width: 200px; height: 200px; background: #fff; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg-top: #1c2535; --bg-bot: #3a475c; }
  :root:not([data-theme="light"]) body { background-color: #2a3446; }
  :root:not([data-theme="light"]) .note { color: #d6deea; }
}
:root[data-theme="dark"] { --bg-top: #1c2535; --bg-bot: #3a475c; }
</style>
<script src="medal-bank.js?v=5"></script>
</head>
<body>
<div class="toprow"><button class="langbtn" id="langBtn">English</button></div>
<div class="cab">
  <div class="cap"></div>
  <div class="marquee">
    <svg viewBox="0 0 300 44" preserveAspectRatio="none" aria-hidden="true">
      <path d="M8,40 C60,-6 240,-6 292,34" fill="none" stroke="#e9b400" stroke-width="3"/>
      <path d="M40,40 C90,6 220,6 270,30" fill="none" stroke="#ffe36b" stroke-width="2"/>
    </svg>
    <h1>MEDAL BANK</h1>
    <p data-en="Medal deposit machine">メダル預け払い機</p>
  </div>
  <div class="front">
    <div class="frame">
      <div class="label">MEDAL BANK</div>
      <div class="lcd" id="lcd"></div>
    </div>
    <div class="side" aria-hidden="true">
      <div class="lock"></div>
      <div class="slot-deco"></div>
    </div>
  </div>
  <div class="base">
    <div class="tray" data-en="Medal tray">メダル払い出し口</div>
    <div class="games" id="games"></div>
    <a class="home" href="game-center.html" data-en="🏠 Back to Game Centre">🏠 Game Centre へもどる</a>
  </div>
  <div class="feet"><i></i><i></i></div>
</div>
<p class="note" id="note"></p>

<script>
'use strict';
const MB = MedalBank;
const { esc, GAMES, TYPE_NAME, EFFECT } = MB;
const T = MB.t || (ja => ja);   // T('日本語', 'English')
const $ = id => document.getElementById(id);
const lcd = $('lcd');

// Static labels on the cabinet carry their English text in data-en.
document.querySelectorAll('[data-en]').forEach(el => { el.dataset.ja = el.textContent; });
function renderStatic() {
  document.querySelectorAll('[data-en]').forEach(el => { el.textContent = T(el.dataset.ja, el.dataset.en); });
  $('note').innerHTML = T(
    '手持ちメダルは全部のゲームで共通です。遊ぶ前にここで引き出し（またはサービスメダル）、帰るときに預けてください。<br>データはこの端末のブラウザに保存されます。別の端末へ移すときは「引き継ぎ」でコードを発行し、移動先でパスワード（3桁）と一緒に読み込んでください。発行した時点でこの端末のアカウントはロックされます。',
    'Medals in hand are shared by every game. Withdraw here (or take service medals) before playing, and deposit when you leave.<br>Data is saved in this browser on this device. To move to another device, issue a code under "Transfer" and load it there with the 3-digit password. Once issued, the account is locked on this device.');
  $('langBtn').textContent = T('English', '日本語');
  $('games').innerHTML = Object.values(GAMES).map(g =>
    `<a href="${g.url}"><b>${g.url.startsWith('janken') ? '✊' : g.url.startsWith('sigma') ? '🃏' : '🎡'}</b>${esc(T(g.short, g.en || g.short))}</a>`).join('');
}
$('langBtn').addEventListener('click', () => MB.setLang(MB.lang() === 'en' ? 'ja' : 'en'));

// ---------------- view state ----------------
const view = {
  screen: 'home',     // home | create | import
  tab: 'log',         // log | cards | user | move
  pick: null,         // user id chosen on the login list
  editing: null,      // log entry id being edited
  code: null,         // freshly issued transfer code
  importCode: '',
  flash: null,
};
function readHash() {
  const m = location.hash.match(/[#&]t=([^&]+)/);
  if (m) { view.screen = 'import'; view.importCode = decodeURIComponent(m[1]); view.code = null; }
  return !!m;
}
readHash();
window.addEventListener('hashchange', () => { if (readHash()) render(); });

// After an error the screen is redrawn with what was typed still in place.
function flash(msg, ok = false) { view.flash = { msg, ok }; render(!ok); }
function run(fn) {
  return async (...a) => {
    try { await fn(...a); }
    catch (e) { if (e instanceof MB.BankError) flash(e.message); else { console.error(e); flash(T('エラーが発生しました', 'Something went wrong')); } }
  };
}
const val = sel => (lcd.querySelector(sel) || {}).value || '';
const fmtTime = ms => { const d = new Date(ms); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const gameName = g => MB.gameName ? MB.gameName(g) : (GAMES[g] || {}).short || 'バンク';
const typeName = k => MB.typeName ? MB.typeName(k) : TYPE_NAME[k];
const noteText = n => MB.noteText ? MB.noteText(n) : n;
const pin = (id, ph = T('3桁', '3 digits')) => `<input class="pin" id="${id}" type="password" inputmode="numeric" maxlength="3" placeholder="${ph}" autocomplete="off">`;

// ---------------- screens ----------------
function render(keepInputs = false) {
  const typed = {};
  if (keepInputs) lcd.querySelectorAll('input[id], textarea[id], select[id]').forEach(el => { typed[el.id] = el.value; });
  renderStatic();
  const u = MB.current();
  let h;
  if (view.screen === 'create') h = createScreen();
  else if (view.screen === 'import') h = importScreen();
  else h = u ? userScreen(u) : loginScreen();
  if (view.screen === 'home') h += specialBox();
  if (view.flash) h += `<p class="flash ${view.flash.ok ? 'ok' : 'ng'}">${esc(view.flash.msg)}</p>`;
  view.flash = null;
  lcd.innerHTML = h;
  for (const [id, v] of Object.entries(typed)) { const el = lcd.querySelector('#' + id); if (el) el.value = v; }
  if (view.code) drawQr();
}

function specialBox() {
  if (typeof MB.specialDay !== 'function') return '';   // stale cached medal-bank.js
  if (MB.specialDay()) return `<div class="box"><b>${T('★ スペシャルデー', '★ Special day')}</b>
    <p class="dim">${T('きょうはサービスメダルを何回でも受け取れます（日付が変わると自動で元に戻ります）。', 'Service medals are unlimited today (back to normal automatically tomorrow).')}</p>
    <div class="row"><button class="btn sub" data-a="endSpecial">${T('いま終了する', 'End now')}</button></div></div>`;
  return `<h3>${T('スペシャルコード', 'Special code')}</h3>
    <div class="row"><input id="special" type="text" autocomplete="off" autocapitalize="characters" placeholder="${T('コード', 'Code')}"><button class="btn" data-a="special">${T('使う', 'Use')}</button></div>`;
}

// The counter: medals in hand, and the daily service medals.
function counter(u) {
  const cup = MB.hand(), svc = MB.serviceAvailable(), sp = MB.specialDay && MB.specialDay();
  let h = `<div class="cup"><div><span>${T('手持ち', 'In hand')}</span><output>${cup.toLocaleString()}</output></div>`;
  if (u) h += `<div><span>${T('預け入れ残高', 'Balance')}</span><output>${u.balance.toLocaleString()}</output></div>`;
  h += `</div>`;
  if (u) h += `
    <div class="row"><input id="depN" type="number" min="1" inputmode="numeric" placeholder="${T('枚数', 'Medals')}"><button class="btn sub" data-a="allIn">${T('全部', 'All')}</button><button class="btn" data-a="dep">${T('預ける', 'Deposit')}</button></div>
    <div class="row"><input id="wdN" type="number" min="1" inputmode="numeric" placeholder="${T('枚数', 'Medals')}"><button class="btn sub" data-a="allOut">${T('全部', 'All')}</button><button class="btn" data-a="wd">${T('引き出す', 'Withdraw')}</button></div>`;
  h += `<div class="row"><button class="btn svc" data-a="svc" ${svc ? '' : 'disabled'}>${
    sp ? T(`サービスメダル +${MB.SERVICE_MEDALS}（きょうは何回でも！）`, `Service medals +${MB.SERVICE_MEDALS} (unlimited today!)`)
    : svc ? T(`サービスメダル +${MB.SERVICE_MEDALS}（1日1回）`, `Service medals +${MB.SERVICE_MEDALS} (once a day)`)
    : T('サービスメダルは受け取り済み（また明日）', 'Service medals taken (come back tomorrow)')}</button></div>`;
  return h;
}

function loginScreen() {
  const list = MB.users();
  let h = `<h2>${T('ゲスト', 'Guest')}</h2>${counter(null)}
    <p class="dim">${T('ログインすると手持ちメダルを預けられます。ゲストの手持ちは、ログインした人に引き継がれます。', 'Log in to deposit your medals. Medals held as a guest go to whoever logs in.')}</p>
    <h2 style="margin-top:14px">${T('ユーザーをえらんでください', 'Choose a user')}</h2><div class="users">`;
  if (!list.length) h += `<p class="dim">${T('まだユーザーがいません。「新しく作る」から始めましょう。', 'No users yet. Start with "New user".')}</p>`;
  for (const x of list) {
    if (x.moved) {
      h += `<div class="user moved"><span class="nm">${esc(x.name)} <span class="tag">${T('引き継ぎ済み', 'Moved')}</span><br><small>${T(`${fmtTime(x.movedAt)} にコード発行`, `Code issued ${fmtTime(x.movedAt)}`)}</small></span>
        <span class="acts"><button class="mini" data-a="showCode" data-id="${x.id}">${T('コード', 'Code')}</button>
        <button class="mini" data-a="cancelMove" data-id="${x.id}">${T('取り消し', 'Undo')}</button>
        <button class="mini" data-a="forget" data-id="${x.id}">${T('削除', 'Remove')}</button></span></div>`;
    } else {
      h += `<div class="user ${view.pick === x.id ? 'sel' : ''}" data-a="pick" data-id="${x.id}"><span class="nm">👤 ${esc(x.name)}</span><small>${T('タップしてログイン', 'Tap to log in')}</small></div>`;
      if (view.pick === x.id) h += `<div class="row">${pin('pin')}<button class="btn" data-a="login">${T('ログイン', 'Log in')}</button></div>`;
    }
  }
  h += `</div>`;
  if (view.code) h += codeBox(view.code);
  h += `<div class="row" style="margin-top:12px"><button class="btn" data-a="toCreate">${T('新しく作る', 'New user')}</button><button class="btn sub" data-a="toImport">${T('引き継ぎコードを読み込む', 'Load a transfer code')}</button></div>`;
  return h;
}

function createScreen() {
  return `<h2>${T('ユーザー作成', 'New user')}</h2>
    <p class="dim">${T('なまえ（12文字まで）と、数字3桁のパスワードを決めてください。パスワードはログインと引き継ぎに使います。', 'Choose a name (up to 12 characters) and a 3-digit password. The password is used to log in and to transfer.')}</p>
    <div class="row"><input id="name" type="text" maxlength="12" placeholder="${T('なまえ', 'Name')}" autocomplete="off"></div>
    <div class="row">${pin('pin')}${pin('pin2', T('もう一度', 'Again'))}</div>
    <div class="row"><button class="btn" data-a="create">${T('作成する', 'Create')}</button><button class="btn sub" data-a="home">${T('もどる', 'Back')}</button></div>`;
}

function importScreen() {
  return `<h2>${T('引き継ぎコードを読み込む', 'Load a transfer code')}</h2>
    <p class="dim">${T('元の端末で発行したコード（またはURL）を貼り付けて、そのユーザーのパスワードを入れてください。', 'Paste the code (or URL) issued on the other device, then enter that user\'s password.')}</p>
    <textarea id="code" rows="4" placeholder="MB1.…">${esc(view.importCode)}</textarea>
    <div class="row">${pin('pin')}
      <button class="btn" data-a="doImport">${T('読み込む', 'Load')}</button><button class="btn sub" data-a="home">${T('もどる', 'Back')}</button></div>`;
}

function userScreen(u) {
  let h = `<div class="who">👤 <b>${esc(u.name)}</b><button class="mini" data-a="logout">${T('ログアウト / 切り替え', 'Log out / switch')}</button></div>
    ${counter(u)}
    <div class="tabs">${[['log', T('記録', 'History')], ['cards', T('カード', 'Cards')], ['user', T('設定', 'Settings')], ['move', T('引き継ぎ', 'Transfer')]].map(([k, l]) =>
      `<button class="${view.tab === k ? 'on' : ''}" data-a="tab" data-id="${k}">${l}</button>`).join('')}</div>`;
  if (view.tab === 'log') h += logTab();
  else if (view.tab === 'cards') h += cardsTab();
  else if (view.tab === 'user') h += userTab(u);
  else h += moveTab();
  return h;
}

function logTab() {
  const log = MB.log().reverse();
  let h = `<ul class="log">`;
  if (!log.length) h += `<li class="empty" style="display:block;cursor:default">${T('まだ記録がありません', 'No history yet')}</li>`;
  for (const e of log) {
    const eff = EFFECT[e.type] * e.n;
    const sign = e.type === 'service' ? `+${e.n}` : eff > 0 ? `+${eff}` : eff < 0 ? `${eff}` : '±0';
    const cls = e.type === 'service' ? '' : eff > 0 ? 'plus' : eff < 0 ? 'minus' : '';
    if (view.editing === e.id) {
      h += `<li class="editing"><span class="t">${fmtTime(e.t)}</span><span>${esc(gameName(e.game))}</span><span></span>
        <div class="edit">
          <div class="row"><select id="eType">${Object.keys(TYPE_NAME).map(k => `<option value="${k}" ${k === e.type ? 'selected' : ''}>${typeName(k)}</option>`).join('')}</select>
            <input id="eN" type="number" min="0" inputmode="numeric" value="${e.n}"></div>
          <div class="row"><input id="eNote" type="text" maxlength="40" placeholder="${T('メモ', 'Note')}" value="${esc(e.note || '')}"></div>
          <div class="row"><button class="btn" data-a="saveEdit" data-id="${e.id}">${T('保存', 'Save')}</button><button class="btn sub" data-a="cancelEdit">${T('やめる', 'Cancel')}</button><button class="btn ng" data-a="delEntry" data-id="${e.id}">${T('削除', 'Delete')}</button></div>
          <p class="dim">${T('記録を変えると、残高もそれに合わせて計算しなおします。', 'Changing a record recalculates the balance to match.')}</p>
        </div></li>`;
    } else {
      h += `<li data-a="edit" data-id="${e.id}"><span class="ty ${e.type}">${typeName(e.type)}</span><span>${esc(gameName(e.game))}</span><span class="n ${cls}">${sign}</span>
        <span class="sub">${fmtTime(e.t)} ・ ${T('残高', 'bal.')} ${e.bal}${e.note ? ' ・ ' + esc(noteText(e.note)) : ''}${e.edited ? T(' ・ 編集済み', ' ・ edited') : ''}</span></li>`;
    }
  }
  h += `</ul><h3>${T('手動で追加（調整）', 'Add manually (adjustment)')}</h3>
    <div class="row"><input id="adjN" type="number" inputmode="numeric" placeholder="${T('枚数（マイナス可）', 'Medals (± OK)')}"><input id="adjNote" type="text" maxlength="40" placeholder="${T('メモ', 'Note')}"><button class="btn" data-a="addAdj">${T('追加', 'Add')}</button></div>
    <p class="dim">${T('記録をタップすると、種類・枚数・メモの編集や削除ができます。サービスメダルは手持ちに入るため残高は変わりません。', 'Tap a record to edit its type, amount or note, or delete it. Service medals go to your hand, so they don\'t change the balance.')}</p>`;
  return h;
}

function cardsTab() {
  const cards = MB.getCards('janken') || {};
  const owned = MB.JANKEN_CARDS.filter(c => cards[c.id]).length;
  return `<p class="dim">${T(`じゃんけんポップのカード ${owned} / ${MB.JANKEN_CARDS.length} 種類`, `JANKEN POP! cards: ${owned} / ${MB.JANKEN_CARDS.length} kinds`)}</p>
    <div class="cards">${MB.JANKEN_CARDS.map(c => cards[c.id]
      ? `<span>${c.em} ${esc(c.nm)} ×${cards[c.id]}</span>` : `<span class="off">？</span>`).join('')}</div>`;
}

function userTab(u) {
  return `<h3>${T('なまえを変える', 'Change name')}</h3>
    <div class="row"><input id="newName" type="text" maxlength="12" value="${esc(u.name)}">${pin('pinA')}<button class="btn" data-a="rename">${T('変更', 'Change')}</button></div>
    <h3>${T('パスワードを変える', 'Change password')}</h3>
    <div class="row">${pin('pinOld', T('いま', 'Current'))}${pin('pinNew', T('あたらしく', 'New'))}<button class="btn" data-a="repin">${T('変更', 'Change')}</button></div>
    <h3>${T('ユーザーを削除', 'Delete user')}</h3>
    <div class="row">${pin('pinDel')}<button class="btn ng" data-a="delUser">${T('削除する', 'Delete')}</button></div>
    <p class="dim">${T('削除すると残高・記録・カードはすべて消えます。', 'Deleting removes the balance, history and cards.')}</p>`;
}

function moveTab() {
  return `<p class="dim">${T('別の端末（iPad・別のスマホなど）へこのユーザーを移します。コードを発行すると、<b>この端末ではこのユーザーが使えなくなります</b>（同じメダルを二重に使えないように）。移動先で読み込めなかったときは、ログイン画面の「取り消し」で元に戻せます。',
    'Move this user to another device (an iPad, another phone…). Once the code is issued, <b>this user can no longer be used on this device</b> (so the same medals can\'t be spent twice). If it can\'t be loaded on the other device, use "Undo" on the login screen.')}</p>
    <div class="row">${pin('pinMove')}<button class="btn" data-a="doExport">${T('引き継ぎコードを発行', 'Issue a transfer code')}</button></div>`;
}

function codeBox(code) {
  const url = MB.transferUrl(code);
  return `<div class="box"><b>${T('引き継ぎコード', 'Transfer code')}</b>
    <p class="dim">${T('移動先の端末でこのURLを開くか、QRコードを読み取るか、コードを貼り付けてください。パスワード（3桁）も必要です。', 'On the other device, open this URL, scan the QR code, or paste the code. The 3-digit password is also needed.')}</p>
    <textarea rows="4" readonly id="codeText">${esc(url)}</textarea>
    <div class="row"><button class="btn" data-a="copy">${T('コピー', 'Copy')}</button>${navigator.share ? `<button class="btn sub" data-a="share">${T('共有…', 'Share…')}</button>` : ''}<button class="btn sub" data-a="hideCode">${T('とじる', 'Close')}</button></div>
    <div class="qr" id="qr"></div></div>`;
}

let qrLib = null;
function drawQr() {
  const el = $('qr'); if (!el) return;
  const draw = () => {
    try {
      const qr = qrcode(0, 'L');
      qr.addData(MB.transferUrl(view.code)); qr.make();
      el.innerHTML = qr.createSvgTag({ cellSize: 3, margin: 3, scalable: true });
    } catch (e) { el.innerHTML = `<p class="dim">${T('コードが長いためQRは表示できません。URLをコピーして送ってください。', 'The code is too long for a QR code. Copy the URL and send it instead.')}</p>`; }
  };
  if (window.qrcode) return draw();
  if (!qrLib) qrLib = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  qrLib.then(() => { if ($('qr')) draw(); }, () => {});
}

// ---------------- actions ----------------
const actions = {
  allIn() { $('depN').value = MB.hand(); },
  allOut() { $('wdN').value = MB.current().balance; },
  dep() { const n = +val('#depN'); MB.deposit(n); flash(T(`${n} 枚 預けました`, `Deposited ${n}`), true); },
  wd() { const n = +val('#wdN'); MB.withdraw(n); flash(T(`${n} 枚 引き出しました`, `Withdrew ${n}`), true); },
  svc() { const n = MB.claimService(); flash(T(`サービスメダル ${n} 枚！手持ちに入りました`, `${n} service medals added to your hand!`), true); },
  pick(id) { view.pick = view.pick === id ? null : id; render(); $('pin')?.focus(); },
  login() { const u = MB.login(view.pick, val('#pin')); view.pick = null; view.code = null; view.tab = 'log'; flash(T(`${u.name} さん、ようこそ！`, `Welcome, ${u.name}!`), true); },
  logout() { MB.logout(); view.editing = null; render(); },
  toCreate() { view.screen = 'create'; view.code = null; render(); $('name')?.focus(); },
  toImport() { view.screen = 'import'; view.code = null; render(); },
  home() { view.screen = 'home'; history.replaceState(null, '', location.pathname); render(); },
  create() {
    if (val('#pin') !== val('#pin2')) throw new MB.BankError(T('パスワードが一致しません', 'The passwords don\'t match'));
    const u = MB.createUser(val('#name'), val('#pin'));
    view.screen = 'home'; view.tab = 'log';
    flash(T(`${u.name} さんを作成しました`, `Created ${u.name}`), true);
  },
  async doImport() {
    const u = await MB.importCode(val('#code'), val('#pin'));
    view.screen = 'home'; view.importCode = ''; view.tab = 'log';
    history.replaceState(null, '', location.pathname);
    flash(T(`${u.name} さんを受け取りました（残高 ${u.balance} 枚）`, `Received ${u.name} (balance ${u.balance})`), true);
  },
  tab(id) { view.tab = id; view.editing = null; render(); },
  edit(id) { view.editing = id; render(); },
  cancelEdit() { view.editing = null; render(); },
  saveEdit(id) {
    MB.editLog(id, { type: val('#eType'), n: val('#eN'), note: val('#eNote') });
    view.editing = null; flash(T('記録を更新しました', 'Record updated'), true);
  },
  delEntry(id) {
    if (!confirm(T('この記録を削除しますか？残高も計算しなおします。', 'Delete this record? The balance will be recalculated.'))) return;
    MB.deleteLog(id); view.editing = null; flash(T('記録を削除しました', 'Record deleted'), true);
  },
  addAdj() { MB.addAdjust(val('#adjN'), val('#adjNote')); flash(T('調整を追加しました', 'Adjustment added'), true); },
  rename() { const u = MB.current(); MB.renameUser(u.id, val('#pinA'), val('#newName')); flash(T('なまえを変更しました', 'Name changed'), true); },
  repin() { const u = MB.current(); MB.changePin(u.id, val('#pinOld'), val('#pinNew')); flash(T('パスワードを変更しました', 'Password changed'), true); },
  delUser() {
    const u = MB.current();
    if (!MB.checkPin(u.id, val('#pinDel'))) throw new MB.BankError(T('パスワードがちがいます', 'Wrong password'));
    if (!confirm(T(`「${u.name}」を削除します。残高 ${u.balance} 枚・記録・カードはすべて消えます。よろしいですか？`,
      `Delete "${u.name}"? The balance (${u.balance}), history and cards will all be removed.`))) return;
    MB.deleteUser(u.id, val('#pinDel')); flash(T('削除しました', 'Deleted'), true);
  },
  async doExport() {
    const u = MB.current();
    if (!MB.checkPin(u.id, val('#pinMove'))) throw new MB.BankError(T('パスワードがちがいます', 'Wrong password'));
    if (!confirm(T(`「${u.name}」の引き継ぎコードを発行します。発行後、この端末では「${u.name}」が使えなくなります。よろしいですか？`,
      `Issue a transfer code for "${u.name}"? After this, "${u.name}" can no longer be used on this device.`))) return;
    view.code = await MB.exportUser(u.id, val('#pinMove'));
    flash(T('引き継ぎコードを発行しました', 'Transfer code issued'), true);
  },
  special() { MB.useSpecialCode(val('#special')); flash(T('スペシャルデー！きょうはサービスメダルが何回でも受け取れます', 'Special day! Service medals are unlimited today'), true); },
  endSpecial() { MB.endSpecial(); flash(T('スペシャルデーを終了しました', 'Special day ended'), true); },
  showCode(id) { view.code = MB.pendingCode(id); render(); },
  hideCode() { view.code = null; render(); },
  cancelMove(id) {
    if (!confirm(T('引き継ぎを取り消して、この端末で使えるように戻しますか？\n※移動先ですでに読み込んだ場合は、同じメダルが二重になります。',
      'Undo the transfer and use this user on this device again?\nNote: if it was already loaded on the other device, the medals will exist twice.'))) return;
    MB.cancelExport(id); view.code = null; flash(T('取り消しました', 'Transfer undone'), true);
  },
  forget(id) {
    if (!confirm(T('引き継ぎ済みのユーザーをこの端末から消しますか？（移動先のデータはそのままです）', 'Remove this moved user from this device? (The data on the other device stays.)'))) return;
    MB.deleteUser(id); view.code = null; render();
  },
  async copy() {
    const box = $('codeText');
    try { await navigator.clipboard.writeText(box.value); } catch (e) { box.select(); document.execCommand('copy'); }
    flash(T('コピーしました', 'Copied'), true);
  },
  async share() {
    try { await navigator.share({ title: T('MEDAL BANK 引き継ぎ', 'MEDAL BANK transfer'), url: MB.transferUrl(view.code) }); } catch (e) {}
  },
};

lcd.addEventListener('click', run(async e => {
  const el = e.target.closest('[data-a]');
  if (!el || !lcd.contains(el)) return;
  if (el.closest('.editing') && el.dataset.a === 'edit') return;
  await actions[el.dataset.a](el.dataset.id);
}));
lcd.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName === 'TEXTAREA') return;
  const btn = e.target.closest('.row')?.querySelector('.btn:not(.sub):not(.ng)');
  if (btn) { e.preventDefault(); btn.click(); }
});
MB.onChange(() => { if (!lcd.contains(document.activeElement) || document.activeElement === document.body) render(); });
render();
</script>
